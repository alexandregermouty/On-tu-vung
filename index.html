                 : u==="u4" ? "c.sent.svo"  : u==="u5" ? "c.part.nhe"
                 : u==="u6" ? "c.asp.da"    : u==="u7" ? "c.num.basic"
                 : u==="u8" ? "c.mod.core"  : u==="u9" ? "c.cmp.equal"
                 : "c.sent.svo";
    }
  });
  const conceptById = {}; CONCEPTS.forEach(c => conceptById[c.id] = c);
  const itemsByConcept = {};
  items.forEach(function(it){ (itemsByConcept[it.concept] = itemsByConcept[it.concept] || []).push(it); });
  const sentByConcept = {};
  COURSE_SENTENCES.forEach(function(s){ (sentByConcept[s.c] = sentByConcept[s.c] || []).push(s); });

  const pairItems = PAIRS.map(p => ({
    id:"pair:"+p.a+"|"+p.b, kind:"pair", vi:p.a+" / "+p.b, en:p.aEn+" · "+p.bEn,
    unit: p.merged ? "u3" : "u2", concept: p.merged ? "c.south.hoinga" : "c.read.sequence",
    pair:p, south:!!p.merged
  }));
  const judgeItems = JUDGES.map((j,i) => ({
    id:"judge:"+i, kind:"judge", vi:j.good, en:j.why,
    unit: j.south ? "u3" : "u4",
    concept: j.south ? "c.south.lexicon" : "c.sent.svo", judge:j, south:!!j.south
  }));
  const contrastItems = CONTRASTS.map(x => ({
    id:"ctr:"+x.id, kind:"contrast", vi:x.title, en:x.members.map(m=>m.en).join(" · "),
    unit: CONCEPTS.find(c=>c.id===x.concept) ? conceptById[x.concept].unit : "u4",
    concept:x.concept, contrast:x, south: x.merged || x.kind==="final" || x.kind==="tone" && x.merged
  }));
  const conceptItems = CONCEPTS.map(c => ({
    id:"cpt:"+c.id, kind:"concept", vi:c.title, en:c.rule.slice(0,90),
    unit:c.unit, concept:c.id, ref:c, south: c.unit==="u3"
  }));
  const survivalItems = SURVIVAL.map((s,i) => ({
    id:"srv:"+i, kind:"phrase", vi:s.vi, en:s.en, unit:"u10", concept:s.c,
    ex:{vi:s.vi,en:s.en}, survival:true
  }));
  const dialogueItems = DIALOGUES.map(d => ({
    id:"dlg:"+d.id, kind:"dialogue", vi:d.title, en:d.setting,
    unit: conceptById[d.concept] ? conceptById[d.concept].unit : "u4",
    concept:d.concept, dialogue:d
  }));

  const all = items.map(x => Object.assign({kind:"word"}, x))
                   .concat(pairItems, contrastItems, judgeItems, conceptItems, survivalItems, dialogueItems);
  const byId = {}; all.forEach(x => byId[x.id] = x);

  return {
    units:UNITS, concepts:CONCEPTS, conceptById:conceptById,
    words:items, all:all, byId:byId,
    itemsByConcept:itemsByConcept, sentencesByConcept:sentByConcept,
    sentences:COURSE_SENTENCES, dialogues:DIALOGUES, contrasts:CONTRASTS,
    pron:PRON, scenarios:SCENARIOS, survival:SURVIVAL, classes:CLASSES
  };
})();

/* ── the five skills, and which exercise trains which ─────────────────── */
const SKILLS = [
  {id:"recognition", label:"Recognition", blurb:"you see it and know what it means"},
  {id:"recall",      label:"Recall",      blurb:"you produce it from the English"},
  {id:"production",  label:"Production",  blurb:"you write or say it unaided"},
  {id:"listening",   label:"Listening",   blurb:"you catch it in speech"},
  {id:"context",     label:"Contextual",  blurb:"you use it inside a sentence"}
];
/* exercise type → {skill, ladder level it belongs to} */
const TYPES = {
  mc_vi_en:     {skill:"recognition", level:1, label:"Meaning"},
  mc_en_vi:     {skill:"recall",      level:1, label:"Say it in Vietnamese"},
  two_choice:   {skill:"recognition", level:2, label:"Which of the two"},
  contrast_mc:  {skill:"recognition", level:2, label:"Tell them apart"},
  pair_ear:     {skill:"listening",   level:2, label:"Which did you hear"},
  pair_eye:     {skill:"recall",      level:2, label:"Same sound, which word"},
  tone_id:      {skill:"listening",   level:2, label:"Which tone"},
  south_form:   {skill:"recall",      level:2, label:"Written north → spoken south"},
  odd:          {skill:"recognition", level:2, label:"Odd one out"},
  gap:          {skill:"context",     level:3, label:"Fill the gap"},
  place:        {skill:"context",     level:4, label:"Where does it go"},
  listen_word:  {skill:"listening",   level:2, label:"Hear the word"},
  listen_sent:  {skill:"listening",   level:4, label:"Hear the sentence"},
  listen_type:  {skill:"listening",   level:6, label:"Hear it and write it"},
  build:        {skill:"context",     level:5, label:"Reorder the sentence"},
  translate_h:  {skill:"production",  level:6, label:"Translate, with a hint"},
  translate:    {skill:"production",  level:7, label:"Translate"},
  error_fix:    {skill:"production",  level:7, label:"Find the mistake"},
  judge:        {skill:"context",     level:5, label:"Which sentence is right"},
  judge_concept:{skill:"context",     level:3, label:"Concept check"},
  free:         {skill:"production",  level:8, label:"Say it yourself"},

};

/* ── state ────────────────────────────────────────────────────────────── */
const KEY = "vivu:alexandre:v3";
const DAY = 86400000;
let S = {
  v:3,
  profile:{name:"Alexandre"},
  rev:{},              /* itemId -> review record */
  concept:{},          /* conceptId -> {fails, passes, lastFail, taught, streak} */
  notes:{},            /* itemId -> {star, hard, text} */
  mistakes:[],         /* rolling log */
  log:[],              /* per-day counters */
  diag:[],             /* weekly diagnostics */
  xp:0, streak:0, streakDay:null,
  southernMode:true, voice:null, rate:0.9, autoplay:true, readSentence:true,
  dailyMinutes:12, lastPlan:null, session:null
};
let storeMode = "memory";
function probeLocal(){
  try{ localStorage.setItem("vivu:probe","1"); localStorage.removeItem("vivu:probe"); return true; }catch(e){ return false; }
}
async function load(){
  if (probeLocal()) storeMode = "local";
  else if (window.storage) storeMode = "claude";
  try{
    let raw = null;
    if (storeMode === "local") raw = localStorage.getItem(KEY) || migrateV2();
    else if (storeMode === "claude"){ const r = await window.storage.get(KEY); raw = r && r.value; }
    if (raw) Object.assign(S, JSON.parse(raw));
  }catch(e){}
}
/* an older install keeps its boxes — they seed recognition */
function migrateV2(){
  try{
    const old = localStorage.getItem("vivu:state:v1");
    if (!old) return null;
    const o = JSON.parse(old);
    if (!o || !o.prog) return null;
    Object.keys(o.prog).forEach(function(id){
      const p = o.prog[id];
      const r = rec(id);
      r.skills.recognition.n = p.seen||0;
      r.skills.recognition.ok = p.right||0;
      r.skills.recognition.m = Math.min(1, (p.box||0)/4);
      r.reps = p.seen||0; r.lapses = p.wrong||0;
      r.due = p.due || 0; r.ivl = Math.max(1,(p.box||0));
    });
    S.xp = o.xp || 0; S.streak = o.streak || 0; S.streakDay = o.streakDay || null;
    return JSON.stringify(S);
  }catch(e){ return null; }
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async function(){
    const raw = JSON.stringify(S);
    try{
      if (storeMode === "local") localStorage.setItem(KEY, raw);
      else if (storeMode === "claude") await window.storage.set(KEY, raw);
    }catch(e){ storeMode = "memory"; }
  }, 300);
}
function storeNote(){
  if (storeMode === "local")  return {cls:"ok-note", txt:"Progress is saved on this device."};
  if (storeMode === "claude") return {cls:"ok-note", txt:"Progress is saved inside this Claude conversation."};
  return {cls:"warn", txt:"Progress is not being saved. Serve the file over https and it will stick."};
}

/* ── the review record ────────────────────────────────────────────────── */
function blankSkill(){ return {n:0, ok:0, m:0, rt:0, due:0, ivl:0}; }
function rec(id){
  if (!S.rev[id]) S.rev[id] = {
    ease:2.3, ivl:0, due:0, reps:0, lapses:0, run:0, last:0,
    level:1, rtAvg:0, rtN:0, conf:{knew:0, unsure:0, guess:0},
    passed:[], failed:[],
    skills:{recognition:blankSkill(), recall:blankSkill(), production:blankSkill(),
            listening:blankSkill(), context:blankSkill()}
  };
  return S.rev[id];
}
function cRec(id){
  if (!S.concept[id]) S.concept[id] = {fails:0, passes:0, run:0, lastFail:0, taught:0, lastTaught:0};
  return S.concept[id];
}
function mastery(id, skill){ return rec(id).skills[skill].m; }
function overall(id){
  const r = rec(id), s = r.skills;
  return (s.recognition.m*0.2 + s.recall.m*0.25 + s.context.m*0.25 + s.listening.m*0.15 + s.production.m*0.15);
}
/* honest status, not a badge */
function status(id){
  const r = S.rev[id];
  if (!r || r.reps === 0) return "new";
  const o = overall(id);
  const overdue = r.due ? (Date.now() - r.due) / Math.max(DAY, r.ivl*DAY) : 0;
  if (o >= 0.8 && r.run >= 3) return "mastered";
  if (o >= 0.55 && overdue < 1) return "stable";
  if (overdue >= 1 || (o >= 0.3 && o < 0.55)) return "fading";
  return "weak";
}
const STATUS_GLYPH = {mastered:"●", stable:"●", fading:"◐", weak:"○", new:"·"};
const STATUS_COLOR = {mastered:"var(--jade)", stable:"var(--gold)", fading:"rgba(200,161,90,.5)",
                      weak:"var(--cinnabar)", new:"var(--dimmer)"};

/* hesitation bands, as specified */
function band(ms){
  if (ms < 2000) return "automatic";
  if (ms < 5000) return "normal";
  if (ms < 10000) return "hesitant";
  return "weak retrieval";
}
function fluencyOf(id){
  const r = S.rev[id];
  if (!r || !r.rtN) return null;
  const t = r.rtAvg;
  return Math.max(0, Math.min(1, 1 - (t - 1500) / 9000));
}

/* ── grading: correctness, confidence and speed all move the interval ── */
function applyResult(item, type, correct, ms, confidence){
  const id = item.id, r = rec(id), t = TYPES[type] || {skill:"recognition", level:1};
  const sk = r.skills[t.skill];
  const conf = confidence || "none";

  r.reps++; r.last = Date.now();
  r.rtAvg = r.rtN ? (r.rtAvg*r.rtN + ms) / (r.rtN+1) : ms;
  r.rtN++;
  sk.n++; sk.rt = sk.rt ? (sk.rt*0.7 + ms*0.3) : ms;
  if (conf !== "none") r.conf[conf] = (r.conf[conf]||0) + 1;

  /* how much a pass is worth: slow or guessed counts for less */
  let credit = 0;
  if (correct){
    credit = 1;
    if (conf === "guess") credit = 0.35;
    else if (conf === "unsure") credit = 0.7;
    if (ms > 10000) credit *= 0.6;
    else if (ms > 5000) credit *= 0.8;
    credit *= (0.75 + 0.05 * t.level);       /* harder formats are worth more */
    credit = Math.min(1, credit);
    sk.ok++; sk.m = Math.min(1, sk.m + (1 - sk.m) * (0.28 + 0.06*credit));
    r.run++;
    if (r.passed.indexOf(type) < 0) r.passed.push(type);
  } else {
    sk.m = Math.max(0, sk.m * 0.45);
    r.run = 0; r.lapses++;
    if (r.failed.indexOf(type) < 0) r.failed.push(type);
    noteMistake(item, type);
  }

  /* SM-2 flavoured interval, tempered by confidence */
  if (correct){
    const q = conf === "guess" ? 3 : conf === "unsure" ? 4 : (ms < 2000 ? 5 : 4);
    r.ease = Math.max(1.3, r.ease + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
    r.ivl = r.ivl === 0 ? (conf === "guess" ? 0.25 : 1)
          : r.ivl === 1 ? (conf === "guess" ? 1 : 3)
          : Math.round(r.ivl * r.ease * (conf === "guess" ? 0.5 : 1) * 10) / 10;
  } else {
    r.ease = Math.max(1.3, r.ease - 0.22);
    r.ivl = 0.02;                               /* about half an hour */
  }
  r.due = Date.now() + r.ivl * DAY;

  /* ladder: climbs on a clean pass, drops on a miss */
  if (correct && conf !== "guess" && ms < 8000) r.level = Math.min(10, r.level + (t.level >= r.level ? 1 : 0));
  else if (!correct) r.level = Math.max(1, r.level - 1);

  /* concept-level bookkeeping */
  const c = cRec(item.concept);
  if (correct){ c.passes++; c.run++; }
  else { c.fails++; c.run = 0; c.lastFail = Date.now(); }

  /* XP rewards the hard things, not the clicks */
  if (correct){
    let xp = 2 + t.level * 2;
    if (conf === "knew" && ms < 2000) xp += 4;
    if (r.run >= 3) xp += 3;
    if (status(id) === "fading" || status(id) === "weak") xp += 5;
    S.xp += xp;
  }
  bumpStreak(); logDay(correct); save();
  return {credit:credit, band:band(ms)};
}

function noteMistake(item, type){
  const key = item.concept + "|" + item.id;
  let m = S.mistakes.find(x => x.key === key);
  if (!m){ m = {key:key, item:item.id, concept:item.concept, n:0, first:Date.now()}; S.mistakes.push(m); }
  m.n++; m.last = Date.now(); m.type = type;
  if (S.mistakes.length > 200) S.mistakes = S.mistakes.sort((a,b)=>b.last-a.last).slice(0,200);
}
function bumpStreak(){
  const t = new Date().toISOString().slice(0,10);
  if (S.streakDay === t) return;
  const y = new Date(Date.now()-DAY).toISOString().slice(0,10);
  S.streak = (S.streakDay === y) ? S.streak+1 : 1;
  S.streakDay = t;
}
function logDay(correct){
  const t = new Date().toISOString().slice(0,10);
  let d = S.log.find(x => x.d === t);
  if (!d){ d = {d:t, n:0, ok:0}; S.log.push(d); if (S.log.length > 120) S.log.shift(); }
  d.n++; if (correct) d.ok++;
}

/* ── what to study: the daily plan ───────────────────────────────────── */
function dueItems(){
  const now = Date.now();
  return COURSE.all.filter(function(it){
    const r = S.rev[it.id];
    return r && r.reps > 0 && r.due <= now;
  });
}
function unseen(){ return COURSE.all.filter(it => !S.rev[it.id] || S.rev[it.id].reps === 0); }
function seen(){ return COURSE.all.filter(it => S.rev[it.id] && S.rev[it.id].reps > 0); }

/* the weakest meaningful skill for an item — what to ask next */
function typesForSkill(it, skill){
  /* an exercise only counts towards a skill if that is the skill it credits —
     otherwise an item can sit forever on a skill nothing ever raises */
  return availableTypes(it, skill).filter(t => TYPES[t] && TYPES[t].skill === skill);
}
function nextSkillFor(it){
  const r = rec(it.id);
  const order = ["recognition","recall","context","listening","production"];
  const can = {}; order.forEach(s => can[s] = typesForSkill(it, s).length > 0);
  for (const s of order){
    const prior = order.slice(0, order.indexOf(s)).filter(p => can[p]);
    const ready = prior.every(p => r.skills[p].m >= 0.45);
    if (ready && can[s] && r.skills[s].m < 0.8) return s;
  }
  const open = order.filter(s => can[s] && r.skills[s].m < 0.95);
  if (open.length) return open.sort((a,b)=>r.skills[a].m - r.skills[b].m)[0];
  const any = order.filter(s => can[s]);
  return any.length ? any[0] : "recognition";
}
/* which exercises this item can actually support, for a given skill */
function availableTypes(it, skill){
  const r = rec(it.id), out = [];
  const lvl = r.level;
  const has = t => TYPES[t].level <= lvl + 1;
  if (it.kind === "pair")     return (it.pair.merged || !TTS.ready) ? ["pair_eye"] : (skill==="listening"?["pair_ear"]:["pair_eye"]);
  if (it.kind === "judge")    return ["judge"];
  if (it.kind === "contrast") return TTS.ready && skill === "listening" ? ["contrast_mc"] : ["contrast_mc"];
  if (it.kind === "concept")  return ["judge_concept"];
  if (it.kind === "dialogue") return ["dialogue_gap"];
  const sent = it.ex && it.ex.vi;
  if (skill === "recognition"){ out.push("mc_vi_en"); if (has("two_choice")) out.push("two_choice");
    if (has("odd") && classOf(it)) out.push("odd"); }
  if (skill === "recall"){ out.push("mc_en_vi"); if (it.north && has("south_form")) out.push("south_form"); }
  if (skill === "listening" && TTS.ready){ out.push("listen_word");
    if (sent && has("listen_sent")) out.push("listen_sent");
    if (syllables(it.vi).length === 1 && has("tone_id")) out.push("tone_id");
    if (sent && has("listen_type")) out.push("listen_type"); }
  if (skill === "context" && sent){
    if (spanOf(it)) out.push("gap");
    if (spanOf(it) && has("place")) out.push("place");
    const n = toks(it.ex.vi).length;
    if (has("build") && n >= 4 && n <= 9) out.push("build");
  }
  if (skill === "production"){
    if (sent && has("translate_h")) out.push("translate_h");
    out.push(lvl >= 7 ? "translate" : "translate_h");
    if (sent && has("error_fix")) out.push("error_fix");
    if (sent && has("free") && lvl >= 8) out.push("free");
  }
  return out.filter(t => TYPES[t]);
}
function classOf(it){
  for (const k in COURSE.classes) if (COURSE.classes[k].indexOf(it.vi) > -1) return k;
  return null;
}

/* Today's plan: due, weak, cumulative, recent, new — mixed on purpose */
function buildPlan(){
  const now = Date.now();
  const target = Math.max(8, Math.round(S.dailyMinutes * 1.6));
  const due = dueItems().sort((a,b)=> S.rev[a.id].due - S.rev[b.id].due);
  const weak = seen().filter(it => ["weak","fading"].indexOf(status(it.id)) > -1 && due.indexOf(it) < 0)
                     .sort((a,b)=> overall(a.id) - overall(b.id));
  const older = seen().filter(it => due.indexOf(it) < 0 && weak.indexOf(it) < 0)
                      .sort((a,b)=> (S.rev[a.id].last||0) - (S.rev[b.id].last||0));
  const fresh = unseen().sort(function(a,b){
    const ua = COURSE.units.findIndex(u=>u.id===a.unit), ub = COURSE.units.findIndex(u=>u.id===b.unit);
    if (ua !== ub) return ua - ub;
    return conceptReady(b.concept) - conceptReady(a.concept);
  });

  const quota = [["due",0.40,due], ["weak",0.25,weak], ["older",0.15,older], ["new",0.20,fresh]];
  const plan = [];
  quota.forEach(function(q){
    const n = Math.round(target * q[1]);
    for (let i=0; i<n && i<q[2].length; i++) plan.push({it:q[2][i], why:q[0]});
  });
  /* fill any shortfall from whatever is left */
  const pools = [due, weak, older, fresh];
  let p = 0;
  while (plan.length < target && p < 40){
    const pool = pools[p % 4];
    const cand = pool.find(x => !plan.some(y => y.it.id === x.id));
    if (cand) plan.push({it:cand, why:"fill"});
    p++;
  }
  /* a concept that keeps failing jumps the queue as a micro-lesson */
  const broken = brokenConcepts();
  if (broken.length){
    const c = broken[0];
    plan.unshift({it:{id:"cpt:"+c.id, kind:"micro", vi:c.title, en:c.rule, concept:c.id, ref:c},
                  why:"micro"});
  }
  /* interleave so two cards on the same concept are never adjacent */
  const out = [];
  const byC = {};
  plan.forEach(function(x){ (byC[x.it.concept] = byC[x.it.concept]||[]).push(x); });
  const keys = Object.keys(byC);
  let added = true;
  while (added){
    added = false;
    keys.forEach(function(k){ if (byC[k].length){ out.push(byC[k].shift()); added = true; } });
  }
  if (plan[0] && plan[0].why === "micro"){
    const i = out.findIndex(x => x.why === "micro");
    if (i > 0){ const m = out.splice(i,1)[0]; out.unshift(m); }
  }
  return out.slice(0, target);
}
function conceptReady(cid){
  const c = COURSE.conceptById[cid];
  if (!c || !c.requires || !c.requires.length) return 1;
  const met = c.requires.filter(function(r){
    const items = COURSE.itemsByConcept[r] || [];
    if (!items.length) return true;
    const avg = items.reduce((s,x)=>s+overall(x.id),0)/items.length;
    return avg >= 0.4;
  }).length;
  return met / c.requires.length;
}
function brokenConcepts(){
  return CONCEPTS.filter(function(c){
    const r = S.concept[c.id];
    if (!r) return false;
    const recent = Date.now() - (r.lastFail||0) < 7*DAY;
    const untaught = Date.now() - (r.lastTaught||0) > 2*DAY;
    return r.fails >= 3 && r.run < 2 && recent && untaught;
  }).sort(function(a,b){ return S.concept[b.id].fails - S.concept[a.id].fails; });
}

/* ── weakness analysis — by category, not by raw error count ─────────── */
function weaknesses(){
  const out = [];
  /* 1 · concepts that keep breaking */
  CONCEPTS.forEach(function(c){
    const r = S.concept[c.id];
    if (!r || r.fails < 2) return;
    const rate = r.fails / Math.max(1, r.fails + r.passes);
    if (rate < 0.3) return;
    out.push({kind:"concept", id:c.id, title:c.title,
      detail: r.fails + " misses across " + (r.fails+r.passes) + " tries",
      severity: rate * Math.min(3, r.fails) , concept:c.id,
      line:"You are not failing separate questions here — this is one structure."});
  });
  /* 2 · slow retrieval: known but not reachable */
  seen().forEach(function(it){
    const r = S.rev[it.id];
    if (!r || r.rtN < 3) return;
    if (overall(it.id) < 0.5) return;
    if (r.rtAvg < 5000) return;
    out.push({kind:"slow", id:it.id, title:it.vi,
      detail:"average " + (r.rtAvg/1000).toFixed(1) + " sec",
      severity: 0.6 + r.rtAvg/20000, concept:it.concept,
      line:"You know this. You cannot get to it quickly."});
  });
  /* 3 · production gap: recognised often, never produced */
  seen().forEach(function(it){
    const r = S.rev[it.id];
    if (!r) return;
    if (r.skills.recognition.m >= 0.7 && r.skills.production.n === 0 && r.skills.recognition.n >= 4){
      out.push({kind:"gap", id:it.id, title:it.vi,
        detail:"recognised " + r.skills.recognition.n + " times, produced 0",
        severity:0.9, concept:it.concept,
        line:"Recognition mastered, production unproven."});
    }
  });
  /* 4 · repeated confusions */
  COURSE.all.filter(x => x.kind === "pair" || x.kind === "contrast").forEach(function(it){
    const r = S.rev[it.id];
    if (!r || r.lapses < 2) return;
    out.push({kind:"confusion", id:it.id, title:it.vi, detail:r.lapses + " mistakes",
      severity: 0.7 + r.lapses*0.15, concept:it.concept,
      line:"These two keep swapping places in your head."});
  });
  /* 5 · southern pronunciation */
  const southItems = COURSE.all.filter(x => x.south);
  const southSeen = southItems.filter(x => S.rev[x.id] && S.rev[x.id].reps);
  if (southSeen.length >= 3){
    const avg = southSeen.reduce((s,x)=>s+overall(x.id),0)/southSeen.length;
    if (avg < 0.55) out.push({kind:"south", id:"south", title:"Southern realization",
      detail:Math.round(avg*100) + "% across " + southSeen.length + " items",
      severity:1.1, concept:"c.south.finals",
      line:"The written form and the southern sound are not lining up yet."});
  }
  /* 6 · a whole skill lagging */
  const prof = profile();
  SKILLS.forEach(function(sk){
    if (prof[sk.id] === null) return;
    if (prof[sk.id] < 0.4 && prof.recognition > prof[sk.id] + 0.25){
      out.push({kind:"skill", id:sk.id, title:sk.label + " overall",
        detail:Math.round(prof[sk.id]*100) + "% against " + Math.round(prof.recognition*100) + "% recognition",
        severity:1.3, concept:null,
        line:"You are reading far better than you are " + sk.label.toLowerCase() + "."});
    }
  });
  return out.sort((a,b)=>b.severity-a.severity);
}

/* skill profile, 0..1 per skill, plus fluency */
function profile(){
  const p = {};
  SKILLS.forEach(function(sk){
    const xs = seen().filter(it => rec(it.id).skills[sk.id].n > 0);
    p[sk.id] = xs.length ? xs.reduce((s,it)=>s+rec(it.id).skills[sk.id].m,0)/xs.length : null;
    p[sk.id+"N"] = xs.length;
  });
  const fl = seen().map(it => fluencyOf(it.id)).filter(x => x !== null);
  p.fluency = fl.length ? fl.reduce((a,b)=>a+b,0)/fl.length : null;
  const kn = seen();
  p.knowledge = kn.length ? kn.reduce((s,it)=>s+overall(it.id),0)/kn.length : null;
  p.south = (function(){
    const xs = COURSE.all.filter(x => x.south && S.rev[x.id] && S.rev[x.id].reps);
    return xs.length ? xs.reduce((s,x)=>s+overall(x.id),0)/xs.length : null;
  })();
  return p;
}
/* course map: demonstrated performance per unit */
function unitProgress(uid){
  const items = COURSE.all.filter(x => x.unit === uid);
  if (!items.length) return {pct:0, n:0, seen:0};
  const sn = items.filter(x => S.rev[x.id] && S.rev[x.id].reps);
  const pct = items.reduce((s,x)=>s+overall(x.id),0)/items.length;
  return {pct:pct, n:items.length, seen:sn.length};
}

/* ── tutor lines, generated from the data ────────────────────────────── */
function tutorLines(){
  const out = [], p = profile();
  const slow = seen().filter(it => { const r=S.rev[it.id]; return r.rtN>=3 && r.rtAvg>6000 && overall(it.id)>0.55; });
  if (slow.length) out.push("You know " + slow[0].vi + ", but it takes you " +
    (S.rev[slow[0].id].rtAvg/1000).toFixed(1) + " seconds to get to it.");
  const gap = seen().filter(it => rec(it.id).skills.recognition.m>0.7 && rec(it.id).skills.production.n===0);
  if (gap.length >= 3) out.push("Recognition is running ahead of production on " + gap.length +
    " items — " + gap.slice(0,2).map(x=>x.vi).join(" and ") + " among them.");
  const bc = brokenConcepts();
  if (bc.length) out.push("You keep coming apart on " + bc[0].title.toLowerCase() + ". Worth ten minutes on its own.");
  if (p.listening !== null && p.recognition !== null && p.recognition - p.listening > 0.25)
    out.push("Strong on the page, weaker in the ear. Listening is the bottleneck right now.");
  if (p.knowledge !== null && p.fluency !== null && p.knowledge - p.fluency > 0.2)
    out.push("Accuracy " + Math.round(p.knowledge*100) + "%, fluency " + Math.round(p.fluency*100) +
             "% — you are getting there, slowly.");
  const ready = seen().filter(it => rec(it.id).level >= 7);
  if (ready.length >= 5) out.push(ready.length + " items are ready to leave multiple choice behind.");
  if (!out.length && seen().length < 5) out.push("Nothing measured yet. A first session will tell us where you actually are.");
  return out;
}

/* ── weekly diagnostic ───────────────────────────────────────────────── */
function diagnosticDue(){
  if (!S.diag.length) return seen().length >= 20;
  return Date.now() - S.diag[S.diag.length-1].at > 7*DAY;
}
function buildDiagnostic(){
  const pool = seen();
  const pickN = (arr,n) => shuffle(arr.slice()).slice(0,n);
  const plan = [];
  const bySkill = {};
  SKILLS.forEach(sk => bySkill[sk.id] = pool.filter(it => typesForSkill(it, sk.id).length));
  plan.push(...pickN(bySkill.recognition||[], 3).map(it => ({it:it, force:"mc_vi_en"})));
  plan.push(...pickN(bySkill.recall||[], 3).map(it => ({it:it, force:"mc_en_vi"})));
  plan.push(...pickN(bySkill.context||[], 3).map(it => ({it:it, force:null, skill:"context"})));
  if (TTS.ready) plan.push(...pickN(bySkill.listening||[], 2).map(it => ({it:it, force:null, skill:"listening"})));
  plan.push(...pickN(bySkill.production||[], 2).map(it => ({it:it, force:null, skill:"production"})));
  const south = pool.filter(x => x.south);
  plan.push(...pickN(south, 2).map(it => ({it:it, force:null})));
  return shuffle(plan.filter(x => x.it));
}
function closeDiagnostic(results){
  const p = profile();
  const w = weaknesses();
  const entry = {
    at: Date.now(), n: results.length,
    correct: results.filter(r=>r.ok).length,
    profile: {recognition:p.recognition, recall:p.recall, production:p.production,
              listening:p.listening, context:p.context, fluency:p.fluency,
              knowledge:p.knowledge, south:p.south},
    strong: seen().filter(it => overall(it.id) > 0.8).slice(0,5).map(x=>x.vi),
    needs:  w.filter(x => x.kind === "concept").slice(0,3).map(x=>x.title),
    forgot: seen().filter(it => status(it.id) === "fading").slice(0,5).map(x=>x.vi),
    slow:   w.filter(x => x.kind === "slow").slice(0,3).map(x=>x.title + " (" + x.detail + ")"),
    next:   w.slice(0,3).map(x=>x.title)
  };
  S.diag.push(entry); save();
  return entry;
}

/* ═══════════════════════════════════════════════════════════════════════
   UI · helpers, speech, the session runner and the exercise renderers
   ═══════════════════════════════════════════════════════════════════════ */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.random()*a.length|0]; }
function bare(s){
  return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d")
    .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function toks(s){ return String(s||"").trim().split(/\s+/).filter(Boolean); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
function sim(a,b){ const A=bare(a),B=bare(b); return 1 - lev(A,B)/Math.max(A.length,B.length,1); }
function spanOf(it){
  if (!it.ex || !it.ex.vi) return null;
  const list = toks(it.ex.vi), len = toks(it.vi).length, p = bare(it.vi);
  for (let i=0;i+len<=list.length;i++) if (bare(list.slice(i,i+len).join(" ")) === p) return {at:i,len:len};
  return null;
}
const TONE_SETS = {huyen:"àằầèềìòồờùừỳ", sac:"áắấéếíóốớúứý", hoi:"ảẳẩẻểỉỏổởủửỷ",
                   nga:"ãẵẫẽễĩõỗỡũữỹ", nang:"ạặậẹệịọộợụựỵ"};
const TONE_PATH = {ngang:"M2,8 L26,8", huyen:"M2,4 L26,13", sac:"M2,13 L26,3",
                   hoi:"M2,4 C9,15 18,15 26,6", nga:"M2,4 C9,15 18,15 26,6", nang:"M2,5 L17,13"};
const TONE_DOT  = {nga:[26,1], nang:[22,14]};
const TONE_NAME = {ngang:"ngang", huyen:"huyền", sac:"sắc", hoi:"hỏi", nga:"ngã", nang:"nặng"};
function toneOf(sy){
  const s = String(sy).normalize("NFC").toLowerCase();
  for (const k in TONE_SETS) for (const ch of s) if (TONE_SETS[k].indexOf(ch) > -1) return k;
  return "ngang";
}
function syllables(w){ return String(w).normalize("NFC").replace(/[?!.,…—/]/g," ").trim().split(/\s+/).filter(Boolean); }
function toneSvg(k, stroke){
  const c = stroke || "var(--gold)";
  return '<svg width="28" height="16" viewBox="0 0 28 16" aria-hidden="true">'
    + '<path d="'+TONE_PATH[k]+'" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>'
    + (TONE_DOT[k] ? '<circle cx="'+TONE_DOT[k][0]+'" cy="'+TONE_DOT[k][1]+'" r="1.5" fill="'+c+'" opacity=".85"/>' : '')
    + '</svg>';
}
function toneRail(word, names){
  const sy = syllables(word);
  if (!sy.length) return "";
  return '<div class="tones">' + sy.map(function(s){
    const k = toneOf(s);
    return '<div class="tone-syl">'+toneSvg(k)+(names?'<em>'+TONE_NAME[k]+'</em>':'')+'</div>';
  }).join("") + '</div>';
}

/* ── speech ───────────────────────────────────────────────────────────── */
const TTS = {
  voices:[], ready:false, current:null, plays:0,
  refresh(){
    if (!("speechSynthesis" in window)) return;
    const all = speechSynthesis.getVoices() || [];
    this.voices = all.filter(v => /^vi/i.test(v.lang) || /vi[\s_-]?vu|rhvoice/i.test(v.name));
    if (S.voice) this.current = this.voices.find(v => v.name === S.voice) || null;
    if (!this.current) this.current =
      this.voices.find(v => /vi[\s_-]?vu/i.test(v.name)) ||
      this.voices.find(v => /rhvoice/i.test(v.name)) ||
      this.voices.find(v => /^vi/i.test(v.lang)) || null;
    this.ready = !!this.current;
  },
  utter(text, rate){
    const u = new SpeechSynthesisUtterance(String(text).replace(/[—•·]/g," "));
    if (this.current) u.voice = this.current;
    u.lang = (this.current && this.current.lang) || "vi-VN";
    u.rate = rate || S.rate;
    return u;
  },
  say(text, rate, btn){
    if (!("speechSynthesis" in window) || !text) return;
    this.plays++;
    try{
      speechSynthesis.cancel();
      const u = this.utter(text, rate);
      if (btn){ btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }
      speechSynthesis.speak(u);
    }catch(e){}
  },
  seq(list, rate){
    if (!("speechSynthesis" in window)) return;
    const xs = (list||[]).filter(Boolean);
    if (!xs.length) return;
    this.plays++;
    try{ speechSynthesis.cancel(); xs.forEach(t => speechSynthesis.speak(this.utter(t, rate))); }catch(e){}
  }
};
if ("speechSynthesis" in window){
  TTS.refresh();
  speechSynthesis.onvoiceschanged = function(){ TTS.refresh(); if ($("#stats")) paintStats(); };
}
/* whenever a card carries a sentence, the sentence is what gets read */
function fullAudio(it){
  if (!it) return [];
  const sent = it.ex && it.ex.vi;
  if (S.readSentence && sent && bare(sent) !== bare(it.vi)) return [it.vi, sent];
  return [sent || it.vi];
}
function autoSay(list){ if (S.autoplay) TTS.seq(list); }
function wireSpeak(){
  $$("[data-say]").forEach(function(b){
    b.onclick = function(){ TTS.say(b.dataset.say, b.dataset.slow ? Number(b.dataset.slow) : S.rate, b); };
  });
}
function speakRow(word, sentence){
  let h = '<div class="audio"><button class="speak" data-say="'+esc(word)+'">▶ Từ</button>';
  if (sentence && bare(sentence) !== bare(word)) h += '<button class="speak" data-say="'+esc(sentence)+'">▶ Câu</button>';
  h += '<button class="speak" data-say="'+esc(sentence||word)+'" data-slow="0.6">▶ Chậm</button></div>';
  return h;
}

/* ── the session runner ───────────────────────────────────────────────── */
let SESS = null;
function startSession(plan, opts){
  SESS = Object.assign({queue:plan.slice(), i:0, results:[], started:Date.now(),
                        right:0, wrong:0, run:0, best:0, xp0:S.xp, mode:"today"}, opts||{});
  nextCard();
}
function nextCard(){
  if (!SESS) return;
  if (SESS.i >= SESS.queue.length) return endSession();
  const entry = SESS.queue[SESS.i];
  const it = entry.it;
  if (entry.why === "micro" || it.kind === "micro") return renderMicro(it, entry);
  const skill = entry.skill || nextSkillFor(it);
  const types = entry.force ? [entry.force]
             : (typesForSkill(it, skill).length ? typesForSkill(it, skill) : availableTypes(it, skill));
  const type = types.length ? pick(types) : "mc_vi_en";
  renderExercise(it, type, skill);
}
function finishCard(item, type, ok, conf){
  const ms = Date.now() - askTimer;
  const res = applyResult(item, type, ok, ms, conf);
  SESS.results.push({id:item.id, type:type, ok:ok, ms:ms, conf:conf});
  if (ok){ SESS.right++; SESS.run++; SESS.best = Math.max(SESS.best, SESS.run); }
  else {
    SESS.wrong++; SESS.run = 0;
    /* delayed re-testing: same session, a few cards later */
    const at = Math.min(SESS.queue.length, SESS.i + 3 + (Math.random()*3|0));
    SESS.queue.splice(at, 0, {it:item, why:"retry", retry:true});
  }
  return res;
}
function advance(){ SESS.i++; paintStats(); nextCard(); }

function progressFoot(){
  const total = SESS ? SESS.queue.length : 0, i = SESS ? SESS.i : 0;
  return '<div class="foot"><div class="bar"><i style="width:'+(total? i/total*100 : 0)+'%"></i></div>'
    + '<span class="count">'+i+' / '+total+'</span>'
    + (SESS && SESS.run >= 3 ? '<span class="combo">'+SESS.run+' in a row</span>' : '')
    + '</div>';
}
function stage(html){ $("#stage").innerHTML = html + progressFoot(); askTimer = Date.now(); askAnswered = false; }

/* ── confidence + verdict ─────────────────────────────────────────────── */
function needsConfidence(type){
  const t = TYPES[type];
  return !!t && (t.level >= 3 || t.skill === "production");
}
function askConfidence(cb){
  const el = document.createElement("div");
  el.className = "verdict";
  el.innerHTML = '<div class="eyebrow">How did that feel?</div>'
    + '<div class="conf-row">'
    + '<button class="conf" data-c="knew">Knew it</button>'
    + '<button class="conf" data-c="unsure">Unsure</button>'
    + '<button class="conf" data-c="guess">Guessed</button></div>'
    + '<div class="hint" style="margin-top:9px">A guess that happened to be right comes back sooner.</div>';
  $("#card").appendChild(el);
  $("#card").scrollIntoView({behavior:"smooth", block:"nearest"});
  $$(".conf").forEach(function(b){ b.onclick = function(){ cb(b.dataset.c); }; });
  keyHandler = function(e){
    if (e.key === "1") cb("knew");
    if (e.key === "2") cb("unsure");
    if (e.key === "3") cb("guess");
  };
}
/* answer → optional confidence → verdict */
function settle(item, type, ok, extra){
  if (askAnswered) return;
  askAnswered = true;
  const ms = Date.now() - askTimer;
  if (needsConfidence(type) && ok){
    askConfidence(function(c){ const r = finishCard(item, type, ok, c); verdict(item, type, ok, extra, ms, r); });
  } else {
    const r = finishCard(item, type, ok, ok && ms < 2000 ? "knew" : "none");
    verdict(item, type, ok, extra, ms, r);
  }
}
function verdict(item, type, ok, extra, ms, res){
  const c = $("#card");
  if (c) c.classList.add(ok ? "sweep" : "shake");
  const concept = COURSE.conceptById[item.concept];
  const e = extra || {};
  let body = '';

  if (!ok){
    /* why did I get this wrong */
    body += '<div class="vtag no">Chưa đúng</div>';
    if (e.yours) body += '<div class="wrongline"><b>You said</b> '+esc(e.yours)+
                         (e.yoursWhy ? ' — '+esc(e.yoursWhy) : '')+'</div>';
    body += '<div class="rightline"><b>Correct</b> '+esc(e.answer || item.vi)+
            (e.answerWhy ? ' — '+esc(e.answerWhy) : '')+'</div>';
    if (concept) body += '<div class="note"><b>Pattern.</b> '+esc(concept.rule)+'</div>';
    if (concept && concept.micro && concept.micro.contrast)
      body += '<div class="note"><b>Contrast.</b> '+esc(concept.micro.contrast)+'</div>';
    const fresh = concept && (COURSE.sentencesByConcept[concept.id]||[])
      .filter(s => bare(s.vi) !== bare(item.ex && item.ex.vi));
    if (fresh && fresh.length){
      const s = pick(fresh);
      body += '<div class="note"><b>One more.</b> '+esc(s.vi)+' <span style="opacity:.7">— '+esc(s.en)+'</span></div>';
    }
  } else {
    body += '<div class="vtag ok">Đúng rồi</div>';
    if (e.answer) body += '<div class="rightline">'+esc(e.answer)+'</div>';
  }

  /* speed feedback — the thing worth measuring */
  const b = band(ms);
  body += '<div class="speedline"><span class="'+(b==="automatic"?"fast":b==="normal"?"":"slow")+'">'
        + (ms/1000).toFixed(1)+' s · '+b+'</span>'
        + (res && res.credit !== undefined && ok && res.credit < 0.7
            ? ' <span class="dim">— counted as a partial pass</span>' : '') + '</div>';

  if (item.kind === "word" || item.kind === "phrase"){
    body += toneRail(item.vi, true)
      + '<div class="vrow"><span class="w">'+esc(item.vi)+'</span><span class="g">'+esc(item.en)+'</span></div>'
      + (item.north ? '<div class="note south-note">Northern form: <b>'+esc(item.north)+'</b></div>' : '')
      + (item.note ? '<div class="note">'+esc(item.note)+'</div>' : '')
      + (item.ex ? '<div class="note">'+esc(item.ex.vi)+'<br><span style="opacity:.7">'+esc(item.ex.en)+'</span></div>' : '')
      + speakRow(item.vi, item.ex && item.ex.vi);
    autoSay(fullAudio(item));
  } else if (e.say){ autoSay([e.say]); }

  body += '<div class="next-row">'+whyBtn(item.concept)
        + '<button class="btn" id="next">Tiếp</button><span class="hint">Enter</span></div>'
        + noteBar(item.id);

  const holder = document.createElement("div");
  holder.innerHTML = '<div class="verdict">'+body+'</div>';
  c.appendChild(holder.firstChild);
  wireSpeak(); wireWhy(); wireNotes();
  c.scrollIntoView({behavior:"smooth", block:"nearest"});
  $("#next").onclick = advance;
  keyHandler = function(ev){ if (ev.key === "Enter"){ ev.preventDefault(); advance(); } };
}

/* ── generic choice rendering ────────────────────────────────────────── */
function choicesHTML(list, two, tall){
  return '<div class="opts'+(two?" two":"")+'">' + list.map(function(o,i){
    return '<button class="opt'+(tall?" tall":"")+'" data-i="'+i+'">'
      + '<span class="k">'+(i+1)+'</span><span>'+o+'</span></button>';
  }).join("") + '</div>';
}
function wireChoices(correctIdx, after, sayOnPick){
  const btns = $$(".opt");
  function choose(i){
    if (!btns.length || btns[0].disabled) return;
    btns.forEach(function(b,j){
      b.disabled = true;
      if (j === correctIdx) b.classList.add("right");
      else if (j === i) b.classList.add("wrong");
      else b.classList.add("fade");
    });
    if (sayOnPick) autoSay(sayOnPick);
    setTimeout(function(){ after(i === correctIdx, i); }, i === correctIdx ? 420 : 780);
  }
  btns.forEach(function(b,i){ b.onclick = function(){ choose(i); }; });
  keyHandler = function(e){
    const n = parseInt(e.key,10);
    if (n >= 1 && n <= btns.length) choose(n-1);
    if (e.key === " " && sayOnPick){ e.preventDefault(); TTS.seq(sayOnPick); }
  };
}
/* distractors that tighten as the item climbs the ladder */
function distractors(item, key, n, hard){
  const pool = COURSE.words.filter(x => x.id !== item.id && x[key] && !(item.syn && x.syn === item.syn));
  const seenV = {}; seenV[item[key]] = 1;
  let ranked;
  if (hard && key === "vi"){
    ranked = pool.map(x => ({x:x, s: sim(item.vi,x.vi) + (x.concept===item.concept?.15:0) + Math.random()*.08}))
                 .sort((a,b)=>b.s-a.s).map(o=>o.x);
  } else if (hard){
    ranked = pool.filter(x => x.concept === item.concept).concat(shuffle(pool));
  } else {
    ranked = shuffle(pool.filter(x => x.unit === item.unit)).concat(shuffle(pool));
  }
  const out = [];
  ranked.forEach(function(x){ if (out.length < n && !seenV[x[key]]){ seenV[x[key]] = 1; out.push(x); } });
  return out;
}

/* ═══ the exercises ═══════════════════════════════════════════════════ */
function renderExercise(it, type, skill){
  const r = rec(it.id), hard = r.level >= 3;
  const T = TYPES[type] || TYPES.mc_vi_en;
  const head = function(txt, why){ return label(txt, why || T.label, whyBtn(it.concept)); };

  /* first sight */
  if (!r.reps && it.kind === "word"){
    stage(card(head("New · " + unitTitle(it.unit), "meet it")
      + toneRail(it.vi, true)
      + '<h2 class="word'+(it.vi.length>16?" sm":"")+'">'+esc(it.vi)+'</h2>'
      + '<div class="gloss">'+esc(it.en)+'</div>'
      + (it.north ? '<div class="note south-note">Northern: <b>'+esc(it.north)+'</b> · southern: <b>'+esc(it.vi)+'</b></div>' : '')
      + (it.note ? '<div class="note">'+esc(it.note)+'</div>' : '')
      + (it.ex ? '<div class="note">'+esc(it.ex.vi)+'<br><span style="opacity:.7">'+esc(it.ex.en)+'</span></div>' : '')
      + speakRow(it.vi, it.ex && it.ex.vi)
      + '<div class="next-row"><button class="btn" id="go">Got it</button><span class="hint">Enter</span></div>'
      + noteBar(it.id)));
    wireSpeak(); wireWhy(); wireNotes(); autoSay(fullAudio(it));
    $("#go").onclick = function(){ rec(it.id).reps++; rec(it.id).due = Date.now() + 0.02*DAY; save(); advance(); };
    keyHandler = e => { if (e.key === "Enter") { rec(it.id).reps++; save(); advance(); } };
    return;
  }

  /* ── recognition ──────────────────────────────────────────────────── */
  if (type === "mc_vi_en" || type === "listen_word"){
    const listen = type === "listen_word";
    const opts = shuffle(distractors(it,"en",3,hard).concat([it]));
    const idx = opts.indexOf(it);
    stage(card(head(listen ? "Listen — what does it mean?" : "What does it mean?")
      + (listen ? replayBlock(it.vi)
                : toneRail(it.vi,false)+'<h2 class="word'+(it.vi.length>16?" sm":"")+'">'+esc(it.vi)+'</h2>'+speakRow(it.vi, it.ex&&it.ex.vi))
      + choicesHTML(opts.map(o => '<span class="en">'+esc(o.en)+'</span>'))));
    wireSpeak(); wireWhy(); wireReplay(it.vi);
    if (listen) setTimeout(()=>TTS.say(it.vi), 180); else autoSay([it.vi]);
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.vi+" — "+it.en, yours: ok?null:opts[i].en}); }, fullAudio(it));
    return;
  }
  if (type === "two_choice"){
    const other = distractors(it,"en",1,true)[0];
    const opts = shuffle([it, other]); const idx = opts.indexOf(it);
    stage(card(head("Which meaning?", "two-choice discrimination")
      + toneRail(it.vi,false)+'<h2 class="word">'+esc(it.vi)+'</h2>'
      + choicesHTML(opts.map(o => '<span class="en">'+esc(o.en)+'</span>'), true)));
    wireWhy(); autoSay([it.vi]);
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.en, yours: ok?null:opts[i].en}); }, fullAudio(it));
    return;
  }
  if (type === "odd"){
    const cls = classOf(it);
    const fam = shuffle(COURSE.words.filter(x => classOf(x) === cls && x.id !== it.id)).slice(0,2);
    const strangers = COURSE.words.filter(x => classOf(x) && classOf(x) !== cls);
    if (fam.length < 2 || !strangers.length) return renderExercise(it, "mc_vi_en", skill);
    const str = pick(strangers);
    const opts = shuffle([it].concat(fam,[str])); const idx = opts.indexOf(str);
    stage(card(head("Which one does not belong?", "categories")
      + '<div class="prompt-en">Three of these are '+esc(cls)+'. One is not.</div>'
      + choicesHTML(opts.map(o => esc(o.vi)), true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:str.vi+" — "+str.en+", not "+cls,
      yours: ok?null:opts[i].vi, yoursWhy: ok?null:"that one is "+cls}); }, [str.vi]);
    return;
  }

  /* ── recall ───────────────────────────────────────────────────────── */
  if (type === "mc_en_vi"){
    const opts = shuffle(distractors(it,"vi",3,hard).concat([it]));
    const idx = opts.indexOf(it);
    stage(card(head("Say it in Vietnamese")
      + '<div class="prompt-en">'+esc(it.en)+'</div>'
      + choicesHTML(opts.map(o => esc(o.vi)), true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.vi, yours: ok?null:opts[i].vi,
      yoursWhy: ok?null:opts[i].en}); }, fullAudio(it));
    return;
  }
  if (type === "south_form"){
    const opts = shuffle(distractors(it,"vi",3,hard).concat([it]));
    const idx = opts.indexOf(it);
    stage(card(head("Miền Bắc → miền Nam", "dialect")
      + '<div class="prompt-en">A northerner says <b class="vi-inline">'+esc(it.north)+'</b>'
      + ' <span class="dim">— '+esc(it.en)+'</span></div>'
      + '<div class="hint" style="margin-top:8px">What does a southerner say?</div>'
      + choicesHTML(opts.map(o => esc(o.vi)), true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.vi+" (north: "+it.north+")", yours: ok?null:opts[i].vi}); }, fullAudio(it));
    return;
  }

  /* ── listening ────────────────────────────────────────────────────── */
  if (type === "listen_sent"){
    const pool = COURSE.words.filter(x => x.ex && x.ex.en && x.id !== it.id);
    if (pool.length < 3) return renderExercise(it, "listen_word", skill);
    const opts = shuffle(shuffle(pool).slice(0,3).concat([it]));
    const idx = opts.indexOf(it);
    stage(card(head("Listen to the whole sentence", "comprehension")
      + replayBlock(it.ex.vi)
      + choicesHTML(opts.map(o => '<span class="en">'+esc(o.ex.en)+'</span>'), false, true)));
    wireWhy(); wireReplay(it.ex.vi);
    setTimeout(()=>TTS.say(it.ex.vi), 220);
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.ex.vi+" — "+it.ex.en,
      yours: ok?null:opts[i].ex.en}); }, [it.ex.vi]);
    return;
  }
  if (type === "listen_type"){
    stage(card(head("Hear it, then write the key word", "dictation")
      + replayBlock(it.ex.vi)
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="the word you were listening for"><button class="btn" id="tgo">Check</button></div>'
      + '<div class="hint" style="margin-top:9px">Tones count, but a plain spelling earns a partial pass.</div>'));
    wireWhy(); wireReplay(it.ex.vi);
    setTimeout(()=>TTS.say(it.ex.vi), 220);
    typeCheck(it, type);
    return;
  }
  if (type === "tone_id"){
    const real = toneOf(it.vi);
    const keys = ["ngang","huyen","sac","hoi","nang"];
    const answer = real === "nga" ? "hoi" : real;
    const idx = keys.indexOf(answer);
    stage(card(head("Which tone did you hear?", "tones")
      + replayBlock(it.vi)
      + '<div class="tone-opts">'+keys.map(function(k,i){
          return '<button class="opt tone-opt" data-i="'+i+'">'+toneSvg(k)
            +'<span>'+(k==="hoi"?"hỏi / ngã":TONE_NAME[k])+'</span><small>'+(i+1)+'</small></button>';
        }).join("")+'</div>'
      + '<div class="hint" style="margin-top:12px">hỏi and ngã share a button — in the south they are one tone.</div>'));
    wireWhy(); wireReplay(it.vi);
    setTimeout(()=>TTS.say(it.vi), 200);
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.vi+" carries "+TONE_NAME[real],
      yours: ok?null:TONE_NAME[keys[i]]}); }, [it.vi]);
    return;
  }

  /* ── confusable pairs ─────────────────────────────────────────────── */
  if (type === "pair_ear" && it.pair){
    const p = it.pair, first = Math.random() < .5, said = first ? p.a : p.b;
    const opts = [{v:p.a,e:p.aEn},{v:p.b,e:p.bEn}];
    stage(card(head("Which one did you hear?", "ear training")
      + replayBlock(said)
      + choicesHTML(opts.map(o => esc(o.v)+' <span class="en" style="margin-left:8px">'+esc(o.e)+'</span>'), true)));
    wireWhy(); wireReplay(said);
    setTimeout(()=>TTS.say(said), 200);
    wireChoices(first?0:1, function(ok,i){ settle(it, type, ok, {answer:said+" — "+(first?p.aEn:p.bEn),
      yours: ok?null:opts[i].v, yoursWhy: ok?null:opts[i].e, say:said}); }, [said]);
    return;
  }
  if (type === "pair_eye" && it.pair){
    const p = it.pair, first = Math.random() < .5;
    const want = first ? {v:p.a,e:p.aEn} : {v:p.b,e:p.bEn};
    stage(card(head(p.merged ? "Same sound — which spelling?" : "Which word?", "meaning over sound")
      + '<div class="prompt-en">'+esc(want.e)+'</div>'
      + (p.merged ? '<div class="note south-note">'+esc(p.why)+' Your ear cannot decide this one.</div>' : '')
      + choicesHTML([p.a,p.b].map(v => esc(v)+' '+toneSvg(toneOf(v))), true)));
    wireWhy();
    wireChoices(first?0:1, function(ok,i){ settle(it, type, ok, {answer:want.v+" — "+want.e,
      yours: ok?null:[p.a,p.b][i], yoursWhy: ok?null:(i===0?p.aEn:p.bEn), say:want.v}); }, [want.v]);
    return;
  }

  /* ── contrast sets ────────────────────────────────────────────────── */
  if (type === "contrast_mc" && it.contrast){
    const x = it.contrast;
    const sents = x.sentences || [];
    if (sents.length && Math.random() < 0.6){
      const s = pick(sents);
      const blanked = s.vi.replace(new RegExp(x.members[s.a].vi.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"), '<span class="blank"></span>');
      stage(card(head(x.title, "contrast")
        + '<div class="sent">'+blanked+'</div>'
        + '<div class="sent-en">'+esc(s.en)+'</div>'
        + choicesHTML(x.members.map(m => esc(m.vi)+' <span class="en" style="margin-left:6px">'+esc(m.en)+'</span>'), true)));
      wireWhy();
      wireChoices(s.a, function(ok,i){ settle(it, type, ok, {answer:s.vi,
        yours: ok?null:x.members[i].vi, yoursWhy: ok?null:x.members[i].en, say:s.vi}); }, [s.vi]);
      return;
    }
    const target = pick(x.members);
    const idx = x.members.indexOf(target);
    stage(card(head(x.title, "contrast")
      + '<div class="prompt-en">'+esc(target.en)+'</div>'
      + (x.merged ? '<div class="note south-note">'+esc(x.why)+'</div>' : '')
      + choicesHTML(x.members.map(m => esc(m.vi)), true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:target.vi+" — "+target.en,
      yours: ok?null:x.members[i].vi, yoursWhy: ok?null:x.members[i].en, say:target.vi}); }, [target.vi]);
    return;
  }

  /* ── context: gap, placement, reordering ──────────────────────────── */
  if (type === "gap"){
    const sp = spanOf(it);
    if (!sp) return renderExercise(it, "mc_en_vi", skill);
    const list = toks(it.ex.vi);
    const shown = list.slice(0,sp.at).join(" ") + ' <span class="blank"></span> ' + list.slice(sp.at+sp.len).join(" ");
    const opts = shuffle(distractors(it,"vi",3,hard).concat([it]));
    const idx = opts.indexOf(it);
    stage(card(head("Fill the gap")
      + '<div class="sent">'+shown+'</div><div class="sent-en">'+esc(it.ex.en)+'</div>'
      + choicesHTML(opts.map(o => esc(o.vi)), true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:it.ex.vi, yours: ok?null:opts[i].vi,
      yoursWhy: ok?null:opts[i].en, say:it.ex.vi}); }, [it.ex.vi]);
    return;
  }
  if (type === "place"){
    const sp = spanOf(it);
    if (!sp) return renderExercise(it, "gap", skill);
    const list = toks(it.ex.vi);
    const restT = list.slice(0,sp.at).concat(list.slice(sp.at+sp.len));
    let row = '<div class="tokens">';
    for (let i=0;i<=restT.length;i++){
      row += '<button class="slot" data-i="'+i+'">▾</button>';
      if (i < restT.length) row += '<span class="tok">'+esc(restT[i])+'</span>';
    }
    row += '</div>';
    stage(card(head("Where does it go?", "word order")
      + '<h2 class="word sm">'+esc(it.vi)+'</h2><div class="gloss sm">'+esc(it.en)+'</div>'
      + row + '<div class="sent-en" style="margin-top:14px">'+esc(it.ex.en)+'</div>'));
    wireWhy();
    const slots = $$(".slot");
    slots.forEach(function(b,i){
      b.onclick = function(){
        if (b.disabled) return;
        slots.forEach(function(x,j){ x.disabled = true;
          if (j === sp.at) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); });
        if (i === sp.at) slots[i].textContent = it.vi;
        autoSay([it.ex.vi]);
        setTimeout(()=>settle(it, type, i === sp.at, {answer:it.ex.vi, say:it.ex.vi}), i===sp.at?480:840);
      };
    });
    keyHandler = null;
    return;
  }
  if (type === "build"){
    const list = toks(it.ex.vi);
    let bank = shuffle(list.slice());
    if (bank.join(" ") === list.join(" ")) bank = shuffle(bank);
    stage(card(head("Put the sentence back together", "word order")
      + '<div class="prompt-en" style="font-size:19px">'+esc(it.ex.en)+'</div>'
      + '<div class="answer-line" id="ans"></div>'
      + '<div class="bank">'+bank.map((t,i)=>'<button class="tile" data-i="'+i+'">'+esc(t)+'</button>').join("")+'</div>'
      + '<div class="next-row"><button class="btn ghost" id="undo">Undo</button>'
      + '<span class="hint">Tap the words in order</span></div>'));
    wireWhy();
    const chosen = [], ans = $("#ans"), tiles = $$(".tile");
    function paint(){
      ans.innerHTML = chosen.map(c=>'<span class="tok">'+esc(bank[c])+'</span>').join("");
      tiles.forEach((t,i)=>t.classList.toggle("used", chosen.indexOf(i)>-1));
    }
    tiles.forEach(function(t,i){
      t.onclick = function(){
        if (t.disabled || chosen.indexOf(i)>-1) return;
        chosen.push(i); paint();
        if (chosen.length === bank.length){
          const said = chosen.map(c=>bank[c]).join(" ");
          const ok = bare(said) === bare(it.ex.vi);
          tiles.forEach(t2 => t2.disabled = true);
          ans.innerHTML = chosen.map(c=>'<span class="tok" style="border-color:'+(ok?"var(--jade)":"var(--cinnabar)")+'">'+esc(bank[c])+'</span>').join("");
          autoSay([it.ex.vi]);
          setTimeout(()=>settle(it, type, ok, {answer:it.ex.vi, yours: ok?null:said, say:it.ex.vi}), ok?520:900);
        }
      };
    });
    $("#undo").onclick = function(){ chosen.pop(); paint(); };
    keyHandler = null;
    return;
  }

  /* ── grammar judgement ────────────────────────────────────────────── */
  if (type === "judge" && it.judge){
    const j = it.judge;
    const wrongs = shuffle(j.bad.slice()).slice(0, j.bad.length > 1 && Math.random() < .6 ? 2 : 1);
    const opts = shuffle([j.good].concat(wrongs));
    const idx = opts.indexOf(j.good);
    stage(card(head(j.south ? "Which one sounds southern?" : "Which sentence is right?", "grammar")
      + choicesHTML(opts.map(o => '<span class="sentopt">'+esc(o)+'</span>'), false, true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:j.good, answerWhy:j.why,
      yours: ok?null:opts[i], say:j.good}); }, [j.good]);
    return;
  }
  if (type === "judge_concept" && it.ref){
    const c = it.ref, chk = c.micro.check;
    stage(card(head(c.title, "concept check")
      + '<div class="prompt-en">'+esc(chk.q)+'</div>'
      + choicesHTML(chk.options.map(o => esc(o)), true)));
    wireWhy();
    wireChoices(chk.answer, function(ok,i){ settle(it, type, ok, {answer:chk.options[chk.answer],
      answerWhy:c.micro.rule, yours: ok?null:chk.options[i]}); }, null);
    return;
  }

  /* ── production ───────────────────────────────────────────────────── */
  if (type === "translate_h" || type === "translate"){
    const withHint = type === "translate_h";
    const target = it.ex && it.ex.vi && Math.random() < 0.55 ? {vi:it.ex.vi, en:it.ex.en} : {vi:it.vi, en:it.en};
    stage(card(head(withHint ? "Translate — one hint" : "Translate", "production")
      + '<div class="prompt-en">'+esc(target.en)+'</div>'
      + (withHint ? '<div class="hint" style="margin-top:8px">Starts with <b>'+esc(toks(target.vi)[0])+'</b> · '
          + toks(target.vi).length+' words</div>' : '')
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="type in Vietnamese"><button class="btn" id="tgo">Check</button></div>'
      + '<div class="hint" style="margin-top:9px">Plain spelling without tones earns a partial pass.</div>'));
    wireWhy();
    typeCheck(it, type, target.vi);
    return;
  }
  if (type === "error_fix"){
    const broken = breakSentence(it.ex.vi, it);
    if (!broken) return renderExercise(it, "translate_h", skill);
    stage(card(head("Find the mistake", "error correction")
      + '<div class="sent wrong-sent">'+esc(broken.bad)+'</div>'
      + '<div class="sent-en">'+esc(it.ex.en)+'</div>'
      + '<div class="hint" style="margin:12px 0 0">Type the sentence as it should be.</div>'
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="the corrected sentence"><button class="btn" id="tgo">Check</button></div>'));
    wireWhy();
    typeCheck(it, type, it.ex.vi, broken.why);
    return;
  }
  if (type === "free"){
    stage(card(head("Say it yourself", "free production")
      + '<div class="prompt-en">'+esc(freePrompt(it))+'</div>'
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="your own sentence, using '+esc(it.vi)+'"><button class="btn" id="tgo">Check</button></div>'
      + '<div class="hint" style="margin-top:9px">It only has to contain '+esc(it.vi)+' and read as a sentence.</div>'));
    wireWhy();
    const input = $("#tin"); input.focus();
    function go(){
      const v = input.value.trim();
      if (!v) return;
      const used = bare(v).indexOf(bare(it.vi)) > -1;
      const long = toks(v).length >= 3;
      const ok = used && long;
      if (ok) markProduced(it.id, v);
      settle(it, type, ok, {answer: ok ? "“"+v+"” — logged as free production" : "Needs "+it.vi+" inside a sentence of at least three words",
        yours: ok?null:v});
    }
    $("#tgo").onclick = go;
    input.onkeydown = e => { if (e.key === "Enter") go(); };
    keyHandler = null;
    return;
  }

  /* ── dialogue completion ──────────────────────────────────────────── */
  if (type === "dialogue_gap" && it.dialogue){
    const d = it.dialogue;
    const i = 1 + (Math.random() * (d.lines.length-1) | 0);
    const target = d.lines[i];
    const others = shuffle(COURSE.dialogues.flatMap(x=>x.lines).filter(l => l.vi !== target.vi)).slice(0,3);
    const opts = shuffle([target].concat(others));
    const idx = opts.indexOf(target);
    stage(card(head(d.title, "conversation")
      + '<div class="dlg">'+d.lines.slice(0,i).map(l =>
          '<div class="dlg-line"><span class="who">'+esc(l.who)+'</span><span class="vi">'+esc(l.vi)+'</span>'
          +'<span class="en">'+esc(l.en)+'</span></div>').join("")
      + '<div class="dlg-line open"><span class="who">'+esc(target.who)+'</span><span class="vi">…</span></div></div>'
      + '<div class="prompt-en" style="font-size:17px;margin-top:14px">'+esc(target.en)+'</div>'
      + choicesHTML(opts.map(o => '<span class="sentopt">'+esc(o.vi)+'</span>'), false, true)));
    wireWhy();
    wireChoices(idx, function(ok,k){ settle(it, type, ok, {answer:target.vi+" — "+target.en,
      yours: ok?null:opts[k].vi, say:target.vi}); }, [target.vi]);
    return;
  }

  /* fallback */
  return renderExercise(it, "mc_vi_en", "recognition");
}

/* replay controls, and how many replays it took */
function replayBlock(text){
  return '<div class="replay">'
    + '<button class="speak big-play" data-play="'+esc(text)+'" data-rate="1">▶ Nghe</button>'
    + '<div class="replay-row">'
    + '<button class="speak sm" data-play="'+esc(text)+'" data-rate="0.75">0.75×</button>'
    + '<button class="speak sm" data-play="'+esc(text)+'" data-rate="1">1×</button>'
    + '<button class="speak sm" data-play="'+esc(text)+'" data-rate="1.25">1.25×</button>'
    + '<span class="hint" id="replayN"></span></div></div>';
}
let replayCount = 0;
function wireReplay(text){
  replayCount = 0;
  $$("[data-play]").forEach(function(b){
    b.onclick = function(){
      replayCount++;
      TTS.say(b.dataset.play, Number(b.dataset.rate) * S.rate, b);
      const n = $("#replayN");
      if (n) n.textContent = replayCount > 1 ? replayCount + " plays" : "";
    };
  });
}

/* typed answers: exact, tones-missing, or wrong */
function typeCheck(it, type, targetVi, extraWhy){
  const target = targetVi || it.vi;
  const input = $("#tin"); input.focus();
  function go(){
    const v = input.value.trim();
    if (!v) return;
    const exact = v.normalize("NFC").toLowerCase() === target.normalize("NFC").toLowerCase();
    const near  = !exact && bare(v) === bare(target);
    if (exact || near) markProduced(it.id, v);
    if (near){
      /* counted as a pass, but the tones get shown and the credit is cut */
      askAnswered = true;
      const r = finishCard(it, type, true, "unsure");
      verdict(it, type, true, {answer:target+" — you had the word, not the tones", yours:v, say:target},
              Date.now()-askTimer, r);
      return;
    }
    settle(it, type, exact, {answer:target, answerWhy:extraWhy, yours:v, say:target});
  }
  $("#tgo").onclick = go;
  input.onkeydown = e => { if (e.key === "Enter") go(); };
  keyHandler = null;
}
/* conversation memory: what has actually been produced unaided */
function markProduced(id, text){
  const r = rec(id);
  r.produced = r.produced || [];
  if (r.produced.length < 6) r.produced.push({t:text, at:Date.now()});
  r.skills.production.n = Math.max(1, r.skills.production.n);
}

/* deliberately break a sentence, using the error the course warns about */
function breakSentence(vi, it){
  const t = toks(vi);
  const c = it.concept;
  const swapAfter = function(word, why){
    const i = t.findIndex(x => bare(x) === bare(word));
    if (i < 0 || i+1 >= t.length) return null;
    const u = t.slice(); const tmp = u[i]; u[i] = u[i+1]; u[i+1] = tmp;
    return {bad:u.join(" "), why:why};
  };
  if (c === "c.mod.core"){
    for (const m of ["muốn","cần","phải","nên"]){ const r = swapAfter(m, "The modal goes in front of the verb."); if (r) return r; }
  }
  if (c === "c.cmp.more"){ const r = swapAfter("hơn", "hơn follows the adjective."); if (r) return r; }
  if (c === "c.cmp.most"){ const r = swapAfter("nhất", "nhất follows the adjective."); if (r) return r; }
  if (c === "c.freq.adv"){
    for (const f of ["luôn","thường","hay","hiếm","ít"]){ const r = swapAfter(f, "Frequency words stand before the verb."); if (r) return r; }
  }
  if (c === "c.asp.chua" && t[t.length-1] && bare(t[t.length-1]).indexOf("chua") > -1){
    return {bad:"Chưa " + t.slice(0,-1).join(" ") + "?", why:"As a question chưa goes at the very end."};
  }
  /* generic: swap two adjacent words in the middle */
  if (t.length >= 4){
    const i = 1 + (Math.random()*(t.length-2)|0);
    const u = t.slice(); const tmp = u[i]; u[i] = u[i+1]; u[i+1] = tmp;
    if (u.join(" ") !== vi) return {bad:u.join(" "), why:"Two words have swapped places."};
  }
  return null;
}
function freePrompt(it){
  const c = COURSE.conceptById[it.concept];
  const prompts = {
    "c.mod.core":"Someone asks what you want to do tonight. Answer with " + it.vi + ".",
    "c.freq.adv":"Describe your week using " + it.vi + ".",
    "c.asp.chua":"Answer someone who asked whether you have done it, using " + it.vi + ".",
    "c.cmp.more":"Compare two people you know, using " + it.vi + ".",
    "c.south.lexicon":"Say something a southerner would say, using " + it.vi + ".",
    "c.sent.o":"Say where something is, using " + it.vi + "."
  };
  return prompts[it.concept] || ("Write your own sentence using " + it.vi + (c ? " — " + c.title.toLowerCase() : "") + ".");
}

/* ── micro-lesson: rule, examples, contrast, check, produce ──────────── */
function renderMicro(item, entry){
  const c = item.ref || COURSE.conceptById[item.concept];
  if (!c) return advance();
  const m = c.micro;
  const cr = cRec(c.id); cr.taught++; cr.lastTaught = Date.now(); save();
  stage(card(label("Let's fix this", "micro-lesson", whyBtn(c.id))
    + '<h2 class="word sm">'+esc(c.title)+'</h2>'
    + '<div class="note big"><b>Rule.</b> '+esc(m.rule)+'</div>'
    + m.examples.map(e => '<div class="ex-line"><span class="vi">'+esc(e.vi)+'</span>'
        + (e.en?'<span class="en">'+esc(e.en)+'</span>':'')
        + '<button class="mini" data-say="'+esc(e.vi)+'">▶</button></div>').join("")
    + '<div class="note south-note"><b>Contrast.</b> '+esc(m.contrast)+'</div>'
    + '<div class="micro-check"><div class="eyebrow">Quick check</div>'
    + '<div class="prompt-en" style="font-size:18px;margin:8px 0 0">'+esc(m.check.q)+'</div>'
    + choicesHTML(m.check.options.map(o => esc(o)), true) + '</div>'));
  wireSpeak(); wireWhy();
  autoSay([m.examples[0].vi]);
  wireChoices(m.check.answer, function(ok){
    const cr2 = cRec(c.id);
    if (ok) cr2.run++; else cr2.run = 0;
    save();
    microProduce(c, ok);
  }, null);
}
function microProduce(c, checkOk){
  const p = c.micro.produce;
  stage(card(label("Now produce it", "micro-lesson", whyBtn(c.id))
    + '<div class="prompt-en">'+esc(p.en)+'</div>'
    + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
    + 'spellcheck="false" placeholder="type it in Vietnamese"><button class="btn" id="tgo">Check</button></div>'
    + '<div class="next-row"><button class="btn ghost" id="skip">Show me</button></div>'));
  wireWhy();
  const input = $("#tin"); input.focus();
  function done(ok, yours){
    const c2 = cRec(c.id);
    if (ok && checkOk){ c2.passes++; c2.run++; } else { c2.fails = Math.max(0, c2.fails - (ok?1:0)); }
    save();
    const el = document.createElement("div");
    el.className = "verdict";
    el.innerHTML = (ok ? '<div class="vtag ok">Đúng rồi</div>' : '<div class="vtag near">Here it is</div>')
      + '<div class="vrow"><span class="w">'+esc(p.vi)+'</span></div>'
      + (yours && !ok ? '<div class="wrongline"><b>You wrote</b> '+esc(yours)+'</div>' : '')
      + '<div class="note">'+esc(c.rule)+'</div>'
      + '<div class="audio"><button class="speak" data-say="'+esc(p.vi)+'">▶ Nghe</button></div>'
      + '<div class="next-row"><button class="btn" id="next">Back to the session</button></div>';
    $("#card").appendChild(el);
    wireSpeak();
    autoSay([p.vi]);
    $("#next").onclick = advance;
    keyHandler = e => { if (e.key === "Enter") advance(); };
  }
  function go(){
    const v = input.value.trim(); if (!v) return;
    done(bare(v) === bare(p.vi), v);
  }
  $("#tgo").onclick = go;
  $("#skip").onclick = function(){ done(false, null); };
  input.onkeydown = e => { if (e.key === "Enter") go(); };
  keyHandler = null;
}

/* ── end of session ──────────────────────────────────────────────────── */
function endSession(){
  const res = SESS.results;
  const n = res.length, ok = res.filter(r=>r.ok).length;
  const mins = Math.max(1, Math.round((Date.now()-SESS.started)/60000));
  const avg = n ? res.reduce((s,r)=>s+r.ms,0)/n : 0;
  const auto = res.filter(r=>r.ms<2000).length;
  const gained = S.xp - SESS.xp0;
  const missed = res.filter(r=>!r.ok).map(r=>COURSE.byId[r.id]).filter(Boolean);
  const uniqMissed = missed.filter((x,i)=>missed.findIndex(y=>y.id===x.id)===i);

  if (SESS.mode === "diagnostic"){ return renderDiagnosticReport(res); }

  let html = card(label("Xong rồi", "session complete")
    + '<div class="score">'+(n?Math.round(ok/n*100):0)+'<small>% correct</small></div>'
    + '<div class="sum-grid">'
    + '<div><b>'+n+'</b><span>cards</span></div>'
    + '<div><b>'+mins+'</b><span>minutes</span></div>'
    + '<div><b>'+(avg/1000).toFixed(1)+'s</b><span>average</span></div>'
    + '<div><b>'+auto+'</b><span>automatic</span></div>'
    + '<div><b>'+gained+'</b><span>XP</span></div></div>'
    + (uniqMissed.length ? '<div class="group-h" style="margin-top:24px"><span class="eyebrow">Coming back tomorrow</span></div>'
        + uniqMissed.map(x=>'<div class="row"><span class="pill" style="background:var(--cinnabar)"></span>'
          + '<span class="vi">'+esc(x.vi)+'</span><span class="en">'+esc(x.en)+'</span>'
          + '<button class="mini" data-say="'+esc((x.ex&&x.ex.vi)||x.vi)+'">▶</button></div>').join("") : '')
    + tutorBlock()
    + '<div class="next-row" style="margin-top:22px"><button class="btn" id="again">Another set</button>'
    + '<button class="btn ghost" id="done">Done</button></div>');
  $("#stage").innerHTML = html;
  wireSpeak();

  keyHandler = e => { if (e.key === "Enter") go("today"); };
  paintStats(); save();
}

/* pronunciation: consonant + vowel + tone */
function syllableTrainer(){
  let i = 0;
  const sets = shuffle(COURSE.pron.builders.slice());
  function step(){
    if (i >= sets.length) return go("listen");
    const b = sets[i];
    const real = b.forms.filter(f => f[1] !== "—");
    const target = pick(real);
    $("#stage").innerHTML = card(label("Build the syllable", "consonant → vowel → tone")
      + '<div class="build-seq"><span>'+esc(b.onset)+'</span><span class="plus">+</span>'
      + '<span>'+esc(b.rime)+'</span><span class="plus">+</span><span class="dim">?</span></div>'
      + '<div class="prompt-en" style="margin-top:16px">Which one means <b>'+esc(target[1])+'</b>?</div>'
      + choicesHTML(b.forms.filter(f=>f[1]!=="—").map(f => esc(f[0])+' '+toneSvg(toneOf(f[0]))), true)
      + '<div class="hint" style="margin-top:12px">The tone is the last decision, not part of the letter.</div>')
      + '<div class="foot"><div class="bar"><i style="width:'+(i/sets.length*100)+'%"></i></div>'
      + '<span class="count">'+i+' / '+sets.length+'</span></div>';
    const opts = real;
    wireChoices(opts.indexOf(target), function(ok){
      TTS.say(target[0]);
      const el = document.createElement("div");
      el.className = "verdict";
      el.innerHTML = (ok?'<div class="vtag ok">Đúng rồi</div>':'<div class="vtag no">Chưa đúng</div>')
        + '<div class="tonegrid">'+real.map(f =>
            '<div class="tonecell'+(f===target?' hit':'')+'">'+toneSvg(toneOf(f[0]))
            + '<b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span>'
            + '<button class="mini" data-say="'+esc(f[0])+'">▶</button></div>').join("")+'</div>'
        + '<div class="next-row"><button class="btn" id="n">Tiếp</button></div>';
      $("#card").appendChild(el);
      wireSpeak();
      $("#n").onclick = function(){ i++; step(); };
      keyHandler = e => { if (e.key==="Enter"){ i++; step(); } };
    }, [target[0]]);
  }
  step();
}
function tonePairTrainer(){
  let i = 0;
  const rounds = shuffle(COURSE.pron.builders.slice()).slice(0,4);
  function step(){
    if (i >= rounds.length) return go("listen");
    const b = rounds[i];
    const real = b.forms.filter(f=>f[1]!=="—");
    const said = pick(real);
    $("#stage").innerHTML = card(label("Six spellings, one vowel", "tone discrimination")
      + replayBlock(said[0])
      + choicesHTML(real.map(f => esc(f[0])+' '+toneSvg(toneOf(f[0]))+' <span class="en" style="margin-left:6px">'+esc(f[1])+'</span>'), true)
      + (TTS.ready?'':'<div class="warn">No Vietnamese voice — this one needs audio.</div>'))
      + '<div class="foot"><div class="bar"><i style="width:'+(i/rounds.length*100)+'%"></i></div>'
      + '<span class="count">'+i+' / '+rounds.length+'</span></div>';
    wireReplay(said[0]);
    setTimeout(()=>TTS.say(said[0]), 200);
    wireChoices(real.indexOf(said), function(ok){

    }, [said[0]]);

function runScenario(id){
  const sc = COURSE.scenarios.find(x=>x.id===id);
  let i = 0, hits = 0;
  const t0 = Date.now();
  function step(){
    if (i >= sc.steps.length) return finish();
    const st = sc.steps[i];
    $("#stage").innerHTML = card(label(sc.title, "scenario · "+(i+1)+" of "+sc.steps.length, whyBtn(sc.concept))
      + (i===0 ? '<div class="note">'+esc(sc.setting)+'</div>' : '')
      + '<div class="goal">'+esc(st.goal)+'</div>'
      + (st.note ? '<div class="note south-note">'+esc(st.note)+'</div>' : '')
      + '<div class="typebox"><input class="type" id="sin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="say it in Vietnamese"><button class="btn" id="sgo">Check</button></div>'
      + '<div class="next-row"><button class="btn ghost" id="hint">Hint</button>'
      + (SR.ok ? '<button class="btn ghost" id="mic">🎙 Speak</button>' : '')
      + '<button class="btn ghost" id="skip">Show me</button></div>');
    wireWhy();
    const input = $("#sin"); input.focus();
    $("#hint").onclick = function(){ $("#hint").outerHTML = '<span class="hint">'+esc(st.hint||"")+'</span>'; };
    if ($("#mic")) $("#mic").onclick = function(){ SR.listen(function(txt){ input.value = txt; check(); }); };
    $("#skip").onclick = function(){ reveal(false, null); };
    $("#sgo").onclick = check;
    input.onkeydown = e => { if (e.key === "Enter") check(); };
    function check(){
      const v = input.value.trim();
      if (!v) return;
      const b = bare(v);
      const ok = st.expect.some(e => b.indexOf(bare(e)) > -1 || bare(e).indexOf(b) > -1 || sim(v,e) > 0.82);
      reveal(ok, v);
    }
    function reveal(ok, said){
      if (ok) hits++;
      const el = document.createElement("div"); el.className = "verdict";
      el.innerHTML = (ok?'<div class="vtag ok">That works</div>':'<div class="vtag near">One natural way</div>')
        + (said && !ok ? '<div class="wrongline"><b>You said</b> '+esc(said)+'</div>' : '')
        + '<div class="vrow"><span class="w">'+esc(st.expect[0])+'</span></div>'
        + (st.expect.length>1 ? '<div class="hint">also fine: '+st.expect.slice(1).map(esc).join(" · ")+'</div>' : '')
        + '<div class="audio"><button class="speak" data-say="'+esc(st.expect[0])+'">▶ Nghe</button>'
        + '<button class="speak" data-say="'+esc(st.expect[0])+'" data-slow="0.6">▶ Chậm</button></div>'
        + '<div class="next-row"><button class="btn" id="n">Tiếp</button></div>';
      $("#card").appendChild(el);
      wireSpeak(); autoSay([st.expect[0]]);
      $("#n").onclick = function(){ i++; step(); };
      keyHandler = e => { if (e.key==="Enter"){ i++; step(); } };
    }
  }
  function finish(){
    const id2 = "sc:"+sc.id, r = rec(id2);
    r.reps++; r.last = Date.now();
    r.skills.production.n++; r.skills.production.ok += hits;
    r.skills.production.m = Math.min(1, r.skills.production.m + (hits/sc.steps.length) * 0.3);
    S.xp += 10 + hits*6; save();
    $("#stage").innerHTML = card(label("Xong rồi", "scenario complete")
      + '<div class="score">'+hits+'<small> / '+sc.steps.length+' unaided</small></div>'
      + '<div class="hint" style="margin-top:12px">'+Math.round((Date.now()-t0)/1000)+' seconds. Production credit has been logged '
      + 'against the words you used.</div>'
      + '<div class="next-row" style="margin-top:20px"><button class="btn" id="again">Run it again</button>'
      + '<button class="btn ghost" id="back">Back</button></div>');
    $("#again").onclick = function(){ runScenario(id); };
    $("#back").onclick = function(){ go("speak"); };
  }
  step();
}
function runShadow(id){
  const d = COURSE.dialogues.find(x=>x.id===id);
  let i = 0, phase = 0;
  function step(){
    if (i >= d.lines.length) return go("speak");
    const l = d.lines[i];
    const shown = phase >= 1;
    $("#stage").innerHTML = card(label(d.title, "shadowing · line "+(i+1)+" of "+d.lines.length)
      + '<div class="who-big">'+esc(l.who)+'</div>'
      + (shown ? '<div class="sent">'+esc(l.vi)+'</div>'+toneRail(l.vi,false)
               : '<div class="sent hidden-sent">• • • • •</div>')
      + '<div class="sent-en">'+esc(l.en)+'</div>'
      + '<div class="audio"><button class="speak" data-say="'+esc(l.vi)+'">▶ Nghe</button>'
      + '<button class="speak" data-say="'+esc(l.vi)+'" data-slow="0.6">▶ Chậm</button></div>'
      + (phase === 0 ? '<div class="next-row"><button class="btn" id="show">Show the Vietnamese</button></div>'
        : phase === 1 ? '<div class="next-row"><button class="btn" id="hide">Hide it and play again</button></div>'
        : '<div class="rate-block"><div class="eyebrow">Now say it out loud. How did that go?</div>'
          + '<div class="conf-row"><button class="conf" data-r="easy">Easy</button>'
          + '<button class="conf" data-r="ok">Acceptable</button>'
          + '<button class="conf" data-r="hard">Difficult</button></div></div>'))
      + '<div class="foot"><div class="bar"><i style="width:'+(i/d.lines.length*100)+'%"></i></div>'
      + '<span class="count">'+i+' / '+d.lines.length+'</span></div>';
    wireSpeak();
    if (phase === 0) autoSay([l.vi]);
    if ($("#show")) $("#show").onclick = function(){ phase = 1; step(); };
    if ($("#hide")) $("#hide").onclick = function(){ phase = 2; step(); TTS.say(l.vi); };
    $$(".conf").forEach(function(b){
      b.onclick = function(){
        const id2 = "shd:"+d.id+":"+i, r = rec(id2);
        r.reps++; r.last = Date.now();
        const v = b.dataset.r === "easy" ? 1 : b.dataset.r === "ok" ? 0.6 : 0.2;
        r.skills.production.n++; r.skills.production.m = Math.min(1, r.skills.production.m*0.6 + v*0.4);
        r.ivl = b.dataset.r === "hard" ? 0.5 : b.dataset.r === "ok" ? 2 : 5;
        r.due = Date.now() + r.ivl*DAY;
        S.xp += b.dataset.r === "hard" ? 6 : 4;
        save();
        i++; phase = 0; step();
      };
    });
  }
  step();
}

function viewWeak(){
  const w = weaknesses();
  const groups = {concept:[], slow:[], gap:[], confusion:[], south:[], skill:[]};
  w.forEach(x => (groups[x.kind]||groups.concept).push(x));
  const title = {concept:"Grammar instability", slow:"Slow recall", gap:"Production gap",
                 confusion:"Repeatedly confused", south:"Southern pronunciation", skill:"Skill imbalance"};
  const blurb = {concept:"one structure, several symptoms", slow:"known, but not reachable",
                 gap:"recognised, never produced", confusion:"they keep swapping",
                 south:"page against ear", skill:"one skill trailing the rest"};
  let html = '<div class="eyebrow">Weaknesses</div><h2 class="screen-h">Where it is actually breaking</h2>';
  if (!w.length) html += '<div class="empty">Not enough evidence yet. A few sessions and this screen fills itself in.</div>';
  Object.keys(groups).forEach(function(k){
    if (!groups[k].length) return;
    html += '<div class="group-h" style="margin-top:24px"><span class="eyebrow">'+esc(title[k])+'</span>'
          + '<span class="hint">'+esc(blurb[k])+'</span></div>';
    html += groups[k].slice(0,6).map(function(x){
      return '<button class="wrow" data-k="'+esc(x.kind)+'" data-id="'+esc(x.id)+'" data-c="'+esc(x.concept||"")+'">'
        + '<span class="wt">'+esc(x.title)+'</span>'
        + '<span class="wd">'+esc(x.detail)+'</span>'
        + '<span class="wl">'+esc(x.line)+'</span></button>';
    }).join("");
  });
  $("#stage").innerHTML = html;
  $$(".wrow").forEach(function(b){
    b.onclick = function(){
      const k = b.dataset.k, id = b.dataset.id, c = b.dataset.c;
      if (k === "concept" && COURSE.conceptById[id]) return explainSheet(id);
      if (k === "skill"){
        const pool = seen().filter(x => typesForSkill(x, id).length)
                           .sort((a,b2)=>rec(a.id).skills[id].m - rec(b2.id).skills[id].m);
        return drill(pool.slice(0,12), {skill:id, why:"skill"});
      }
      if (k === "south") return drill(shuffle(COURSE.all.filter(x=>x.south)).slice(0,12), {why:"south"});
      const it = COURSE.byId[id];
      const pool = c ? (COURSE.itemsByConcept[c]||[]) : [];
      drill((it?[it]:[]).concat(shuffle(pool).slice(0,7)), {why:"weak"});
    };
  });
}
