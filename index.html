<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ôn tiếng Việt">
<meta name="application-name" content="Ôn tiếng Việt">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Ôn tiếng Việt — Alexandre’s personal Vietnamese learning app. Learn to belong.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta property="og:title" content="Ôn tiếng Việt · Alexandre">
<meta property="og:description" content="Learn to belong — a personal Vietnamese learning app with a Southern focus.">
<meta property="og:image" content="https://alexandregermouty.github.io/On-tu-vung/logo.png">
<meta property="og:type" content="website">
<title>Ôn tiếng Việt · Alexandre</title>
<style>

:root{
  --lacquer:#101E1B;
  --panel:#172A26;
  --panel-2:#1E3630;
  --eggshell:#EFE7D6;
  --gold:#C8A15A;
  --cinnabar:#C8452F;
  --jade:#6FBFA0;
  --line:rgba(200,161,90,.20);
  --dim:rgba(239,231,214,.58);
  --dimmer:rgba(239,231,214,.34);
  --vi:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --en:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--lacquer);color:var(--eggshell);font-family:var(--vi);min-height:100vh;
  background-image:
    radial-gradient(circle at 12% 22%, rgba(239,231,214,.045) 0 1.1px, transparent 1.6px),
    radial-gradient(circle at 68% 9%,  rgba(239,231,214,.035) 0 .9px, transparent 1.4px),
    radial-gradient(circle at 34% 71%, rgba(239,231,214,.04) 0 1px, transparent 1.5px),
    radial-gradient(circle at 87% 58%, rgba(239,231,214,.03) 0 .8px, transparent 1.3px);
  background-size:180px 180px,240px 240px,300px 300px,210px 210px;
}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:19px;font-weight:800;letter-spacing:-.015em;margin:3px 0 0}
h1 span{color:var(--dim);font-weight:300}
.hdr-btns{display:flex;gap:6px;flex-shrink:0}
.icon{background:transparent;border:1px solid var(--line);color:var(--eggshell);border-radius:3px;
  height:34px;min-width:34px;padding:0 9px;cursor:pointer;font-family:var(--vi);font-size:12px;
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.icon:hover{border-color:var(--gold);background:rgba(200,161,90,.08)}
.icon.on{border-color:var(--gold);color:var(--gold)}
.rule{height:1px;background:var(--line);margin:14px 0}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.stats b{color:var(--eggshell);font-weight:600}
.stats .flame{color:var(--gold)}

nav.tabs{display:flex;gap:2px;margin:14px 0 0}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dimmer);
  font-family:var(--vi);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 12px 7px;cursor:pointer;transition:.15s}
nav.tabs button:hover{color:var(--dim)}
nav.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}

.decks{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px 7px 8px;border:1px solid var(--line);
  border-radius:3px;background:transparent;color:var(--dim);font-family:var(--vi);font-size:11.5px;
  font-weight:500;cursor:pointer;transition:.15s}
.chip:hover{border-color:rgba(200,161,90,.5)}
.chip[aria-pressed="true"]{background:var(--panel);border-color:var(--gold);color:var(--eggshell)}
.chip .ring{flex-shrink:0}
.chip .n{color:var(--dimmer);font-size:10px;font-variant-numeric:tabular-nums}
.deck-actions{display:flex;gap:14px;margin-top:10px;font-size:11px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--gold);font-family:var(--vi);font-size:11px;cursor:pointer;
  padding:0;border-bottom:1px solid rgba(200,161,90,.35)}
.link:hover{border-bottom-color:var(--gold)}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:26px 22px 22px;margin-top:18px;overflow:hidden}
.card::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.card.sweep::after{width:100%}
.card.shake{animation:shake .32s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.q-label{margin-bottom:16px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.q-label .why{color:var(--dimmer);letter-spacing:.04em;text-transform:none;font-weight:500;font-size:10px}
.prompt-en{font-family:var(--en);font-size:26px;line-height:1.24;font-weight:300;letter-spacing:-.01em}
.word{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.06;margin:0}
.word.sm{font-size:32px}
.gloss{font-family:var(--en);font-style:italic;font-size:19px;color:var(--dim);margin-top:6px;font-weight:300}
.sent{font-size:20px;font-weight:500;line-height:1.6;letter-spacing:-.01em}
.sent .blank{color:var(--gold);border-bottom:1.5px solid var(--gold);padding:0 22px}
.sent-en{font-family:var(--en);font-style:italic;font-size:15px;color:var(--dim);margin-top:8px;font-weight:300}
.note{font-family:var(--en);font-size:14px;color:var(--dim);font-style:italic;margin-top:14px;
  padding-left:11px;border-left:1px solid var(--line);line-height:1.6}
.note b{color:var(--eggshell);font-style:normal;font-weight:600}
.south-note{border-left-color:var(--jade)}

.tones{display:flex;gap:12px;align-items:flex-end;height:22px;margin-bottom:9px}
.tone-syl{display:flex;flex-direction:column;align-items:center;gap:2px}
.tone-syl svg{display:block;overflow:visible}
.tone-syl em{font-style:normal;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}

.audio{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.speak{background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:3px;
  padding:8px 13px;font-family:var(--vi);font-size:11.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.02em}
.speak:hover{background:rgba(200,161,90,.1);border-color:var(--gold)}
.speak.playing{background:rgba(200,161,90,.16);border-color:var(--gold)}
.speak kbd{font-family:var(--vi);font-size:9px;color:var(--dimmer);border:1px solid var(--line);
  border-radius:2px;padding:1px 4px}
.big-play{width:100%;justify-content:center;padding:26px;font-size:14px}

.opts{display:grid;gap:8px;margin-top:18px}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:14px 15px;color:var(--eggshell);font-family:var(--vi);font-size:16px;font-weight:500;
  cursor:pointer;transition:.13s;display:flex;align-items:center;gap:11px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--gold);background:var(--panel-2)}
.opt:disabled{cursor:default}
.opt .k{font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);border-radius:2px;
  padding:2px 5px;flex-shrink:0;font-variant-numeric:tabular-nums}
.opt.right{border-color:var(--jade);background:rgba(111,191,160,.1)}
.opt.right .k{border-color:var(--jade);color:var(--jade)}
.opt.wrong{border-color:var(--cinnabar);background:rgba(200,69,47,.1)}
.opt.wrong .k{border-color:var(--cinnabar);color:var(--cinnabar)}
.opt.fade{opacity:.4}
.opt .en{font-family:var(--en);font-style:italic;font-weight:300}
.opt.tall{flex-direction:column;align-items:flex-start;gap:6px}
.opt.tall .k{align-self:flex-start}

.typebox{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
input.type{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  padding:14px 15px;color:var(--eggshell);font-family:var(--vi);font-size:19px;font-weight:600;
  outline:none;letter-spacing:-.01em}
input.type:focus{border-color:var(--gold)}
.btn{background:var(--gold);border:1px solid var(--gold);color:#0E1A17;border-radius:3px;padding:13px 20px;
  font-family:var(--vi);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;transition:.15s}
.btn:hover{background:#D9B372;border-color:#D9B372}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(200,161,90,.12)}

/* word-order drills */
.tokens{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:18px;line-height:1}
.tok{padding:10px 11px;border:1px solid transparent;border-radius:3px;background:var(--panel-2);
  font-size:17px;font-weight:500;color:var(--eggshell)}
.slot{min-width:24px;height:40px;border:1px dashed rgba(200,161,90,.5);border-radius:3px;background:transparent;
  color:var(--gold);cursor:pointer;font-size:13px;padding:0 4px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--vi);transition:.13s}
.slot:hover:not(:disabled){background:rgba(200,161,90,.16);border-style:solid}
.slot.right{border-color:var(--jade);color:var(--jade);background:rgba(111,191,160,.14);border-style:solid}
.slot.wrong{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(200,69,47,.14);border-style:solid}
.slot.filled{border-style:solid;border-color:var(--gold);background:rgba(200,161,90,.14);
  font-size:17px;font-weight:600;padding:0 10px}
.answer-line{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:52px;margin-top:16px;
  padding:6px 4px;border-bottom:1px solid var(--line)}
.answer-line:empty::before{content:"tap the words in order";color:var(--dimmer);font-size:12px;font-style:italic;
  font-family:var(--en)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tile{padding:11px 13px;border:1px solid var(--line);border-radius:3px;background:var(--panel-2);
  color:var(--eggshell);font-family:var(--vi);font-size:17px;font-weight:500;cursor:pointer;transition:.13s}
.tile:hover:not(:disabled){border-color:var(--gold)}
.tile.used{opacity:.22;pointer-events:none}
.tile.placed{border-color:var(--gold);background:rgba(200,161,90,.12)}

/* tone quiz */
.tone-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:18px}
.tone-opt{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 8px;
  cursor:pointer;transition:.13s;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-family:var(--vi);font-size:12px;font-weight:600;color:var(--eggshell)}
.tone-opt:hover:not(:disabled){border-color:var(--gold);background:var(--panel-2)}
.tone-opt small{color:var(--dimmer);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.tone-opt.right{border-color:var(--jade);background:rgba(111,191,160,.1)}
.tone-opt.wrong{border-color:var(--cinnabar);background:rgba(200,69,47,.1)}
.tone-opt.fade{opacity:.4}

.verdict{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.vtag{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.vtag.ok{color:var(--jade)}
.vtag.no{color:var(--cinnabar)}
.vtag.near{color:var(--gold)}
.vrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px}
.vrow .w{font-size:27px;font-weight:800;letter-spacing:-.02em}
.vrow .g{font-family:var(--en);font-style:italic;color:var(--dim);font-size:17px;font-weight:300}
.next-row{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.hint{font-size:10.5px;color:var(--dimmer);letter-spacing:.04em;line-height:1.6}

.foot{margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:3px;background:rgba(239,231,214,.1);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
.count{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.combo{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.1em}

.list-head{display:flex;gap:10px;align-items:center;margin:16px 0 4px;flex-wrap:wrap}
input.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:10px 12px;color:var(--eggshell);font-family:var(--vi);font-size:14px;outline:none}
input.search:focus{border-color:var(--gold)}
.row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid rgba(200,161,90,.1)}
.row .pill{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--dimmer)}
.row .vi{font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:130px}
.row .en{font-family:var(--en);font-style:italic;color:var(--dim);font-size:15px;font-weight:300;flex:1}
.row .mini{background:none;border:0;color:var(--gold);cursor:pointer;font-size:14px;padding:5px 7px;border-radius:3px}
.row .mini:hover{background:rgba(200,161,90,.12)}
.row .bx{font-size:9px;letter-spacing:.1em;color:var(--dimmer);text-transform:uppercase}
.group-h{margin:22px 0 2px;display:flex;align-items:baseline;gap:10px}

.scrim{position:fixed;inset:0;background:rgba(8,15,13,.72);display:none;z-index:40;
  align-items:flex-end;justify-content:center;padding:0}
.scrim.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;
  width:100%;max-width:560px;padding:22px 20px 34px;max-height:88vh;overflow:auto}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:6px;border-bottom:1px solid var(--line)}}
.field{margin-top:18px}
.field label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:7px}
select,input[type=range]{width:100%}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px;
  color:var(--eggshell);font-family:var(--vi);font-size:14px;outline:none}
select:focus{border-color:var(--gold)}
input[type=range]{accent-color:var(--gold)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--dim);font-family:var(--vi);font-size:12px;
  font-weight:600;padding:10px 6px;cursor:pointer;transition:.15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(200,161,90,.16);color:var(--gold)}
.warn{border:1px solid rgba(200,69,47,.45);background:rgba(200,69,47,.08);border-radius:3px;
  padding:12px 13px;font-family:var(--en);font-size:14px;line-height:1.5;color:var(--eggshell);margin-top:16px}
.warn a{color:var(--gold)}
.ok-note{border:1px solid rgba(111,191,160,.35);background:rgba(111,191,160,.07);border-radius:3px;
  padding:11px 12px;font-family:var(--en);font-size:14px;line-height:1.5;margin-top:16px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim)}
.legend b{color:var(--eggshell);font-weight:600;font-size:13px}
textarea.box{width:100%;min-height:92px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  padding:10px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;
  outline:none;resize:vertical}
textarea.box:focus{border-color:var(--gold)}

.score{font-size:66px;font-weight:800;letter-spacing:-.045em;line-height:1}
.score small{font-size:20px;font-weight:300;color:var(--dim);letter-spacing:0}
.sum-grid{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.sum-grid div b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sum-grid div span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.empty{font-family:var(--en);font-size:16px;color:var(--dim);line-height:1.6;margin-top:20px;font-style:italic}

/* ══════════════════════════════════════════════════════════════════════
   additions for the training system · same palette, same typography
   ══════════════════════════════════════════════════════════════════════ */
:root{ --dimmer:rgba(239,231,214,.34); }

/* nav — eight sections, scrollable on a phone */
#nav{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid var(--line); margin:0 -18px 20px; padding:0 18px;
  -webkit-overflow-scrolling:touch; }
#nav::-webkit-scrollbar{ display:none; }
#nav button{ flex:0 0 auto; background:none; border:none; color:var(--eggshell);
  opacity:.45; font-family:inherit; font-size:12.5px; letter-spacing:.13em;
  text-transform:uppercase; padding:13px 11px 11px; cursor:pointer;
  border-bottom:1.5px solid transparent; transition:opacity .18s, border-color .18s; }
#nav button[aria-selected="true"]{ opacity:1; border-bottom-color:var(--gold); }
#nav button:hover{ opacity:.8; }

/* today */
.hero{ margin:4px 0 18px; }
.today-h{ font-family:var(--serif); font-size:40px; font-weight:400; margin:6px 0 4px;
  letter-spacing:-.01em; }
.today-min{ font-size:14px; opacity:.55; letter-spacing:.02em; }
.planlist{ list-style:none; margin:0; padding:0; }
.planlist li{ display:flex; align-items:baseline; gap:13px; padding:9px 0;
  border-bottom:1px solid rgba(200,161,90,.10); font-size:15.5px; }
.planlist li:last-child{ border-bottom:none; }
.planlist .n{ font-family:var(--serif); font-size:21px; color:var(--gold);
  min-width:26px; text-align:right; }
.mixrow{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.mixtag{ font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:999px; padding:4px 10px; opacity:.6; }
.quickrow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.quick{ text-align:left; background:var(--panel); border:1px solid var(--line);
  border-radius:13px; padding:14px 15px; color:var(--eggshell); font-family:inherit;
  cursor:pointer; transition:border-color .18s, transform .12s; }
.quick:hover{ border-color:rgba(200,161,90,.42); }
.quick:active{ transform:scale(.985); }
.quick b{ display:block; font-weight:500; font-size:15px; margin-bottom:3px; }
.quick span{ font-size:12.5px; opacity:.5; line-height:1.4; }
.card.accent{ border-color:rgba(200,161,90,.42); }

/* tutor block */
.tutor{ border-left:2px solid var(--gold); padding:4px 0 4px 15px; margin:18px 0 0; }
.tutor p{ margin:7px 0 0; font-size:14.5px; line-height:1.6; opacity:.82; }

/* course map */
.screen-h{ font-family:var(--serif); font-size:29px; font-weight:400; margin:5px 0 12px; }
.unit{ display:block; width:100%; text-align:left; background:var(--panel);
  border:1px solid var(--line); border-radius:13px; padding:15px 16px; margin-bottom:9px;
  color:var(--eggshell); font-family:inherit; cursor:pointer; transition:border-color .18s; }
.unit:hover{ border-color:rgba(200,161,90,.4); }
.unit-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.unit-t{ font-size:15.5px; }
.unit-pct{ font-family:var(--serif); font-size:17px; color:var(--gold); }
.ubar{ height:3px; background:rgba(239,231,214,.10); border-radius:2px; margin:10px 0 8px;
  overflow:hidden; }
.ubar i{ display:block; height:100%; background:var(--gold); border-radius:2px;
  transition:width .5s cubic-bezier(.2,.7,.3,1); }
.unit-sub{ font-size:12.5px; opacity:.45; line-height:1.45; }

.crow{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid rgba(200,161,90,.10);
  color:var(--eggshell); font-family:inherit; padding:11px 2px; cursor:pointer; }
.crow:hover{ background:rgba(239,231,214,.03); }
.cdot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.ct{ flex:1; font-size:14.5px; }
.cm{ font-size:12px; opacity:.5; font-variant-numeric:tabular-nums; }
.locked{ font-size:10.5px; opacity:.38; letter-spacing:.05em; }

/* review tiles */
.cardrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.tile-btn{ background:var(--panel); border:1px solid var(--line); border-radius:13px;
  padding:16px 13px; color:var(--eggshell); font-family:inherit; cursor:pointer;
  text-align:left; transition:border-color .18s; }
.tile-btn:hover{ border-color:rgba(200,161,90,.42); }
.tile-btn b{ display:block; font-family:var(--serif); font-size:31px; color:var(--gold);
  font-weight:400; line-height:1; margin-bottom:8px; }
.tt{ display:block; font-size:13.5px; margin-bottom:3px; }
.ts{ display:block; font-size:11.5px; opacity:.45; line-height:1.4; }

.mrow{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid rgba(200,161,90,.10);
  color:var(--eggshell); font-family:inherit; padding:11px 2px; cursor:pointer; }
.mrow:hover{ background:rgba(239,231,214,.03); }
.mn{ font-family:var(--serif); font-size:17px; color:var(--cinnabar); min-width:20px; }
.mv{ flex:1; font-size:15px; }
.mc{ font-size:11.5px; opacity:.45; text-align:right; max-width:45%; }

/* listening lab */
.labgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.lab{ text-align:left; background:var(--panel); border:1px solid var(--line);
  border-radius:13px; padding:14px 15px; color:var(--eggshell); font-family:inherit;
  cursor:pointer; transition:border-color .18s, transform .12s; }
.lab:hover{ border-color:rgba(200,161,90,.42); }
.lab:active{ transform:scale(.985); }
.lab b{ display:block; font-weight:500; font-size:14.5px; margin-bottom:3px; }
.lab span{ font-size:12px; opacity:.5; line-height:1.4; }

.replay{ margin:18px 0 6px; text-align:center; }
.big-play{ font-size:16px !important; padding:13px 26px !important; }
.replay-row{ display:flex; gap:7px; justify-content:center; align-items:center;
  margin-top:11px; flex-wrap:wrap; }
.speak.sm{ font-size:11.5px; padding:5px 11px; letter-spacing:.05em; }

/* pronunciation trainer */
.build-seq{ display:flex; align-items:center; justify-content:center; gap:12px;
  margin:22px 0 4px; }
.build-seq span{ font-family:var(--serif); font-size:38px; }
.build-seq .plus{ font-size:20px; opacity:.35; }
.build-seq .dim{ opacity:.3; }
.tonegrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
  gap:8px; margin:16px 0 4px; }
.tonecell{ border:1px solid var(--line); border-radius:11px; padding:11px 9px;
  text-align:center; }
.tonecell.hit{ border-color:var(--jade); background:rgba(111,191,160,.07); }
.tonecell b{ display:block; font-family:var(--serif); font-size:23px; font-weight:400;
  margin:5px 0 3px; }
.tonecell span{ display:block; font-size:11.5px; opacity:.5; line-height:1.35; }
.south-pair{ display:flex; align-items:center; justify-content:center; gap:20px;
  margin:22px 0 6px; flex-wrap:wrap; }
.south-pair .lbl{ display:block; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; opacity:.42; margin-bottom:5px; }
.south-pair b{ font-family:var(--serif); font-size:32px; font-weight:400; }
.south-pair .arrow{ font-size:20px; opacity:.4; }

/* speak */
.scrow{ display:flex; align-items:baseline; gap:12px; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid rgba(200,161,90,.10);
  color:var(--eggshell); font-family:inherit; padding:13px 2px; cursor:pointer; }
.scrow:hover{ background:rgba(239,231,214,.03); }
.sct{ flex:1; font-size:15.5px; }
.sce{ font-size:12.5px; opacity:.45; }
.scn{ font-size:11px; opacity:.4; }
.goal{ font-size:20px; line-height:1.5; margin:16px 0 6px; font-family:var(--serif); }
.who-big{ font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  opacity:.45; margin-bottom:10px; }
.hidden-sent{ opacity:.28; letter-spacing:.3em; }
.rate-block{ margin-top:20px; }

/* dialogue */
.dlg{ border-left:2px solid var(--line); padding-left:15px; margin:14px 0 0; }
.dlg-line{ margin-bottom:12px; }
.dlg-line .who{ display:inline-block; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; opacity:.42; min-width:44px; }
.dlg-line .vi{ display:block; font-size:16px; margin:2px 0 1px; }
.dlg-line .en{ display:block; font-size:12.5px; opacity:.45; }
.dlg-line.open .vi{ color:var(--gold); letter-spacing:.2em; }
.sentopt{ display:block; line-height:1.5; }

/* weaknesses */
.wrow{ display:block; width:100%; text-align:left; background:var(--panel);
  border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:8px;
  color:var(--eggshell); font-family:inherit; cursor:pointer; transition:border-color .18s; }
.wrow:hover{ border-color:rgba(200,161,90,.42); }
.wt{ display:block; font-size:16px; margin-bottom:3px; }
.wd{ display:block; font-size:12.5px; color:var(--gold); opacity:.8; margin-bottom:6px;
  font-variant-numeric:tabular-nums; }
.wl{ display:block; font-size:13px; opacity:.55; line-height:1.5; }

/* word list */
.filters{ display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 16px; }
.filt{ background:none; border:1px solid var(--line); border-radius:999px;
  color:var(--eggshell); font-family:inherit; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:5px 11px; cursor:pointer; opacity:.5; }
.filt.on{ opacity:1; border-color:var(--gold); color:var(--gold); }
.flag{ font-size:11px; opacity:.7; margin-left:3px; }
.dim{ opacity:.45; }
.bad{ color:var(--cinnabar); }
.vi-inline{ font-family:var(--serif); }

/* skill bars */
.skillgrid{ margin:18px 0 0; }
.sk, .skrow{ display:flex; align-items:center; gap:11px; padding:7px 0; }
.skn{ flex:0 0 108px; font-size:13px; opacity:.72; }
.skbar{ flex:1; height:4px; background:rgba(239,231,214,.10); border-radius:2px;
  overflow:hidden; }
.skbar i{ display:block; height:100%; background:var(--gold); border-radius:2px;
  transition:width .5s cubic-bezier(.2,.7,.3,1); }
.skv{ flex:0 0 46px; text-align:right; font-size:12.5px; opacity:.6;
  font-variant-numeric:tabular-nums; }
.skc{ flex:0 0 62px; text-align:right; font-size:11px; opacity:.35; }

/* progress */
.twocol{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.bignum{ font-family:var(--serif); font-size:50px; line-height:1; color:var(--gold);
  margin-bottom:8px; }
.bignum small{ font-size:19px; opacity:.55; margin-left:2px; }
.spark{ display:flex; align-items:flex-end; gap:4px; height:44px; padding:4px 0; }
.spark span{ flex:1; background:var(--gold); border-radius:2px 2px 0 0; min-height:3px; }
.report{ border:1px solid var(--line); border-radius:13px; padding:15px 16px; }
.rrow{ display:flex; gap:12px; padding:7px 0;
  border-bottom:1px solid rgba(200,161,90,.09); }
.rrow:last-child{ border-bottom:none; }
.rt{ flex:0 0 96px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  opacity:.45; padding-top:2px; }
.rv{ flex:1; font-size:13.5px; line-height:1.55; opacity:.85; }

/* confidence + verdict extras */
.conf-row{ display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }
.conf{ flex:1; min-width:92px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:11px; padding:12px 10px; color:var(--eggshell); font-family:inherit;
  font-size:14px; cursor:pointer; transition:border-color .16s, background .16s; }
.conf:hover{ border-color:var(--gold); background:rgba(200,161,90,.08); }
.why-btn{ background:none; border:1px solid var(--line); border-radius:999px;
  color:var(--eggshell); font-family:inherit; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; padding:4px 11px; cursor:pointer; opacity:.55;
  margin-left:auto; }
.why-btn:hover{ opacity:1; border-color:var(--gold); }
.notebar{ display:flex; gap:6px; margin-top:16px; flex-wrap:wrap; }
.tag{ background:none; border:1px solid var(--line); border-radius:999px;
  color:var(--eggshell); font-family:inherit; font-size:11px; padding:5px 11px;
  cursor:pointer; opacity:.45; }
.tag.on{ opacity:1; border-color:var(--gold); color:var(--gold); }
.wrongline, .rightline{ font-size:14.5px; line-height:1.6; margin:8px 0 0; }
.wrongline b, .rightline b{ font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  opacity:.5; margin-right:7px; font-weight:400; }
.wrongline{ color:rgba(239,231,214,.72); }
.rightline{ color:var(--eggshell); }
.speedline{ font-size:12px; margin-top:11px; opacity:.55;
  font-variant-numeric:tabular-nums; }
.speedline .fast{ color:var(--jade); opacity:.95; }
.speedline .slow{ color:var(--cinnabar); opacity:.9; }
.wrong-sent{ text-decoration:line-through; text-decoration-color:rgba(200,69,47,.5);
  text-decoration-thickness:1.5px; }
.vtag.near{ background:rgba(200,161,90,.14); color:var(--gold); }
.course-note{ border-left:2px solid var(--cinnabar); }
.note.big{ font-size:15px; line-height:1.65; }
.ex-line{ display:flex; align-items:baseline; gap:10px; padding:8px 0;
  border-bottom:1px solid rgba(200,161,90,.09); }
.ex-line .vi{ flex:1 1 auto; font-size:15.5px; }
.ex-line .en{ flex:1 1 40%; font-size:12.5px; opacity:.5; }
.micro-check{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
.sheet-h{ font-family:var(--serif); font-size:27px; font-weight:400; margin:5px 0 10px; }
.gloss.sm{ font-size:14px; }

@media (max-width:420px){
  .cardrow{ grid-template-columns:1fr; }
  .labgrid, .quickrow{ grid-template-columns:1fr; }
  .twocol{ gap:14px; }
  .today-h{ font-size:34px; }
  .skn{ flex-basis:90px; font-size:12px; }
  .rt{ flex-basis:76px; }
}


/* content manager + richer evidence feedback */
.content-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.lesson-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:9px}
.lesson-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lesson-title{font-size:15.5px;font-weight:600}.lesson-meta{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.lesson-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.lesson-actions button{font-size:10.5px}
.import-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.import-summary div{border:1px solid var(--line);border-radius:9px;padding:10px}.import-summary b{display:block;font-family:var(--en);font-size:24px;color:var(--gold)}.import-summary span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}.field input[type=text],.field input[type=date]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 11px;color:var(--eggshell);font-family:var(--vi);font-size:14px;outline:none}.field input:focus{border-color:var(--gold)}
.pill-status{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.vtag.near{padding:3px 8px;border-radius:999px;display:inline-block}
@media(max-width:520px){.formgrid,.import-summary{grid-template-columns:1fr}}


/* ═══════════════════════════════════════════════════════════════════════
   V6 VISUAL SYSTEM · lacquer × editorial notebook × native app
   Purely presentational: learning logic and stored progress stay untouched.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --serif:var(--en);
  --lacquer:#0C1816;
  --panel:#142622;
  --panel-2:#1A302B;
  --surface:#142622;
  --surface-raised:#19302B;
  --surface-soft:#10211E;
  --eggshell:#F3EBDD;
  --gold:#C9A565;
  --gold-soft:rgba(201,165,101,.12);
  --cinnabar:#CF5A43;
  --jade:#7AC4A6;
  --line:rgba(243,235,221,.11);
  --line-strong:rgba(243,235,221,.18);
  --text-2:rgba(243,235,221,.72);
  --text-3:rgba(243,235,221,.50);
  --text-4:rgba(243,235,221,.34);
  --dim:var(--text-2);
  --dimmer:var(--text-4);
  --r-xs:8px;
  --r-sm:12px;
  --r-md:16px;
  --r-lg:22px;
  --shadow-soft:0 10px 30px rgba(0,0,0,.14);
  --shadow-raised:0 20px 55px rgba(0,0,0,.22);
  --ease:cubic-bezier(.2,.8,.2,1);
  --shell:1020px;
  color-scheme:dark;
}
html{scroll-behavior:smooth;background:var(--lacquer)}
body{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  background:
    radial-gradient(900px 580px at 8% -5%, rgba(122,196,166,.065), transparent 58%),
    radial-gradient(820px 620px at 96% 3%, rgba(201,165,101,.06), transparent 60%),
    linear-gradient(180deg,#0E1D1A 0%,var(--lacquer) 36%,#091310 100%);
  background-attachment:fixed;
  color:var(--eggshell);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;
  background-image:radial-gradient(rgba(243,235,221,.18) .45px,transparent .55px);
  background-size:6px 6px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 72%);
}
::selection{background:rgba(201,165,101,.30);color:var(--eggshell)}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:var(--shell);padding:calc(24px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));}

/* header + brand */
.app-header{align-items:center;min-height:54px;margin-bottom:4px}
.brand-lockup{display:flex;align-items:center;gap:13px;min-width:0}
.brand-copy h1{font-family:var(--serif);font-size:24px;line-height:1;font-weight:500;letter-spacing:-.025em;margin:0;color:var(--eggshell)}
.brand-sub{font-size:11px;color:var(--text-3);margin-top:6px;letter-spacing:.045em}
.brand-tones{display:grid;grid-template-columns:repeat(3,10px);grid-template-rows:repeat(2,9px);gap:3px 4px;padding:8px 9px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(243,235,221,.04),rgba(201,165,101,.05));box-shadow:inset 0 1px rgba(255,255,255,.035)}
.brand-tones span{position:relative;width:10px;height:9px;display:block}
.brand-tones span::before,.brand-tones span::after{content:"";position:absolute;background:var(--gold);opacity:.92;border-radius:99px}
.tone-ngang::before{width:9px;height:1.4px;left:.5px;top:4px}
.tone-huyen::before{width:9px;height:1.4px;left:.5px;top:4px;transform:rotate(29deg)}
.tone-sac::before{width:9px;height:1.4px;left:.5px;top:4px;transform:rotate(-29deg)}
.tone-hoi::before{width:7px;height:5px;left:1px;top:1px;background:transparent!important;border:1.4px solid var(--gold);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-15deg);border-radius:50%}
.tone-nga::before{width:8px;height:4px;left:1px;top:2px;background:transparent!important;border-top:1.4px solid var(--gold);border-radius:50%;transform:skewY(-16deg)}
.tone-nang::before{width:3px;height:3px;left:3.5px;top:5px;border-radius:50%}
.hdr-btns{gap:8px}
.icon.icon-round{width:40px;height:40px;min-width:40px;padding:0;border-radius:13px;background:rgba(243,235,221,.025);border-color:var(--line);color:var(--text-2);transition:transform .18s var(--ease),background .18s,border-color .18s,color .18s}
.icon.icon-round svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.icon.icon-round svg path:first-child{fill:currentColor;stroke:none}
.icon.icon-round:hover{transform:translateY(-1px);color:var(--gold);background:var(--gold-soft);border-color:rgba(201,165,101,.32)}
.rule{background:var(--line);margin:16px 0 11px}
.stats{min-height:29px;gap:8px;font-size:11px;color:var(--text-3);align-items:center}
.stats span{border:1px solid transparent;border-radius:999px;padding:5px 8px;white-space:nowrap}
.stats b{color:var(--text-2);font-weight:650}
.stats .flame{color:var(--gold);background:var(--gold-soft);border-color:rgba(201,165,101,.15)}

/* navigation */
#nav{margin:7px 0 26px;padding:4px;border:1px solid var(--line);border-radius:15px;background:rgba(243,235,221,.025);gap:3px;overflow-x:auto;box-shadow:inset 0 1px rgba(255,255,255,.018)}
#nav button{display:flex;align-items:center;justify-content:center;gap:7px;border:0!important;border-radius:11px;padding:9px 11px;color:var(--text-3);opacity:1;font-size:11.5px;letter-spacing:.015em;text-transform:none;transition:background .18s,color .18s,transform .16s var(--ease)}
#nav button:hover{color:var(--text-2);background:rgba(243,235,221,.035)}
#nav button[aria-selected="true"]{color:var(--eggshell);background:rgba(201,165,101,.12);box-shadow:inset 0 0 0 1px rgba(201,165,101,.13)}
#nav button:active{transform:scale(.98)}
.nav-glyph{font-family:var(--vi);font-size:13px;line-height:1;color:var(--gold);min-width:16px;text-align:center}
#moreNav{display:none}

/* type scale + labels */
.eyebrow{font-size:10px;font-weight:650;letter-spacing:.135em;text-transform:uppercase;color:var(--gold)}
.screen-h,.today-h,.sheet-h{font-family:var(--serif);font-weight:450;letter-spacing:-.028em;color:var(--eggshell)}
.screen-h{font-size:34px;margin:7px 0 10px}.sheet-h{font-size:31px}.today-h{font-size:48px;margin:5px 0 5px}
.hint,.unit-sub,.ts,.wl,.today-min,.lesson-meta,.sce,.scn,.dlg-line .en{color:var(--text-3)!important;opacity:1!important}
.prompt-en{font-family:var(--serif);font-size:28px;line-height:1.22;color:var(--eggshell)}
.word{font-size:54px;line-height:1.01;letter-spacing:-.045em}.word.sm{font-size:38px}
.gloss{color:var(--text-2);font-size:18px}.sent{line-height:1.55}

/* surfaces */
.card,.unit,.tile-btn,.lab,.wrow,.lesson-card,.report,.quick,.tonecell{
  border-color:var(--line);background:linear-gradient(155deg,rgba(25,48,43,.96),rgba(17,35,31,.96));
  box-shadow:inset 0 1px rgba(255,255,255,.025);
}
.card{border-radius:var(--r-lg);padding:30px 29px 27px;margin-top:18px;box-shadow:var(--shadow-soft),inset 0 1px rgba(255,255,255,.025)}
.card::after{height:2px;background:linear-gradient(90deg,var(--gold),rgba(201,165,101,.2));transition-duration:.55s}
.card.accent{border-color:rgba(201,165,101,.25);background:linear-gradient(155deg,rgba(42,50,37,.72),rgba(20,39,34,.98))}
.quick,.unit,.tile-btn,.lab,.wrow,.lesson-card{border-radius:var(--r-md);transition:transform .18s var(--ease),border-color .18s,background .18s,box-shadow .18s}
.quick:hover,.unit:hover,.tile-btn:hover,.lab:hover,.wrow:hover{transform:translateY(-2px);border-color:rgba(201,165,101,.24);box-shadow:0 12px 24px rgba(0,0,0,.10)}
.quick:active,.unit:active,.tile-btn:active,.lab:active,.wrow:active{transform:translateY(0) scale(.99)}

/* controls */
.btn{min-height:44px;border-radius:12px;padding:12px 18px;background:var(--gold);border-color:var(--gold);color:#0D1916;font-size:11.5px;font-weight:750;letter-spacing:.055em;text-transform:none;box-shadow:0 7px 18px rgba(0,0,0,.12);transition:transform .16s var(--ease),box-shadow .18s,background .18s,border-color .18s}
.btn:hover{background:#D7B77A;border-color:#D7B77A;transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.16)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.ghost{background:rgba(243,235,221,.025);border-color:var(--line-strong);color:var(--text-2);box-shadow:none}
.btn.ghost:hover{background:rgba(201,165,101,.08);border-color:rgba(201,165,101,.28);color:var(--eggshell)}
.link{border-bottom:0;color:var(--gold)}
.opt{border-color:var(--line);border-radius:13px;background:rgba(243,235,221,.025);padding:15px 16px;transition:transform .15s var(--ease),border-color .15s,background .15s}
