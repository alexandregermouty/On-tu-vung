<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn từ vựng · 22/07 → 16/08</title>
<meta name="theme-color" content="#101E1B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ôn từ vựng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,500;0,600;0,800;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;1,6..72,300&display=swap" rel="stylesheet">
<style>
:root{
  --lacquer:#101E1B;
  --panel:#172A26;
  --panel-2:#1E3630;
  --eggshell:#EFE7D6;
  --gold:#C8A15A;
  --cinnabar:#C8452F;
  --jade:#6FBFA0;
  --line:rgba(200,161,90,.20);
  --dim:rgba(239,231,214,.58);
  --dimmer:rgba(239,231,214,.34);
  --vi:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --en:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--lacquer);color:var(--eggshell);font-family:var(--vi);min-height:100vh;
  background-image:
    radial-gradient(circle at 12% 22%, rgba(239,231,214,.045) 0 1.1px, transparent 1.6px),
    radial-gradient(circle at 68% 9%,  rgba(239,231,214,.035) 0 .9px, transparent 1.4px),
    radial-gradient(circle at 34% 71%, rgba(239,231,214,.04) 0 1px, transparent 1.5px),
    radial-gradient(circle at 87% 58%, rgba(239,231,214,.03) 0 .8px, transparent 1.3px);
  background-size:180px 180px,240px 240px,300px 300px,210px 210px;
}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:19px;font-weight:800;letter-spacing:-.015em;margin:3px 0 0}
h1 span{color:var(--dim);font-weight:300}
.hdr-btns{display:flex;gap:6px;flex-shrink:0}
.icon{background:transparent;border:1px solid var(--line);color:var(--eggshell);border-radius:3px;
  height:34px;min-width:34px;padding:0 9px;cursor:pointer;font-family:var(--vi);font-size:12px;
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.icon:hover{border-color:var(--gold);background:rgba(200,161,90,.08)}
.icon.on{border-color:var(--gold);color:var(--gold)}
.rule{height:1px;background:var(--line);margin:14px 0}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.stats b{color:var(--eggshell);font-weight:600}
.stats .flame{color:var(--gold)}

nav.tabs{display:flex;gap:2px;margin:14px 0 0}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dimmer);
  font-family:var(--vi);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 12px 7px;cursor:pointer;transition:.15s}
nav.tabs button:hover{color:var(--dim)}
nav.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}

.decks{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px 7px 8px;border:1px solid var(--line);
  border-radius:3px;background:transparent;color:var(--dim);font-family:var(--vi);font-size:11.5px;
  font-weight:500;cursor:pointer;transition:.15s}
.chip:hover{border-color:rgba(200,161,90,.5)}
.chip[aria-pressed="true"]{background:var(--panel);border-color:var(--gold);color:var(--eggshell)}
.chip .ring{flex-shrink:0}
.chip .n{color:var(--dimmer);font-size:10px;font-variant-numeric:tabular-nums}
.deck-actions{display:flex;gap:14px;margin-top:10px;font-size:11px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--gold);font-family:var(--vi);font-size:11px;cursor:pointer;
  padding:0;border-bottom:1px solid rgba(200,161,90,.35)}
.link:hover{border-bottom-color:var(--gold)}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:26px 22px 22px;margin-top:18px;overflow:hidden}
.card::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.card.sweep::after{width:100%}
.card.shake{animation:shake .32s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.q-label{margin-bottom:16px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.q-label .why{color:var(--dimmer);letter-spacing:.04em;text-transform:none;font-weight:500;font-size:10px}
.prompt-en{font-family:var(--en);font-size:26px;line-height:1.24;font-weight:300;letter-spacing:-.01em}
.word{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.06;margin:0}
.word.sm{font-size:32px}
.gloss{font-family:var(--en);font-style:italic;font-size:19px;color:var(--dim);margin-top:6px;font-weight:300}
.sent{font-size:20px;font-weight:500;line-height:1.6;letter-spacing:-.01em}
.sent .blank{color:var(--gold);border-bottom:1.5px solid var(--gold);padding:0 22px}
.sent-en{font-family:var(--en);font-style:italic;font-size:15px;color:var(--dim);margin-top:8px;font-weight:300}
.note{font-family:var(--en);font-size:14px;color:var(--dim);font-style:italic;margin-top:14px;
  padding-left:11px;border-left:1px solid var(--line);line-height:1.6}
.note b{color:var(--eggshell);font-style:normal;font-weight:600}
.south-note{border-left-color:var(--jade)}

.tones{display:flex;gap:12px;align-items:flex-end;height:22px;margin-bottom:9px}
.tone-syl{display:flex;flex-direction:column;align-items:center;gap:2px}
.tone-syl svg{display:block;overflow:visible}
.tone-syl em{font-style:normal;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}

.audio{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.speak{background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:3px;
  padding:8px 13px;font-family:var(--vi);font-size:11.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.02em}
.speak:hover{background:rgba(200,161,90,.1);border-color:var(--gold)}
.speak.playing{background:rgba(200,161,90,.16);border-color:var(--gold)}
.speak kbd{font-family:var(--vi);font-size:9px;color:var(--dimmer);border:1px solid var(--line);
  border-radius:2px;padding:1px 4px}
.big-play{width:100%;justify-content:center;padding:26px;font-size:14px}

.opts{display:grid;gap:8px;margin-top:18px}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:14px 15px;color:var(--eggshell);font-family:var(--vi);font-size:16px;font-weight:500;
  cursor:pointer;transition:.13s;display:flex;align-items:center;gap:11px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--gold);background:var(--panel-2)}
.opt:disabled{cursor:default}
.opt .k{font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);border-radius:2px;
  padding:2px 5px;flex-shrink:0;font-variant-numeric:tabular-nums}
.opt.right{border-color:var(--jade);background:rgba(111,191,160,.1)}
.opt.right .k{border-color:var(--jade);color:var(--jade)}
.opt.wrong{border-color:var(--cinnabar);background:rgba(200,69,47,.1)}
.opt.wrong .k{border-color:var(--cinnabar);color:var(--cinnabar)}
.opt.fade{opacity:.4}
.opt .en{font-family:var(--en);font-style:italic;font-weight:300}
.opt.tall{flex-direction:column;align-items:flex-start;gap:6px}
.opt.tall .k{align-self:flex-start}

.typebox{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
input.type{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  padding:14px 15px;color:var(--eggshell);font-family:var(--vi);font-size:19px;font-weight:600;
  outline:none;letter-spacing:-.01em}
input.type:focus{border-color:var(--gold)}
.btn{background:var(--gold);border:1px solid var(--gold);color:#0E1A17;border-radius:3px;padding:13px 20px;
  font-family:var(--vi);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;transition:.15s}
.btn:hover{background:#D9B372;border-color:#D9B372}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(200,161,90,.12)}

/* word-order drills */
.tokens{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:18px;line-height:1}
.tok{padding:10px 11px;border:1px solid transparent;border-radius:3px;background:var(--panel-2);
  font-size:17px;font-weight:500;color:var(--eggshell)}
.slot{min-width:24px;height:40px;border:1px dashed rgba(200,161,90,.5);border-radius:3px;background:transparent;
  color:var(--gold);cursor:pointer;font-size:13px;padding:0 4px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--vi);transition:.13s}
.slot:hover:not(:disabled){background:rgba(200,161,90,.16);border-style:solid}
.slot.right{border-color:var(--jade);color:var(--jade);background:rgba(111,191,160,.14);border-style:solid}
.slot.wrong{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(200,69,47,.14);border-style:solid}
.slot.filled{border-style:solid;border-color:var(--gold);background:rgba(200,161,90,.14);
  font-size:17px;font-weight:600;padding:0 10px}
.answer-line{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:52px;margin-top:16px;
  padding:6px 4px;border-bottom:1px solid var(--line)}
.answer-line:empty::before{content:"tap the words in order";color:var(--dimmer);font-size:12px;font-style:italic;
  font-family:var(--en)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tile{padding:11px 13px;border:1px solid var(--line);border-radius:3px;background:var(--panel-2);
  color:var(--eggshell);font-family:var(--vi);font-size:17px;font-weight:500;cursor:pointer;transition:.13s}
.tile:hover:not(:disabled){border-color:var(--gold)}
.tile.used{opacity:.22;pointer-events:none}
.tile.placed{border-color:var(--gold);background:rgba(200,161,90,.12)}

/* tone quiz */
.tone-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:18px}
.tone-opt{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 8px;
  cursor:pointer;transition:.13s;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-family:var(--vi);font-size:12px;font-weight:600;color:var(--eggshell)}
.tone-opt:hover:not(:disabled){border-color:var(--gold);background:var(--panel-2)}
.tone-opt small{color:var(--dimmer);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.tone-opt.right{border-color:var(--jade);background:rgba(111,191,160,.1)}
.tone-opt.wrong{border-color:var(--cinnabar);background:rgba(200,69,47,.1)}
.tone-opt.fade{opacity:.4}

.verdict{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.vtag{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.vtag.ok{color:var(--jade)}
.vtag.no{color:var(--cinnabar)}
.vtag.near{color:var(--gold)}
.vrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px}
.vrow .w{font-size:27px;font-weight:800;letter-spacing:-.02em}
.vrow .g{font-family:var(--en);font-style:italic;color:var(--dim);font-size:17px;font-weight:300}
.next-row{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.hint{font-size:10.5px;color:var(--dimmer);letter-spacing:.04em;line-height:1.6}

.foot{margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:3px;background:rgba(239,231,214,.1);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
.count{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.combo{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.1em}

.list-head{display:flex;gap:10px;align-items:center;margin:16px 0 4px;flex-wrap:wrap}
input.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:10px 12px;color:var(--eggshell);font-family:var(--vi);font-size:14px;outline:none}
input.search:focus{border-color:var(--gold)}
.row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid rgba(200,161,90,.1)}
.row .pill{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--dimmer)}
.row .vi{font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:130px}
.row .en{font-family:var(--en);font-style:italic;color:var(--dim);font-size:15px;font-weight:300;flex:1}
.row .mini{background:none;border:0;color:var(--gold);cursor:pointer;font-size:14px;padding:5px 7px;border-radius:3px}
.row .mini:hover{background:rgba(200,161,90,.12)}
.row .bx{font-size:9px;letter-spacing:.1em;color:var(--dimmer);text-transform:uppercase}
.group-h{margin:22px 0 2px;display:flex;align-items:baseline;gap:10px}

.scrim{position:fixed;inset:0;background:rgba(8,15,13,.72);display:none;z-index:40;
  align-items:flex-end;justify-content:center;padding:0}
.scrim.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;
  width:100%;max-width:560px;padding:22px 20px 34px;max-height:88vh;overflow:auto}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:6px;border-bottom:1px solid var(--line)}}
.field{margin-top:18px}
.field label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:7px}
select,input[type=range]{width:100%}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px;
  color:var(--eggshell);font-family:var(--vi);font-size:14px;outline:none}
select:focus{border-color:var(--gold)}
input[type=range]{accent-color:var(--gold)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--dim);font-family:var(--vi);font-size:12px;
  font-weight:600;padding:10px 6px;cursor:pointer;transition:.15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(200,161,90,.16);color:var(--gold)}
.warn{border:1px solid rgba(200,69,47,.45);background:rgba(200,69,47,.08);border-radius:3px;
  padding:12px 13px;font-family:var(--en);font-size:14px;line-height:1.5;color:var(--eggshell);margin-top:16px}
.warn a{color:var(--gold)}
.ok-note{border:1px solid rgba(111,191,160,.35);background:rgba(111,191,160,.07);border-radius:3px;
  padding:11px 12px;font-family:var(--en);font-size:14px;line-height:1.5;margin-top:16px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim)}
.legend b{color:var(--eggshell);font-weight:600;font-size:13px}
textarea.box{width:100%;min-height:92px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  padding:10px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;
  outline:none;resize:vertical}
textarea.box:focus{border-color:var(--gold)}

.score{font-size:66px;font-weight:800;letter-spacing:-.045em;line-height:1}
.score small{font-size:20px;font-weight:300;color:var(--dim);letter-spacing:0}
.sum-grid{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.sum-grid div b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sum-grid div span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.empty{font-family:var(--en);font-size:16px;color:var(--dim);line-height:1.6;margin-top:20px;font-style:italic}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Tiếng Việt miền Nam · 22/07 → 16/08</div>
      <h1>Ôn từ vựng <span>— vocabulary drill</span></h1>
    </div>
    <div class="hdr-btns">
      <button class="icon" id="voiceBtn" title="Voice and audio">🔊</button>
      <button class="icon" id="setBtn" title="Settings">⚙</button>
    </div>
  </header>

  <div class="rule"></div>
  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabDrill" aria-selected="true">Drill</button>
    <button role="tab" id="tabList" aria-selected="false">Word list</button>
  </nav>

  <main id="paneDrill">
    <div class="decks" id="decks"></div>
    <div class="deck-actions">
      <button class="link" id="allDecks">Select all</button>
      <button class="link" id="lastTwo">Last two lessons</button>
      <button class="link" id="southOnly">Southern only</button>
      <button class="link" id="resetProg">Reset progress</button>
    </div>
    <div id="stage"></div>
  </main>

  <main id="paneList" hidden>
    <div class="list-head">
      <input class="search" id="search" placeholder="Search Vietnamese or English…" autocomplete="off">
      <button class="icon" id="listSpeakAll">▶ Play deck</button>
    </div>
    <div id="listBody"></div>
  </main>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<script>
/* ══════════════════════════════════════════════════════════════════
   Ôn từ vựng — vocabulary, sentences and grammar notes come from the
   lesson notes of 22/07, 29/07, 09/08 and 16/08. The southern-dialect
   material and the confusable-word pairs are added on top of them.
   ══════════════════════════════════════════════════════════════════ */
const DECKS = [
  {id:"d1",  label:"22 Jul · Verbs"},
  {id:"d2",  label:"22 Jul · Out & about"},
  {id:"d3",  label:"Modals & chưa"},
  {id:"d4",  label:"29 Jul · Body, home, health"},
  {id:"d5",  label:"9 Aug · Bring & wear"},
  {id:"d6",  label:"16 Aug · Chores"},
  {id:"d7",  label:"16 Aug · Frequency"},
  {id:"d8",  label:"16 Aug · Opposites"},
  {id:"d9",  label:"So sánh · Structures"},
  {id:"d10", label:"Miền Nam · Southern words"},
  {id:"d11", label:"Nghe kỹ · Confusable pairs"},
  {id:"d12", label:"Đúng hay sai · Grammar"}
];

const DATA = [
/* ── d1 ──────────────────────────────────────────────────────── */
{vi:"viết",en:"write",d:"d1",exVi:"Em viết tên của em vào đây.",exEn:"Write your name here."},
{vi:"thử",en:"try",d:"d1",exVi:"Em thử món này đi.",exEn:"Try this dish."},
{vi:"hỏi",en:"ask",d:"d1",exVi:"Em hỏi cô giáo một câu đi.",exEn:"Ask the teacher a question."},
{vi:"đọc",en:"read",d:"d1",exVi:"Em đọc quyển sách này đi.",exEn:"Read this book."},
{vi:"cái này",en:"this one",d:"d1",exVi:"Cái này ngon lắm.",exEn:"This one is very delicious."},
{vi:"cái khác",en:"another one",d:"d1",exVi:"Em muốn mua cái khác.",exEn:"I want to buy another one."},
{vi:"nhanh",en:"fast",d:"d1",exVi:"Xe chạy rất nhanh.",exEn:"The car goes very fast.",opp:"chậm"},
{vi:"chậm",en:"slow",d:"d1",exVi:"Nói chậm thôi.",exEn:"Speak slowly.",opp:"nhanh"},
{vi:"ví dụ",en:"example",d:"d1",exVi:"Cô giáo cho một ví dụ.",exEn:"The teacher gives an example."},

const TONE_SETS = {
  huyen:"àằầèềìòồờùừỳ",
  sac:"áắấéếíóốớúứý",
  hoi:"ảẳẩẻểỉỏổởủửỷ",
  nga:"ãẵẫẽễĩõỗỡũữỹ",
  nang:"ạặậẹệịọộợụựỵ"
};
const TONE_INFO = {
  ngang:{name:"ngang", path:"M2,8 L26,8",              dot:null},
  huyen:{name:"huyền", path:"M2,4 L26,13",             dot:null},
  sac:  {name:"sắc",   path:"M2,13 L26,3",             dot:null},
  hoi:  {name:"hỏi",   path:"M2,4 C9,15 18,15 26,6",   dot:null},
  nga:  {name:"ngã",   path:"M2,4 C9,15 18,15 26,6",   dot:[26,1]},
  nang: {name:"nặng",  path:"M2,5 L17,13",             dot:[22,14]}
};
function toneOf(syllable){
  const s = syllable.normalize("NFC").toLowerCase();
  for (const key in TONE_SETS){
    for (const ch of s){ if (TONE_SETS[key].indexOf(ch) > -1) return key; }
  }
  return "ngang";
}
function syllables(word){
  return word.normalize("NFC").replace(/[?!.,…—]/g,"").trim().split(/\s+/).filter(Boolean);
}
function toneSvg(key, stroke){
  const t = TONE_INFO[key];
  return '<svg width="28" height="16" viewBox="0 0 28 16">'
    + '<path d="'+t.path+'" fill="none" stroke="'+(stroke||"var(--gold)")+'" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>'
    + (t.dot ? '<circle cx="'+t.dot[0]+'" cy="'+t.dot[1]+'" r="1.5" fill="'+(stroke||"var(--gold)")+'" opacity=".85"/>' : '')
    + '</svg>';
}
function toneRail(word, showNames){
  const syls = syllables(word);
  if (!syls.length) return "";
  return '<div class="tones">' + syls.map(function(s){
    const k = toneOf(s);
    return '<div class="tone-syl">' + toneSvg(k) + (showNames ? '<em>'+TONE_INFO[k].name+'</em>' : '') + '</div>';
  }).join("") + '</div>';
}

let S = {

let storeMode = "memory";
function probeLocal(){
  try{ localStorage.setItem("vivu:probe","1"); localStorage.removeItem("vivu:probe"); return true; }
  catch(e){ return false; }
}
async function load(){
  if (probeLocal()) storeMode = "local";
  else if (window.storage) storeMode = "claude";
  try{
    let raw = null;
    if (storeMode === "local") raw = localStorage.getItem(KEY);
    else if (storeMode === "claude"){ const r = await window.storage.get(KEY); raw = r && r.value; }
    if (raw) Object.assign(S, JSON.parse(raw));
  }catch(e){ /* first run */ }
  if (typeof S.readSentence !== "boolean") S.readSentence = true;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async function(){
    const raw = JSON.stringify(S);
    try{
      if (storeMode === "local") localStorage.setItem(KEY, raw);
      else if (storeMode === "claude") await window.storage.set(KEY, raw);
    }catch(e){ storeMode = "memory"; }
  }, 350);
}
function storeNote(){
  if (storeMode === "local")  return {cls:"ok-note", txt:"Progress is saved on this phone. Closing the app, or the phone, does not touch it."};
  if (storeMode === "claude") return {cls:"ok-note", txt:"Progress is saved inside this Claude conversation. Install it on your phone to keep it with you."};
  return {cls:"warn", txt:"Progress is not being saved here. If you opened the file straight from Downloads, the browser blocks storage — put it online once and it will stick."};
}
function prog(id){

function bumpStreak(){
  const t = today();
  if (S.streakDay === t) return;
  const y = new Date(Date.now()-DAY).toISOString().slice(0,10);

const TTS = {
  voices:[], ready:false, current:null,
  refresh(){
    if (!("speechSynthesis" in window)) return;
    const all = speechSynthesis.getVoices() || [];
    this.voices = all.filter(v => /^vi/i.test(v.lang) || /vi[\s_-]?vu|rhvoice/i.test(v.name));
    if (S.voice) this.current = this.voices.find(v => v.name === S.voice) || null;
    if (!this.current){
      this.current =
        this.voices.find(v => /vi[\s_-]?vu/i.test(v.name)) ||
        this.voices.find(v => /rhvoice/i.test(v.name)) ||
        this.voices.find(v => /^vi/i.test(v.lang)) || null;
    }
    this.ready = !!this.current;
  },
  utter(text, rate){
    const u = new SpeechSynthesisUtterance(String(text).replace(/[—•]/g," "));
    if (this.current) u.voice = this.current;
    u.lang = (this.current && this.current.lang) || "vi-VN";
    u.rate = rate || S.rate;
    return u;
  },
  say(text, rate, btn){
    if (!("speechSynthesis" in window) || !text) return;
    try{
      speechSynthesis.cancel();
      const u = this.utter(text, rate);
      if (btn){ btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }
      speechSynthesis.speak(u);
    }catch(e){}
  },
  /* word first, then the whole sentence — queued back to back */
  seq(list, rate){
    if (!("speechSynthesis" in window)) return;
    const items = (list||[]).filter(Boolean);
    if (!items.length) return;
    try{
      speechSynthesis.cancel();
      items.forEach(t => speechSynthesis.speak(this.utter(t, rate)));
    }catch(e){}
  }
};
if ("speechSynthesis" in window){
  TTS.refresh();
  speechSynthesis.onvoiceschanged = function(){ TTS.refresh(); renderStats(); };
}
/* what the voice should read for an item: the sentence carries the word */
function fullAudio(it){
  if (!it) return [];
  if (S.readSentence && it.exVi) return [it.vi, it.exVi];
  return [it.vi];
}

/* ══════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.random()*a.length|0]; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function bare(s){
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d")
    .toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function sim(a,b){ const A=bare(a), B=bare(b); return 1 - lev(A,B)/Math.max(A.length,B.length,1); }
function words(){ return DATA.filter(it => S.active.indexOf(it.d) > -1); }
function poolOf(){ return ALL.filter(it => S.active.indexOf(it.d) > -1); }
function hasGap(it){ return it.exVi && bare(it.exVi).indexOf(bare(it.vi)) > -1; }
function toks(s){ return String(s).trim().split(/\s+/).filter(Boolean); }
function findSpan(list, phrase){
  const p = bare(phrase), len = toks(phrase).length;
  for (let i=0; i+len<=list.length; i++){
    if (bare(list.slice(i,i+len).join(" ")) === p) return {at:i, len:len};
  }
  return null;
}
function deckLabel(id){ const d = DECKS.find(x => x.id === id); return d ? d.label : ""; }
function canBuild(it){ if (!it.exVi) return false; const n = toks(it.exVi).length; return n >= 4 && n <= 8; }
function canOdd(it){ return !!(it.cat && CLASS_SIZE[it.cat] >= 3); }

/* distractors — as the box climbs, the wrong answers start to look
   and sound like the right one */
function distractors(item, key, n, hard){
  const others = DATA.filter(x => x.id !== item.id && x[key] && !(item.syn && x.syn === item.syn));
  const seen = {}; seen[item[key]] = 1;
  let ranked;
  if (hard && key === "vi"){
    ranked = others.map(x => ({x:x, s: sim(item.vi, x.vi) + (x.d === item.d ? .12 : 0) + Math.random()*.10}))
                   .sort((p,q) => q.s - p.s).map(o => o.x);
  } else {
    const same = shuffle(others.filter(x => x.d === item.d));
    ranked = same.concat(shuffle(others.filter(x => x.d !== item.d)));
  }
  const out = [];
  ranked.forEach(function(x){
    if (out.length >= n || seen[x[key]]) return;
    seen[x[key]] = 1; out.push(x);
  });
  return out;
}

function renderStats(){
  const pool = poolOf(), now = Date.now();
  const mastered = pool.filter(it => prog(it.id).box >= 4).length;
  const due = pool.filter(it => { const p = prog(it.id); return p.seen > 0 && p.due <= now; }).length;
  const fresh = pool.filter(it => prog(it.id).seen === 0).length;
  $("#stats").innerHTML =
      '<span class="flame">▲ ' + S.streak + '-day streak</span>'
    + '<span><b>' + mastered + '</b> / ' + pool.length + ' mastered</span>'
    + '<span><b>' + due + '</b> due now</span>'
    + '<span><b>' + fresh + '</b> unseen</span>'
    + '<span><b>' + S.xp + '</b> XP</span>'
    + (TTS.ready ? '' : '<span style="color:var(--cinnabar)">no Vietnamese voice</span>');
  $("#voiceBtn").classList.toggle("on", TTS.ready);
}
function renderDecks(){
  $("#decks").innerHTML = DECKS.map(function(d){
    const items = ALL.filter(i => i.d === d.id);
    const done = items.filter(i => prog(i.id).box >= 3).length;
    const pct = items.length ? done/items.length : 0;
    const C = 2*Math.PI*6;
    const on = S.active.indexOf(d.id) > -1;
    return '<button class="chip" data-deck="'+d.id+'" aria-pressed="'+on+'">'
      + '<svg class="ring" width="16" height="16" viewBox="0 0 16 16">'
      + '<circle cx="8" cy="8" r="6" fill="none" stroke="rgba(239,231,214,.18)" stroke-width="2"/>'
      + '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"'
      + ' stroke-dasharray="'+(pct*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 8 8)"/></svg>'
      + esc(d.label) + ' <span class="n">' + items.length + '</span></button>';
  }).join("");
  document.querySelectorAll(".chip").forEach(function(c){
    c.onclick = function(){
      const id = c.dataset.deck, i = S.active.indexOf(id);
      if (i > -1){ if (S.active.length > 1) S.active.splice(i,1); } else S.active.push(id);
      save(); renderDecks(); renderStats(); if (!session) idle(); renderList();
    };
  });
}

/* ══════════════════════════════════════════════════════════════════
   SESSION
   ══════════════════════════════════════════════════════════════════ */
let session = null;
let keyHandler = null;

function buildSession(){
  const pool = poolOf(), now = Date.now();
  const due = [], fresh = [], rest = [];
  pool.forEach(function(it){
    const p = prog(it.id);
    if (p.seen === 0) fresh.push(it);
    else if (p.due <= now) due.push(it);
    else rest.push(it);
  });
  shuffle(due); shuffle(fresh); shuffle(rest);
  const out = [];
  const newCap = Math.min(fresh.length, Math.max(3, Math.round(S.len/3)));
  for (let i=0;i<newCap;i++) out.push(fresh[i]);
  for (let i=0;i<due.length && out.length<S.len;i++) out.push(due[i]);
  for (let i=0;i<rest.length && out.length<S.len;i++) out.push(rest[i]);
  shuffle(out);
  session = {queue: out.map(it => ({it:it, retry:false})), i:0, total:out.length,
             right:0, wrong:0, combo:0, best:0, learned:[], missed:[]};
  step();
}
function pickType(it, retry){
  const p = prog(it.id);
  if (it.kind === "pair") return (it.pair.merged || !TTS.ready) ? "pair_eye" : "pair_ear";
  if (it.kind === "judge") return "judge";
  if (p.seen === 0) return "intro";
  if (retry) return "mc_vi_en";

  const t = [];
  if (p.box <= 1) t.push("mc_vi_en");
  if (p.box >= 1){ t.push("mc_en_vi"); if (it.north) t.push("south","south"); }
  if (p.box >= 1 && TTS.ready && syllables(it.vi).length === 1) t.push("tone");
  if (p.box >= 1 && it.opp) t.push("opp");
  if (p.box >= 2 && TTS.ready) t.push("listen");
  if (p.box >= 2 && hasGap(it)) t.push("gap","gap");
  if (p.box >= 2 && canOdd(it)) t.push("odd");
  if (p.box >= 3 && hasGap(it)) t.push("place","place");
  if (p.box >= 3 && TTS.ready && it.exVi) t.push("listen_sent");
  if (p.box >= 3 && canBuild(it)) t.push("build");
  if (p.box >= 3) t.push("type");
  if (p.box >= 4){ t.push("type"); if (canBuild(it)) t.push("build"); }
  return t.length ? pick(t) : "mc_vi_en";
}
function step(){
  if (!session) return;
  if (session.i >= session.queue.length) return summary();
  const entry = session.queue[session.i];
  render(entry.it, pickType(entry.it, entry.retry));
}

/* ── card scaffolding ─────────────────────────────────────────── */
function shell(inner){
  $("#stage").innerHTML = '<div class="card" id="card">'+inner+'</div>'+footer();
}
function footer(){
  const pct = session ? (session.i / session.total)*100 : 0;
  return '<div class="foot"><div class="bar"><i style="width:'+pct+'%"></i></div>'
    + '<span class="count">'+session.i+' / '+session.total+'</span>'
    + (session.combo >= 3 ? '<span class="combo">COMBO ×'+Math.min(3,Math.floor(session.combo/3)+1)+'</span>' : '')
    + '</div>';
}
function label(text, why){
  return '<div class="eyebrow q-label"><span>'+esc(text)+'</span>'
       + (why ? '<span class="why">'+esc(why)+'</span>' : '') + '</div>';
}
function speakRow(word, sentence){
  let h = '<div class="audio"><button class="speak" data-say="'+esc(word)+'">▶ Nghe từ <kbd>Space</kbd></button>';
  if (sentence) h += '<button class="speak" data-say="'+esc(sentence)+'">▶ Nghe câu</button>';
  h += '<button class="speak" data-say="'+esc(sentence||word)+'" data-slow="1">▶ Chậm <kbd>S</kbd></button></div>';
  return h;
}
function wireSpeak(){
  document.querySelectorAll("[data-say]").forEach(function(b){
    b.onclick = function(){ TTS.say(b.dataset.say, b.dataset.slow ? 0.55 : S.rate, b); };
  });
}
/* generic multiple choice: list of {html, plain}, index of the right one */
function choicesHTML(list, twoCol, tall){
  return '<div class="opts'+(twoCol?" two":"")+'">' + list.map(function(o,i){
    return '<button class="opt'+(tall?" tall":"")+'" data-i="'+i+'"><span class="k">'+(i+1)+'</span>'
      + '<span>'+o.html+'</span></button>';
  }).join("") + '</div>';
}
function wireChoices(list, correctIdx, after, sayOnPick){
  const btns = Array.prototype.slice.call(document.querySelectorAll(".opt"));
  function choose(i){
    if (!btns.length || btns[0].disabled) return;
    btns.forEach(function(b,j){
      b.disabled = true;
      if (j === correctIdx) b.classList.add("right");
      else if (j === i) b.classList.add("wrong");
      else b.classList.add("fade");
    });
    const ok = i === correctIdx;
    if (sayOnPick) autoSay(sayOnPick);
    setTimeout(function(){ after(ok); }, ok ? 520 : 900);
  }
  btns.forEach(function(b,i){ b.onclick = function(){ choose(i); }; });
  keyHandler = function(e){
    const n = parseInt(e.key,10);
    if (n >= 1 && n <= btns.length) choose(n-1);
    if (e.key === " " && sayOnPick){ e.preventDefault(); TTS.seq(sayOnPick); }
  };
}

/* ══════════════════════════════════════════════════════════════════
   THE EXERCISES
   ══════════════════════════════════════════════════════════════════ */
function render(it, type){
  const p = prog(it.id);
  const hard = p.box >= 2;

  /* ── meet a new word ──────────────────────────────────────── */
  if (type === "intro"){
    if (it.kind === "pair"){
      const pr = it.pair;
      shell(label("Two words to keep apart", "confusable pair")
        + '<div class="vrow"><span class="w">'+esc(pr.a)+'</span><span class="g">'+esc(pr.aEn)+'</span></div>'
        + toneRail(pr.a, true)
        + '<div class="vrow" style="margin-top:14px"><span class="w">'+esc(pr.b)+'</span><span class="g">'+esc(pr.bEn)+'</span></div>'
        + toneRail(pr.b, true)
        + '<div class="note'+(pr.merged?' south-note':'')+'">'
        + (pr.merged ? '<b>Same sound in the south.</b> ' : '<b>Listen for it.</b> ')
        + esc(pr.why) + '</div>'
        + '<div class="audio"><button class="speak" data-say="'+esc(pr.a)+'">▶ '+esc(pr.a)+'</button>'
        + '<button class="speak" data-say="'+esc(pr.b)+'">▶ '+esc(pr.b)+'</button></div>'
        + '<div class="next-row"><button class="btn" id="go">Got it</button><span class="hint">Enter</span></div>');
      wireSpeak();
      autoSay([pr.a, pr.b]);
      $("#go").onclick = function(){ grade(it, true, null, true); };
      keyHandler = e => { if (e.key === "Enter") grade(it, true, null, true); };
      return;
    }
    if (it.kind === "judge"){
      const j = it.judge;
      shell(label(j.south ? "How the south says it" : "A rule worth having", "grammar")
        + '<div class="sent">'+esc(j.good)+'</div>'
        + '<div class="note'+(j.south?' south-note':'')+'">'+esc(j.why)+'</div>'
        + '<div class="audio"><button class="speak" data-say="'+esc(j.good)+'">▶ Nghe câu</button></div>'
        + '<div class="next-row"><button class="btn" id="go">Got it</button><span class="hint">Enter</span></div>');
      wireSpeak(); autoSay([j.good]);
      $("#go").onclick = function(){ grade(it, true, null, true); };
      keyHandler = e => { if (e.key === "Enter") grade(it, true, null, true); };
      return;
    }
    shell(label("New word · " + deckLabel(it.d))
      + toneRail(it.vi, true)
      + '<h2 class="word'+(it.vi.length>14?" sm":"")+'">'+esc(it.vi)+'</h2>'
      + '<div class="gloss">'+esc(it.en)+'</div>'
      + (it.north ? '<div class="note south-note">Northern Vietnamese: <b>'+esc(it.north)+'</b></div>' : '')
      + (it.exVi ? '<div class="note">'+esc(it.exVi)+'<br><span style="opacity:.7">'+esc(it.exEn||"")+'</span></div>' : '')
      + (it.note ? '<div class="note">'+esc(it.note)+'</div>' : '')
      + speakRow(it.vi, it.exVi)
      + '<div class="next-row"><button class="btn" id="go">Got it</button><span class="hint">Enter to continue</span></div>');
    wireSpeak();
    autoSay(fullAudio(it));
    $("#go").onclick = function(){ grade(it, true, null, true); };
    keyHandler = function(e){
      if (e.key === "Enter"){ e.preventDefault(); grade(it,true,null,true); }
      if (e.key === " "){ e.preventDefault(); TTS.seq(fullAudio(it)); }
      if (e.key.toLowerCase() === "s") TTS.say(it.exVi||it.vi, 0.55);
    };
    return;
  }

  /* ── word → meaning, and its listening twin ───────────────── */
  if (type === "mc_vi_en" || type === "listen"){
    const listen = type === "listen";
    const opts = shuffle(distractors(it,"en",3,false).concat([it]));
    const idx = opts.indexOf(it);
    shell(label(listen ? "Listen — what does it mean?" : "What does it mean?", listen ? "listening" : "recognition")
      + (listen
          ? '<button class="speak big-play" data-say="'+esc(it.vi)+'">▶ Nghe lại</button>'
          : toneRail(it.vi,false) + '<h2 class="word'+(it.vi.length>14?" sm":"")+'">'+esc(it.vi)+'</h2>' + speakRow(it.vi, it.exVi))
      + choicesHTML(opts.map(o => ({html:'<span class="en">'+esc(o.en)+'</span>'})), false));
    wireSpeak();
    if (listen) setTimeout(() => TTS.say(it.vi), 200); else autoSay([it.vi]);
    wireChoices(opts, idx, ok => grade(it, ok), fullAudio(it));
    return;
  }

  /* ── meaning → word, and the opposite drill ───────────────── */
  if (type === "mc_en_vi" || type === "opp"){
    const isOpp = type === "opp";
    const target = isOpp ? BY_ID[it.opp] : it;
    if (isOpp && !target) return render(it, "mc_en_vi");
    const opts = shuffle(distractors(target,"vi",3,hard).concat([target]));
    const idx = opts.indexOf(target);
    shell(label(isOpp ? "Opposite — trái nghĩa" : "Say it in Vietnamese", isOpp ? "word pairs" : "recall")
      + '<div class="prompt-en">'
      + (isOpp ? esc(it.vi)+' <span style="color:var(--dim);font-family:var(--en);font-style:italic">('+esc(it.en)+')</span> ↔ ?'
               : esc(it.en))
      + '</div>'
      + choicesHTML(opts.map(o => ({html:esc(o.vi)})), true));
    wireChoices(opts, idx, ok => grade(it, ok, null, false, target), fullAudio(target));
    return;
  }

  /* ── southern equivalent ──────────────────────────────────── */
  if (type === "south"){
    const opts = shuffle(distractors(it,"vi",3,hard).concat([it]));
    const idx = opts.indexOf(it);
    shell(label("Miền Bắc → miền Nam", "dialect")
      + '<div class="prompt-en">A northerner says <b style="font-family:var(--vi);font-weight:700">'+esc(it.north)+'</b>'
      + ' <span style="color:var(--dim);font-style:italic">— '+esc(it.en)+'</span></div>'
      + '<div class="hint" style="margin-top:8px">What comes out of a southern mouth?</div>'
      + choicesHTML(opts.map(o => ({html:esc(o.vi)})), true));
    wireChoices(opts, idx, ok => grade(it, ok), fullAudio(it));
    return;
  }

  /* ── confusable pair, by ear ──────────────────────────────── */
  if (type === "pair_ear"){
    const pr = it.pair;
    const first = Math.random() < .5;
    const said = first ? pr.a : pr.b;
    const opts = [{vi:pr.a, en:pr.aEn},{vi:pr.b, en:pr.bEn}];
    const idx = first ? 0 : 1;
    shell(label("Which one did you hear?", "ear training")
      + '<button class="speak big-play" data-say="'+esc(said)+'">▶ Nghe lại</button>'
      + choicesHTML(opts.map(o => ({html:'<span>'+esc(o.vi)+'</span> <span class="en" style="margin-left:8px">'+esc(o.en)+'</span>'})), true));
    wireSpeak();
    setTimeout(() => TTS.say(said), 200);
    wireChoices(opts, idx, function(ok){ grade(it, ok, null, false, null, said); }, [said]);
    return;
  }

  /* ── confusable pair the south merges — meaning is the only clue ── */
  if (type === "pair_eye"){
    const pr = it.pair;
    const first = Math.random() < .5;
    const wanted = first ? {vi:pr.a, en:pr.aEn} : {vi:pr.b, en:pr.bEn};
    const opts = [{vi:pr.a},{vi:pr.b}];
    const idx = first ? 0 : 1;
    shell(label(pr.merged ? "Same sound — which spelling?" : "Which spelling?", "meaning over sound")
      + '<div class="prompt-en">'+esc(wanted.en)+'</div>'
      + (pr.merged ? '<div class="note south-note">'+esc(pr.why)+' Your ear cannot help you here — the meaning has to.</div>' : '')
      + choicesHTML(opts.map(o => ({html:esc(o.vi)+' '+toneSvg(toneOf(o.vi))})), true));
    wireChoices(opts, idx, function(ok){ grade(it, ok, null, false, null, wanted.vi); }, [wanted.vi]);
    return;
  }

  /* ── which tone was that ──────────────────────────────────── */
  if (type === "tone"){
    const real = toneOf(it.vi);
    const keys = ["ngang","huyen","sac","hoi","nang"];         /* hỏi and ngã share a button */
    const labelFor = k => k === "hoi" ? "hỏi / ngã" : TONE_INFO[k].name;
    const answer = (real === "nga") ? "hoi" : real;
    const idx = keys.indexOf(answer);
    shell(label("Which tone did you hear?", "tones")
      + '<button class="speak big-play" data-say="'+esc(it.vi)+'">▶ Nghe lại</button>'
      + '<div class="tone-opts">' + keys.map(function(k,i){
          return '<button class="opt tone-opt" data-i="'+i+'">'+toneSvg(k)+'<span>'+esc(labelFor(k))+'</span>'
               + '<small>'+(i+1)+'</small></button>';
        }).join("") + '</div>'
      + '<div class="hint" style="margin-top:12px">In the south hỏi and ngã are one and the same tone, so they share a button.</div>');
    wireSpeak();
    setTimeout(() => TTS.say(it.vi), 200);
    wireChoices(keys, idx, ok => grade(it, ok), fullAudio(it));
    return;
  }

  /* ── fill the gap in a lesson sentence ────────────────────── */
  if (type === "gap"){
    const list = toks(it.exVi), span = findSpan(list, it.vi);
    if (!span) return render(it, "mc_en_vi");
    const shown = list.slice(0,span.at).join(" ") + ' <span class="blank"></span> ' + list.slice(span.at+span.len).join(" ");
    const opts = shuffle(distractors(it,"vi",3,hard).concat([it]));
    const idx = opts.indexOf(it);
    shell(label("Fill the gap", "the word inside a sentence")
      + '<div class="sent">'+shown+'</div>'
      + '<div class="sent-en">'+esc(it.exEn||"")+'</div>'
      + choicesHTML(opts.map(o => ({html:esc(o.vi)})), true));
    wireChoices(opts, idx, ok => grade(it, ok), [it.exVi]);
    return;
  }

  /* ── where does the word go ───────────────────────────────── */
  if (type === "place"){
    const list = toks(it.exVi), span = findSpan(list, it.vi);
    if (!span) return render(it, "gap");
    const rest = list.slice(0,span.at).concat(list.slice(span.at+span.len));
    let row = '<div class="tokens">';
    for (let i=0;i<=rest.length;i++){
      row += '<button class="slot" data-i="'+i+'">▾</button>';
      if (i < rest.length) row += '<span class="tok">'+esc(rest[i])+'</span>';
    }
    row += '</div>';
    shell(label("Where does it go?", "word order")
      + '<h2 class="word sm">'+esc(it.vi)+'</h2>'
      + '<div class="gloss" style="font-size:16px">'+esc(it.en)+'</div>'
      + row
      + '<div class="sent-en" style="margin-top:14px">'+esc(it.exEn||"")+'</div>');
    const slots = Array.prototype.slice.call(document.querySelectorAll(".slot"));
    slots.forEach(function(b,i){
      b.onclick = function(){
        if (b.disabled) return;
        slots.forEach(function(x,j){
          x.disabled = true;
          if (j === span.at) x.classList.add("right");
          else if (j === i) x.classList.add("wrong");
        });
        if (i === span.at) slots[i].textContent = it.vi;
        autoSay([it.exVi]);
        setTimeout(() => grade(it, i === span.at), i === span.at ? 620 : 950);
      };
    });
    keyHandler = null;
    return;
  }

  /* ── rebuild the sentence ─────────────────────────────────── */
  if (type === "build"){
    if (!canBuild(it)) return render(it, hasGap(it) ? "place" : "mc_en_vi");
    const list = toks(it.exVi);
    let bank = shuffle(list.slice());
    if (bank.join(" ") === list.join(" ")) bank = shuffle(bank);
    shell(label("Put the sentence back together", "word order")
      + '<div class="prompt-en" style="font-size:19px">'+esc(it.exEn||it.en)+'</div>'
      + '<div class="answer-line" id="ans"></div>'
      + '<div class="bank" id="bank">' + bank.map(function(t,i){
          return '<button class="tile" data-i="'+i+'">'+esc(t)+'</button>';
        }).join("") + '</div>'
      + '<div class="next-row"><button class="btn ghost" id="undo">Undo</button>'
      + '<span class="hint">Tap the words in order</span></div>');
    const chosen = [];
    const ans = $("#ans"), tiles = Array.prototype.slice.call(document.querySelectorAll(".tile"));
    function paint(){
      ans.innerHTML = chosen.map(c => '<span class="tok">'+esc(bank[c])+'</span>').join("");
      tiles.forEach((t,i) => t.classList.toggle("used", chosen.indexOf(i) > -1));
    }
    function finish(){
      const said = chosen.map(c => bank[c]).join(" ");
      const ok = bare(said) === bare(it.exVi);
      tiles.forEach(t => t.disabled = true);
      ans.innerHTML = chosen.map(c => '<span class="tok" style="border-color:'+(ok?"var(--jade)":"var(--cinnabar)")+'">'+esc(bank[c])+'</span>').join("");
      autoSay([it.exVi]);
      setTimeout(() => grade(it, ok), ok ? 640 : 1000);
    }
    tiles.forEach(function(t,i){
      t.onclick = function(){
        if (t.disabled || chosen.indexOf(i) > -1) return;
        chosen.push(i); paint();
        if (chosen.length === bank.length) finish();
      };
    });
    $("#undo").onclick = function(){ chosen.pop(); paint(); };
    keyHandler = null;
    return;
  }

  /* ── hear the whole sentence, pick the meaning ────────────── */
  if (type === "listen_sent"){
    let pool = words().filter(x => x.exEn && x.id !== it.id);
    if (pool.length < 3) pool = DATA.filter(x => x.exEn && x.id !== it.id);
    if (!it.exVi || pool.length < 3) return render(it, "listen");
    const opts = shuffle(shuffle(pool).slice(0,3).concat([it]));
    const idx = opts.indexOf(it);
    shell(label("Listen to the whole sentence", "comprehension")
      + '<button class="speak big-play" data-say="'+esc(it.exVi)+'">▶ Nghe lại</button>'
      + choicesHTML(opts.map(o => ({html:'<span class="en">'+esc(o.exEn)+'</span>'})), false, true));
    wireSpeak();
    setTimeout(() => TTS.say(it.exVi), 250);
    wireChoices(opts, idx, ok => grade(it, ok), [it.exVi]);
    return;
  }

  /* ── odd one out ──────────────────────────────────────────── */
  if (type === "odd"){
    const cat = it.cat;
    const family = shuffle(DATA.filter(x => x.cat === cat && x.id !== it.id)).slice(0,2);
    const strangers = DATA.filter(x => x.cat && x.cat !== cat);
    const stranger = strangers.length ? pick(strangers) : null;
    if (family.length < 2 || !stranger) return render(it, "mc_vi_en");
    const opts = shuffle([it].concat(family, [stranger]));
    const idx = opts.indexOf(stranger);
    shell(label("Which one is the odd one out?", "categories")
      + '<div class="prompt-en" style="font-size:20px">Three of these are '+esc(cat)+'. One is not.</div>'
      + choicesHTML(opts.map(o => ({html:esc(o.vi)})), true));
    wireChoices(opts, idx, ok => grade(it, ok), [stranger.vi]);
    return;
  }

  /* ── which sentence is right ──────────────────────────────── */
  if (type === "judge"){
    const j = it.judge;
    const wrongs = shuffle(j.bad.slice()).slice(0, j.bad.length > 1 && Math.random() < .6 ? 2 : 1);
    const opts = shuffle([j.good].concat(wrongs));
    const idx = opts.indexOf(j.good);
    shell(label(j.south ? "Which one sounds southern?" : "Which sentence is right?", "grammar")
      + choicesHTML(opts.map(o => ({html:'<span style="font-size:17px;line-height:1.45">'+esc(o)+'</span>'})), false, true));
    wireChoices(opts, idx, function(ok){ grade(it, ok, null, false, null, j.good); }, [j.good]);
    return;
  }

  /* ── write it out ─────────────────────────────────────────── */
  shell(label("Write it in Vietnamese", "production")
    + '<div class="prompt-en">'+esc(it.en)+'</div>'
    + (it.exEn ? '<div class="sent-en">Context: '+esc(it.exEn)+'</div>' : '')
    + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" '
    + 'autocorrect="off" spellcheck="false" placeholder="type here — tones count"><button class="btn" id="tgo">Check</button></div>'
    + '<div class="hint" style="margin-top:9px">No Vietnamese keyboard? Type it plain — you get half credit and see the tones.</div>');
  const input = $("#tin"); input.focus();
  function submit(){
    const v = input.value.trim();
    if (!v) return;
    const exact = v.normalize("NFC").toLowerCase() === it.vi.normalize("NFC").toLowerCase();
    const near  = !exact && bare(v) === bare(it.vi);
    grade(it, exact, near ? "near" : (exact ? null : "typed"));
  }
  $("#tgo").onclick = submit;
  input.onkeydown = function(e){ if (e.key === "Enter") submit(); };
  keyHandler = null;
}

/* ══════════════════════════════════════════════════════════════════
   GRADING
   ══════════════════════════════════════════════════════════════════ */
function grade(it, ok, flag, silent, shown, saidWord){
  const p = prog(it.id);
  const near = flag === "near";

  if (silent){                       /* first meeting — shown, not tested */
    p.seen++; p.box = 1; p.due = Date.now() + INTERVAL[1];
    session.learned.push(it);
    bumpStreak(); save();
    session.i++; renderStats(); renderDecks();
    return step();
  }

  p.seen++;
  if (ok || near){
    p.right++;
    if (ok) p.box = Math.min(4, p.box+1);
    if (ok){ session.right++; session.combo++; session.best = Math.max(session.best, session.combo); }
    S.xp += ok ? 10*Math.min(3, Math.floor(session.combo/3)+1) : 4;
  } else {
    p.wrong++; p.box = 0; session.wrong++; session.combo = 0;
    if (session.missed.indexOf(it) < 0) session.missed.push(it);
    const at = Math.min(session.queue.length, session.i + 3 + (Math.random()*2|0));
    session.queue.splice(at, 0, {it:it, retry:true});
    session.total = session.queue.length;
  }
  p.due = Date.now() + INTERVAL[p.box];
  bumpStreak(); save();
  verdict(it, ok, near, shown, saidWord);
}

function verdict(it, ok, near, shown, saidWord){
  const card = $("#card");
  if (card) card.classList.add(ok ? "sweep" : "shake");

  let body;
  if (it.kind === "pair"){
    const pr = it.pair;
    const hit = saidWord || pr.a;
    const other = hit === pr.a ? pr.b : pr.a;
    const hitEn = hit === pr.a ? pr.aEn : pr.bEn;
    const otherEn = hit === pr.a ? pr.bEn : pr.aEn;
    body = toneRail(hit, true)
      + '<div class="vrow"><span class="w">'+esc(hit)+'</span><span class="g">'+esc(hitEn)+'</span></div>'
      + '<div class="note'+(pr.merged?' south-note':'')+'">Not <b>'+esc(other)+'</b> — '+esc(otherEn)+'. '+esc(pr.why)+'</div>'
      + '<div class="audio"><button class="speak" data-say="'+esc(hit)+'">▶ '+esc(hit)+'</button>'
      + '<button class="speak" data-say="'+esc(other)+'">▶ '+esc(other)+'</button>'
      + '<button class="speak" data-say="'+esc(hit)+'" data-slow="1">▶ Chậm</button></div>';
    autoSay([hit, other]);
  } else if (it.kind === "judge"){
    const j = it.judge;
    body = '<div class="sent">'+esc(j.good)+'</div>'
      + '<div class="note'+(j.south?' south-note':'')+'">'+esc(j.why)+'</div>'
      + '<div class="audio"><button class="speak" data-say="'+esc(j.good)+'">▶ Nghe câu</button>'
      + '<button class="speak" data-say="'+esc(j.good)+'" data-slow="1">▶ Chậm</button></div>';
    autoSay([j.good]);
  } else {
    const target = shown || it;
    body = toneRail(target.vi, true)
      + '<div class="vrow"><span class="w">'+esc(target.vi)+'</span><span class="g">'+esc(target.en)+'</span></div>'
      + (target.north ? '<div class="note south-note">Northern Vietnamese: <b>'+esc(target.north)+'</b></div>' : '')
      + (target.exVi ? '<div class="note">'+esc(target.exVi)+'<br><span style="opacity:.7">'+esc(target.exEn||"")+'</span></div>' : '')
      + (target.note ? '<div class="note">'+esc(target.note)+'</div>' : '')
      + '<div class="audio">'
      + (target.exVi ? '<button class="speak" data-say="'+esc(target.exVi)+'">▶ Nghe câu</button>' : '')
      + '<button class="speak" data-say="'+esc(target.vi)+'">▶ Nghe từ</button>'
      + '<button class="speak" data-say="'+esc(target.exVi||target.vi)+'" data-slow="1">▶ Chậm</button></div>';
    autoSay(fullAudio(target));
  }

  const tag = ok   ? '<span class="vtag ok">Đúng rồi</span>'
            : near ? '<span class="vtag near">Right word — check the tones</span>'
                   : '<span class="vtag no">Chưa đúng — you\'ll see it again</span>';
  const holder = document.createElement("div");
  holder.innerHTML = '<div class="verdict">' + tag + body
    + '<div class="next-row"><button class="btn" id="next">Tiếp</button><span class="hint">Enter</span></div></div>';
  card.appendChild(holder.firstChild);
  wireSpeak();
  card.scrollIntoView({behavior:"smooth", block:"nearest"});
  function go(){ session.i++; renderStats(); renderDecks(); step(); }
  $("#next").onclick = go;
  keyHandler = function(e){ if (e.key === "Enter"){ e.preventDefault(); go(); } };
}

/* ══════════════════════════════════════════════════════════════════
   SUMMARY + IDLE
   ══════════════════════════════════════════════════════════════════ */
function summary(){
  const total = session.right + session.wrong;
  const pct = total ? Math.round(session.right/total*100) : 0;
  let html = '<div class="card">' + label("Xong rồi — session complete")
    + '<div class="score">'+pct+'<small>% correct</small></div>'
    + '<div class="sum-grid">'
    + '<div><b>'+session.right+'</b><span>right</span></div>'
    + '<div><b>'+session.wrong+'</b><span>missed</span></div>'
    + '<div><b>×'+Math.min(3,Math.floor(session.best/3)+1)+'</b><span>best combo</span></div>'
    + '<div><b>'+session.learned.length+'</b><span>new</span></div></div>';
  if (session.missed.length){
    html += '<div class="group-h" style="margin-top:26px"><span class="eyebrow">Review these</span></div>';
    session.missed.forEach(function(it){
      html += '<div class="row"><span class="pill" style="background:var(--cinnabar)"></span>'
        + '<span class="vi">'+esc(it.vi)+'</span><span class="en">'+esc(it.en)+'</span>'
        + '<button class="mini" data-say="'+esc(it.exVi||it.vi)+'">▶</button></div>';
    });
  }
  html += '<div class="next-row" style="margin-top:24px"><button class="btn" id="again">Another round</button>'
       + '<button class="btn ghost" id="stop">Done for now</button></div></div>';
  $("#stage").innerHTML = html;
  wireSpeak();
  $("#again").onclick = buildSession;
  $("#stop").onclick = function(){ session = null; idle(); };
  keyHandler = function(e){ if (e.key === "Enter") buildSession(); };
  renderStats(); renderDecks();
}
function idle(){
  const pool = poolOf(), now = Date.now();
  const due = pool.filter(it => { const p = prog(it.id); return p.seen>0 && p.due<=now; }).length;
  const fresh = pool.filter(it => prog(it.id).seen === 0).length;
  $("#stage").innerHTML = '<div class="card">'
    + label(pool.length + " cards selected")
    + '<div class="prompt-en">'
    + (due+fresh ? (due ? due+' due for review' : '') + (due&&fresh ? ' · ' : '') + (fresh ? fresh+' still unseen' : '')
                 : 'Nothing due right now — a round of free review still counts.')
    + '</div>'
    + '<div class="next-row" style="margin-top:22px"><button class="btn" id="start">Bắt đầu · Start</button>'
    + '<span class="hint">'+S.len+' cards · keys 1–5 to answer, Space to hear it again</span></div></div>';
  $("#start").onclick = buildSession;
  keyHandler = function(e){ if (e.key === "Enter") buildSession(); };
}

/* ══════════════════════════════════════════════════════════════════
   WORD LIST
   ══════════════════════════════════════════════════════════════════ */
function renderList(){
  const q = bare($("#search") ? $("#search").value : "");
  let html = "";
  DECKS.forEach(function(d){
    if (S.active.indexOf(d.id) < 0) return;
    const items = ALL.filter(function(i){
      return i.d === d.id && (!q || bare(i.vi).indexOf(q) > -1 || bare(i.en).indexOf(q) > -1);
    });
    if (!items.length) return;
    html += '<div class="group-h"><span class="eyebrow">'+esc(d.label)+'</span><span class="hint">'+items.length+'</span></div>';
    items.forEach(function(it){
      const b = prog(it.id).box;
      const col = b>=4 ? "var(--jade)" : b>=2 ? "var(--gold)" : b>=1 ? "rgba(200,161,90,.45)" : "var(--dimmer)";
      html += '<div class="row"><span class="pill" style="background:'+col+'"></span>'
        + '<span class="vi">'+esc(it.vi)+'</span>'
        + '<span class="en">'+esc(it.en)+(it.north?' <span style="opacity:.6">· north: '+esc(it.north)+'</span>':'')+'</span>'
        + '<span class="bx">'+(b>=4?"mastered":"box "+b)+'</span>'
        + '<button class="mini" data-say="'+esc(it.exVi||it.vi)+'">▶</button></div>';
    });
  });
  $("#listBody").innerHTML = html || '<div class="empty">Nothing matches. Try the Vietnamese without tones — the search ignores diacritics.</div>';
  wireSpeak();
}

/* ══════════════════════════════════════════════════════════════════
   SHEETS
   ══════════════════════════════════════════════════════════════════ */
function openSheet(html){ $("#sheet").innerHTML = html; $("#scrim").classList.add("open"); }
function closeSheet(){ $("#scrim").classList.remove("open"); }

function voiceSheet(){
  TTS.refresh();
  let html = '<div class="eyebrow">Audio</div>'
    + '<h2 style="font-size:20px;font-weight:800;margin:4px 0 0">Giọng đọc · voice</h2>';
  if (!("speechSynthesis" in window)){
    html += '<div class="warn">This browser has no speech engine, so audio is off. Everything else works.</div>';
  } else if (!TTS.voices.length){
    html += '<div class="warn"><b>No Vietnamese voice found on this device.</b><br>'
      + 'Install <b>Vi Vu</b>, the southern Vietnamese RHVoice voice, and the browser will pick it up here.<br><br>'
      + '<b>Android:</b> install the RHVoice app, open it, choose Tiếng Việt, install “Vi Vu”, then set RHVoice as the '
      + 'system speech engine under Settings → Accessibility → Text-to-speech output.<br>'
      + '<b>Windows:</b> run the SAPI-5 installer, then reload this page.<br><br>'
      + '<a href="https://louderpages.org/vi-vu" target="_blank" rel="noopener">louderpages.org/vi-vu →</a></div>';
  } else {
    html += '<div class="field"><label>Voice</label><select id="vsel">'
      + TTS.voices.map(v => '<option value="'+esc(v.name)+'"'+(TTS.current && v.name === TTS.current.name ? " selected" : "")+'>'
          + esc(v.name)+' — '+esc(v.lang)+'</option>').join("")
      + '</select></div>'
      + '<div class="field"><label>Speed · '+S.rate.toFixed(2)+'×</label>'
      + '<input type="range" id="vrate" min="0.5" max="1.2" step="0.05" value="'+S.rate+'"></div>'
      + '<div class="field"><label>Play automatically</label><div class="seg">'
      + '<button id="apOn" aria-pressed="'+(S.autoplay?"true":"false")+'">On</button>'
      + '<button id="apOff" aria-pressed="'+(!S.autoplay?"true":"false")+'">Off</button></div></div>'
      + '<div class="field"><label>Read the whole sentence, not just the word</label><div class="seg">'
      + '<button id="rsOn" aria-pressed="'+(S.readSentence?"true":"false")+'">On</button>'
      + '<button id="rsOff" aria-pressed="'+(!S.readSentence?"true":"false")+'">Off</button></div>'
      + '<div class="hint" style="margin-top:8px">On: whenever a word carries an example sentence, you hear the word and then the sentence around it.</div></div>'
      + '<div class="next-row"><button class="btn ghost" id="vtest">▶ Test: Trời mưa, nhớ mang dù nha.</button></div>';
    const nm = (TTS.current && TTS.current.name) || "";
    if (/vi[\s_-]?vu/i.test(nm)){
      html += '<div class="ok-note">Vi Vu is doing the talking — the southern accent you are learning.</div>';
    } else if (/rhvoice/i.test(nm)){
      html += '<div class="ok-note">RHVoice is doing the talking. If Vi Vu is what you picked inside the RHVoice app, this is it.</div>';
    } else {
      html += '<div class="warn">This voice does not name its engine. On Android that is normal — Chrome just says '
        + '“Vietnamese”, and whatever you set as the system speech engine is what you hear. If you installed RHVoice and '
        + 'chose Vi Vu, set RHVoice as the system engine under Settings → Accessibility → Text-to-speech output. Otherwise '
        + 'this is the built-in voice, usually northern. '
        + '<a href="https://louderpages.org/vi-vu" target="_blank" rel="noopener">louderpages.org/vi-vu →</a></div>';
    }
  }
  html += '<div class="field" style="margin-top:26px"><label>Tone marks</label><div class="legend">'
    + ["ngang","huyen","sac","hoi","nga","nang"].map(k => '<div>'+toneSvg(k)+'<b>'+TONE_INFO[k].name+'</b></div>').join("")
    + '</div><div class="hint" style="margin-top:10px">In the southern dialect hỏi and ngã collapse into one tone — same '
    + 'contour, different spelling. The dot marks the one spelled with ngã.</div></div>'
    + '<div class="next-row" style="margin-top:24px"><button class="btn" id="closeS">Close</button></div>';
  openSheet(html);
  const sel = $("#vsel");
  if (sel) sel.onchange = function(){ S.voice = sel.value; TTS.refresh(); save(); renderStats(); voiceSheet(); };
  const rate = $("#vrate");
  if (rate) rate.oninput = function(){ S.rate = parseFloat(rate.value); save();
    rate.previousElementSibling.textContent = "Speed · "+S.rate.toFixed(2)+"×"; };
  if ($("#apOn"))  $("#apOn").onclick  = function(){ S.autoplay = true;  save(); voiceSheet(); };
  if ($("#apOff")) $("#apOff").onclick = function(){ S.autoplay = false; save(); voiceSheet(); };
  if ($("#rsOn"))  $("#rsOn").onclick  = function(){ S.readSentence = true;  save(); voiceSheet(); };
  if ($("#rsOff")) $("#rsOff").onclick = function(){ S.readSentence = false; save(); voiceSheet(); };
  if ($("#vtest")) $("#vtest").onclick = function(){ TTS.say("Trời mưa, nhớ mang dù nha."); };
  $("#closeS").onclick = closeSheet;
}

function setSheet(){
  const n = storeNote();
  const html = '<div class="eyebrow">Settings</div>'
    + '<h2 style="font-size:20px;font-weight:800;margin:4px 0 0">Cách học · how you drill</h2>'
    + '<div class="field"><label>Cards per session</label><div class="seg">'
    + [8,12,20,30].map(x => '<button data-len="'+x+'" aria-pressed="'+(S.len===x)+'">'+x+'</button>').join("")
    + '</div></div>'
    + '<div class="field"><label>The exercises</label><div class="hint" style="line-height:1.8">'
    + 'Each card sits in one of five boxes, and what you are asked to do depends on how high it has climbed:<br><br>'
    + '<b style="color:var(--eggshell)">Box 1</b> — meaning from the written word, and the southern equivalent.<br>'
    + '<b style="color:var(--eggshell)">Box 2</b> — recall in Vietnamese, listening, which tone you heard, gap-fill, odd one out.<br>'
    + '<b style="color:var(--eggshell)">Box 3</b> — where the word belongs in a sentence, whole-sentence listening, rebuilding a sentence.<br>'
    + '<b style="color:var(--eggshell)">Box 4</b> — writing it from memory, tones included.<br><br>'
    + 'The wrong answers get closer to the right one as a word climbs, so a word you half-know stops being guessable. '
    + 'Miss anything and it drops to box one and comes back three cards later.</div></div>'
    + '<div class="field"><label>Where your progress lives</label><div class="'+n.cls+'">'+n.txt+'</div></div>'
    + '<div class="field"><label>Backup · move it to another device</label>'
    + '<textarea class="box" id="dump" spellcheck="false">'+esc(JSON.stringify(S))+'</textarea>'
    + '<div class="next-row"><button class="btn ghost" id="copyDump">Copy</button>'
    + '<button class="btn ghost" id="loadDump">Restore what is in the box</button></div></div>'
    + '<div class="next-row" style="margin-top:24px"><button class="btn" id="closeS2">Close</button></div>';
  openSheet(html);
  document.querySelectorAll("[data-len]").forEach(function(b){
    b.onclick = function(){ S.len = parseInt(b.dataset.len,10); save(); setSheet(); };
  });
  $("#copyDump").onclick = function(){
    const t = $("#dump"); t.select();
    try{ navigator.clipboard.writeText(t.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
    $("#copyDump").textContent = "Copied";
  };
  $("#loadDump").onclick = function(){
    try{
      const incoming = JSON.parse($("#dump").value);
      if (!incoming || typeof incoming !== "object" || !incoming.prog) throw new Error("shape");
      Object.assign(S, incoming); save();
      closeSheet(); session = null; renderDecks(); renderStats(); idle(); renderList();
    }catch(e){ $("#loadDump").textContent = "That is not a valid backup"; }
  };
  $("#closeS2").onclick = closeSheet;
}

/* ══════════════════════════════════════════════════════════════════
   WIRING
   ══════════════════════════════════════════════════════════════════ */
$("#scrim").onclick = function(e){ if (e.target === $("#scrim")) closeSheet(); };
document.addEventListener("keydown", function(e){
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
  if ($("#scrim").classList.contains("open")){ if (e.key === "Escape") closeSheet(); return; }
  if (keyHandler) keyHandler(e);
});
$("#voiceBtn").onclick = voiceSheet;
$("#setBtn").onclick = setSheet;
$("#tabDrill").onclick = function(){ tab(true); };
$("#tabList").onclick  = function(){ tab(false); };
function tab(drill){
  $("#tabDrill").setAttribute("aria-selected", drill);
  $("#tabList").setAttribute("aria-selected", !drill);
  $("#paneDrill").hidden = !drill;
  $("#paneList").hidden = drill;
  if (!drill) renderList();
}
function setDecks(list){ S.active = list; save(); renderDecks(); renderStats(); if (!session) idle(); renderList(); }
$("#allDecks").onclick  = function(){ setDecks(DECKS.map(d => d.id)); };
$("#lastTwo").onclick   = function(){ setDecks(["d5","d6","d7","d8"]); };
$("#southOnly").onclick = function(){ setDecks(["d10","d11","d12"]); };
$("#resetProg").onclick = function(){
  openSheet('<div class="eyebrow">Reset</div><h2 style="font-size:20px;font-weight:800;margin:4px 0 12px">Clear all progress?</h2>'
    + '<div class="hint" style="line-height:1.7">Boxes, streak and XP go back to zero for every deck. The words stay.</div>'
    + '<div class="next-row" style="margin-top:22px"><button class="btn" id="doReset">Clear it</button>'
    + '<button class="btn ghost" id="noReset">Keep my progress</button></div>');
  $("#doReset").onclick = function(){
    S.prog = {}; S.xp = 0; S.streak = 0; S.streakDay = null; save();
    closeSheet(); session = null; renderDecks(); renderStats(); idle(); renderList();
  };
  $("#noReset").onclick = closeSheet;
};
$("#search").oninput = renderList;
$("#listSpeakAll").onclick = function(){
  if (!("speechSynthesis" in window)) return;
  const items = words(); let i = 0;
  (function nextWord(){
    if (i >= items.length) return;
    const it = items[i++];
    const u = TTS.utter(S.readSentence && it.exVi ? it.exVi : it.vi);
    u.onend = function(){ setTimeout(nextWord, 420); };
    speechSynthesis.speak(u);
  })();
};

(async function init(){
  await load();
  TTS.refresh();
  renderDecks(); renderStats(); idle(); renderList();
  setTimeout(function(){ TTS.refresh(); renderStats(); }, 700);
  setTimeout(function(){ TTS.refresh(); renderStats(); }, 2500);
})();

if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
