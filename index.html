}
function fluencyOf(id){
  const r = S.rev[id]; if (!r) return null; ensureReviewRecord(r);
  const vals = Object.values(r.timing||{}).filter(x=>x && x.n>=1 && x.median!=null).map(x=>fluencyScoreMs(x.median));
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

/* ── grading: knowledge, form, confidence and fluency remain separate ── */
function normalizeGrade(correct, meta){
  const g = Object.assign({outcome:correct?"correct":"wrong", skillCorrect:!!correct,
    knowledgeCredit:correct?1:0, masteryCredit:correct?1:0,
    orthographyCredit:null, toneCredit:null, repair:null, conceptError:!correct}, meta||{});
  if (g.skillCorrect === undefined) g.skillCorrect = !!correct;
  return g;
}
function recordFormEvidence(r, g){
  if (!g || g.orthographyCredit===null && !g.repair) return;
  r.form.attempts++;
  if (g.outcome === "exact") r.form.exact++;
  if (g.outcome === "tone_missing") r.form.toneMissing++;
  if (g.outcome === "wrong_tone") r.form.wrongTone++;
  if (g.outcome === "orthographic_near") r.form.vowelLetterErrors++;
  if (g.outcome === "minor_typo") r.form.spellingErrors++;
}
function addRepair(item, kind, type){
  if (!kind) return;
  const key=item.id+"|"+kind;
  let x=S.repairs.find(r=>r.key===key);
  if(!x){x={key:key,item:item.id,concept:item.concept,kind:kind,n:0,status:"active",first:Date.now(),passes:0};S.repairs.push(x);}
  else if(x.status==="repaired"){x.status="reopened";x.passes=0;x.reopenedAt=Date.now();}
  else if(x.status!=="repairing")x.status="active";
  x.n++;x.last=Date.now();x.type=type;
  if(S.repairs.length>200)S.repairs=S.repairs.slice(-200);
}
function markRepairSuccess(item){
  S.repairs.filter(x=>x.item===item.id && x.status!=="repaired").forEach(function(x){
    x.passes=(x.passes||0)+1; x.lastPass=Date.now();
    if (x.passes>=3) x.status="repaired"; else x.status="repairing";
  });
  S.mistakes.filter(x=>x.item===item.id && x.status!=="repaired").forEach(function(x){
    x.repairPasses=(x.repairPasses||0)+1;
    if (x.repairPasses>=3) x.status="repaired";
  });
}
function skillIntervalUpdate(sk, g, conf, timing){
  if (g.skillCorrect){
    let q = conf === "guess" ? 3 : conf === "unsure" ? 4 : 5;
    if (g.masteryCredit < .8) q = Math.min(q,4);
    sk.ease = Math.max(1.3, (sk.ease||2.3) + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
    let speedFactor = 1;
    if (timing && timing.speedEligible && timing.retrievalMs!=null){
      if (timing.retrievalMs < 2000) speedFactor = 1.10;
      else if (timing.retrievalMs > 12000) speedFactor = 0.90;
    }
    if (sk.ivl === 0) sk.ivl = conf === "guess" ? 0.25 : (g.masteryCredit<.8 ? .5 : 1);
    else if (sk.ivl <= 1) sk.ivl = conf === "guess" ? 1 : (g.masteryCredit<.8 ? 1.5 : 3);
    else sk.ivl = Math.round(sk.ivl * sk.ease * (conf === "guess" ? 0.55 : 1) * speedFactor * 10)/10;
    sk.due = Date.now() + sk.ivl*DAY;
  } else if(g.conceptError===false && (g.knowledgeCredit||0)>0){
    sk.ease=Math.max(1.3,(sk.ease||2.3)-0.06);
    sk.ivl=Math.min(sk.ivl||0.5,0.5); /* same day / next half-day form repair, without lexical reset */
    sk.due=Date.now()+sk.ivl*DAY;
  } else {
    sk.ease = Math.max(1.3, (sk.ease||2.3)-0.22);
    sk.ivl = 0.02; sk.due = Date.now()+sk.ivl*DAY; sk.lapses++;
  }
}
function applyResult(item, type, grade, timing, confidence){
  const id=item.id, wasUnseen=!S.rev[id]||!S.rev[id].reps, r=rec(id), t=TYPES[type]||{skill:"recognition",level:1};
  const sk=r.skills[t.skill], conf=confidence||"none";
  const g=normalizeGrade(grade && grade.skillCorrect, grade);
  const today=new Date().toISOString().slice(0,10);

  r.reps++; r.last=Date.now(); if (r.dates.indexOf(today)<0) r.dates.push(today);
  if(wasUnseen) noteNewIntroduction(id);
  sk.n++; sk.lastSeen=Date.now(); if (sk.dates.indexOf(today)<0) sk.dates.push(today);
  if (conf!=="none") r.conf[conf]=(r.conf[conf]||0)+1;
  recordFormEvidence(r,g);

  let evidence=g.masteryCredit;
  if (conf==="guess") evidence*=0.45; else if (conf==="unsure") evidence*=0.75;
  let listeningFactor=1;
  if(t.skill==="listening"&&timing){
    const plays=Math.max(1,timing.plays||1), slow=timing.slowPlays||0;
    sk.plays=(sk.plays||0)+plays; sk.slowPlays=(sk.slowPlays||0)+slow;
    if(g.skillCorrect&&plays===1&&!slow) sk.onePlayOk=(sk.onePlayOk||0)+1;
    listeningFactor=plays<=1?1:plays===2?.86:.68;
    if(slow) listeningFactor*=.82;
    evidence*=listeningFactor;
  }
  evidence=Math.max(0,Math.min(1,evidence));
  const formOnlyPartial=!g.skillCorrect && g.conceptError===false && (g.knowledgeCredit||0)>0;
  if (g.skillCorrect){
    sk.ok++; sk.lastSuccess=Date.now();
    sk.m=Math.min(1, sk.m+(1-sk.m)*(0.22+0.16*evidence));
    r.run++; if (r.passed.indexOf(type)<0) r.passed.push(type);
    if (!g.repair) markRepairSuccess(item);
  } else if(formOnlyPartial){
    /* The learner retrieved the lexical/grammatical content but the written form needs repair. */
    const partial=Math.max(0.15,Math.min(0.65,g.knowledgeCredit||g.masteryCredit||0.35));
    sk.m=Math.min(1,Math.max(sk.m*0.94,sk.m+(1-sk.m)*0.07*partial));
    r.run=0;
    if (r.failed.indexOf(type)<0) r.failed.push(type);
  } else {
    sk.m=Math.max(0, sk.m*0.62); r.run=0; r.lapses++;
    if (r.failed.indexOf(type)<0) r.failed.push(type);
    if (g.conceptError!==false) noteMistake(item,type,g.outcome||"concept");
  }
  if (g.repair) addRepair(item,g.repair,type);
  const scheduleGrade=listeningFactor<1?Object.assign({},g,{masteryCredit:(g.masteryCredit||0)*listeningFactor}):g;
  skillIntervalUpdate(sk,scheduleGrade,conf,timing);
  recordTiming(r,timing,g.skillCorrect && conf!=="guess");
  learnReadingCalibration(timing,g.skillCorrect && conf!=="guess");
  sk.fluency = timing && timing.speedEligible && timing.retrievalMs!=null ? fluencyScoreMs(timing.retrievalMs) : sk.fluency;

  /* keep old aggregate fields as read-only compatibility summaries */
  r.due=reviewDue(r); r.ivl=reviewInterval(r); r.ease=sk.ease;
  if (g.skillCorrect && conf!=="guess" && g.masteryCredit>=0.8) r.level=Math.min(10,r.level+(t.level>=r.level?1:0));
  else if (!g.skillCorrect) r.level=Math.max(1,r.level-1);

  const c=cRec(item.concept);
  if (g.skillCorrect){ c.passes++; c.run++; }
  else if (g.conceptError!==false){ c.fails++; c.run=0; c.lastFail=Date.now(); }

  if (g.skillCorrect){
    let xp=2+t.level*2;
    if (conf==="knew" && timing && timing.speedEligible && timing.retrievalMs<2000) xp+=4;
    if (g.masteryCredit<1) xp=Math.max(1,Math.round(xp*g.masteryCredit));
    if (r.run>=3) xp+=3;
    S.xp+=xp;
  }
  bumpStreak(); logDay(g.skillCorrect); save();
  return {credit:evidence, band:timing?timing.band:"not scored", timing:timing, grade:g};
}

function noteMistake(item, type, kind){
  const key=item.concept+"|"+item.id+"|"+(kind||"concept");
  let m=S.mistakes.find(x=>x.key===key);
  if(!m){m={key:key,item:item.id,concept:item.concept,kind:kind||"concept",n:0,first:Date.now(),status:"active",repairPasses:0};S.mistakes.push(m);}
  else if(m.status==="repaired"){m.status="reopened";m.repairPasses=0;m.reopenedAt=Date.now();}
  else m.status="active";
  m.n++;m.last=Date.now();m.type=type;
  if(S.mistakes.length>200)S.mistakes=S.mistakes.sort((a,b)=>b.last-a.last).slice(0,200);
}
function bumpStreak(){
  const t = new Date().toISOString().slice(0,10);
  if (S.streakDay === t) return;
  const y = new Date(Date.now()-DAY).toISOString().slice(0,10);
  S.streak = (S.streakDay === y) ? S.streak+1 : 1;
  S.streakDay = t;
}
function logDay(correct){
  const t = new Date().toISOString().slice(0,10);
  let d = S.log.find(x => x.d === t);
  if (!d){ d = {d:t, n:0, ok:0}; S.log.push(d); if (S.log.length > 120) S.log.shift(); }
  d.n++; if (correct) d.ok++;
}

/* ── what to study: item + skill pairs, planned by time ─────────────── */
function supportedSkills(it){
  return ["recognition","recall","context","listening","production"].filter(s=>typesForSkill(it,s).length>0);
}
function duePairs(){
  const now=Date.now(), out=[];
  COURSE.all.forEach(function(it){
    const r=S.rev[it.id]; if (!r || !r.reps) return; ensureReviewRecord(r);
    supportedSkills(it).forEach(function(skill){
      const sk=r.skills[skill]; if (sk.n>0 && sk.due>0 && sk.due<=now) out.push({it:it,skill:skill,due:sk.due});
    });
  });
  return out.sort((a,b)=>a.due-b.due);
}
function dueItems(){
  const seenId={}; return duePairs().map(x=>x.it).filter(it=>!seenId[it.id]&&(seenId[it.id]=1));
}
function unseen(){ return COURSE.all.filter(it => !S.rev[it.id] || S.rev[it.id].reps === 0); }
function seen(){ return COURSE.all.filter(it => S.rev[it.id] && S.rev[it.id].reps > 0); }
function newIntroductionsToday(){
  const d=new Date().toISOString().slice(0,10), x=S.newIntroductions||(S.newIntroductions={date:d,ids:[]});
  if(x.date!==d){x.date=d;x.ids=[];} if(!Array.isArray(x.ids))x.ids=[]; return x.ids;
}
function noteNewIntroduction(id){ const xs=newIntroductionsToday(); if(xs.indexOf(id)<0){xs.push(id); save();} }

function typesForSkill(it, skill){
  return availableTypes(it, skill).filter(t => TYPES[t] && TYPES[t].skill === skill);
}
/* interleave skills early: hearing and supported recall do not wait for a 45% gate */
function nextSkillFor(it){
  const r=rec(it.id), order=["recognition","listening","recall","context","production"];
  const can=order.filter(s=>typesForSkill(it,s).length>0);
  if (!can.length) return "recognition";
  const due=can.filter(s=>r.skills[s].n>0 && r.skills[s].due>0 && r.skills[s].due<=Date.now())
               .sort((a,b)=>r.skills[a].due-r.skills[b].due);
  if (due.length) return due[0];
  const early=order[(Math.max(0,r.reps-1))%order.length];
  if (r.reps<=5 && can.indexOf(early)>-1 && r.skills[early].n===0) return early;
  const untested=can.filter(s=>r.skills[s].n===0);
  if (untested.length) return untested[0];
  return can.sort((a,b)=>r.skills[a].m-r.skills[b].m)[0];
}
/* which exercises this item can actually support, for a given skill */
function availableTypes(it, skill){
  const r=rec(it.id), out=[];
  const lvl=r.level;
  const has=t=>TYPES[t].level<=lvl+1;
  if (it.kind==="pair") return (it.pair.merged || !TTS.ready) ? ["pair_eye"] : (skill==="listening"?["pair_ear"]:["pair_eye"]);
  if (it.kind==="judge") return ["judge"];
  if (it.kind==="contrast") return ["contrast_mc"];
  if (it.kind==="concept") return ["judge_concept"];
  if (it.kind==="dialogue") return ["dialogue_gap"];
  const sent=it.ex&&it.ex.vi;
  if (skill==="recognition"){ out.push("mc_vi_en"); if (has("two_choice")) out.push("two_choice"); if (has("odd")&&classOf(it)) out.push("odd"); }
  if (skill==="recall"){ out.push("mc_en_vi"); if (it.north&&has("south_form")) out.push("south_form"); }
  if (skill==="listening"&&TTS.ready){ out.push("listen_word"); if (sent&&has("listen_sent")) out.push("listen_sent");
    if (sent&&has("listen_chunks")&&toks(sent).length>=4) out.push("listen_chunks");
    if (syllables(it.vi).length===1&&has("tone_id")) out.push("tone_id"); if (sent&&has("listen_type")) out.push("listen_type"); }
  if (skill==="context"&&sent){ if (spanOf(it)) out.push("gap"); if (spanOf(it)&&has("place")) out.push("place");
    const n=toks(it.ex.vi).length; if (has("build")&&n>=4&&n<=9) out.push("build"); }
  if (skill==="production"){
    if (sent&&has("translate_h")) out.push("translate_h"); out.push(lvl>=7?"translate":"translate_h");
    if (sent&&has("error_fix")) out.push("error_fix"); if (sent&&has("free")&&lvl>=8) out.push("free");
  }
  return out.filter(t=>TYPES[t]);
}
function classOf(it){ for (const k in COURSE.classes) if (COURSE.classes[k].indexOf(it.vi)>-1) return k; return null; }
function expectedSeconds(entry){
  if (entry.why==="micro" || entry.it.kind==="micro") return 60;
  const skill=entry.skill||nextSkillFor(entry.it), r=S.rev[entry.it.id];
  const defaults={recognition:8,recall:11,listening:16,context:24,production:45};
  if (r && r.timing){
    const vals=Object.values(r.timing).filter(x=>x&&x.n>=3&&x.median!=null).map(x=>x.median/1000);
    if (vals.length) return Math.max(5,Math.min(75,vals.reduce((a,b)=>a+b,0)/vals.length+4));
  }
  return defaults[skill]||15;
}
function recentPairs(exclude){
  const cut=Date.now()-3*DAY, used=exclude||new Set();
  return seen().filter(it=>rec(it.id).last>=cut).map(it=>({it:it,skill:nextSkillFor(it)}))
    .filter(x=>!used.has(x.it.id+"|"+x.skill));
}
function weakPairs(exclude){
  const used=exclude||new Set();
  return seen().filter(it=>["weak","fading"].indexOf(status(it.id))>-1).map(it=>({it:it,skill:nextSkillFor(it)}))
    .filter(x=>!used.has(x.it.id+"|"+x.skill)).sort((a,b)=>overall(a.it.id)-overall(b.it.id));
}
function buildPlan(){
  const targetSec=Math.max(5,S.dailyMinutes)*60;
  const due=duePairs().map(x=>({it:x.it,skill:x.skill,why:"due"}));
  const used=new Set(due.map(x=>x.it.id+"|"+x.skill));
  const weak=weakPairs(used).map(x=>Object.assign(x,{why:"weak"})); weak.forEach(x=>used.add(x.it.id+"|"+x.skill));
  const recent=recentPairs(used).map(x=>Object.assign(x,{why:"recent"})); recent.forEach(x=>used.add(x.it.id+"|"+x.skill));
  const older=seen().filter(it=>Date.now()-rec(it.id).last>=3*DAY).map(it=>({it:it,skill:nextSkillFor(it),why:"older"}))
    .filter(x=>!used.has(x.it.id+"|"+x.skill)).sort((a,b)=>rec(a.it.id).last-rec(b.it.id).last);
  const fresh=unseen().filter(it=>it.studyMode!=="reference").sort(function(a,b){
    const ac=a.source&&a.source.addedAt||0, bc=b.source&&b.source.addedAt||0; if(ac!==bc) return bc-ac; return (a.origin==="custom"?-1:1)-(b.origin==="custom"?-1:1);
  }).slice(0,Math.max(0,S.newPerDay-newIntroductionsToday().length)).map(it=>({it:it,skill:"recognition",why:"new"}));
  const buckets=[{share:.40,arr:due},{share:.23,arr:weak},{share:.15,arr:recent},{share:.10,arr:older},{share:.12,arr:fresh}];
  const plan=[]; let total=0;
  buckets.forEach(function(b){
    const cap=targetSec*b.share; let spent=0;
    for (const x of b.arr){ const sec=expectedSeconds(x); if (spent && spent+sec>cap*1.25) break;
      const key=x.it.id+"|"+x.skill; if (plan.some(y=>y.it.id+"|"+y.skill===key)) continue;
      plan.push(x); spent+=sec; total+=sec; if (spent>=cap) break; }
  });
  const fill=[due,weak,recent,older,fresh]; let loops=0;
  while (total<targetSec*.92 && loops<100){
    let added=false;
    for (const pool of fill){
      const x=pool.find(c=>!plan.some(y=>y.it.id===c.it.id&&y.skill===c.skill));
      if (x){ plan.push(x); total+=expectedSeconds(x); added=true; if (total>=targetSec) break; }
    }
    if (!added) break; loops++;
  }
  const broken=brokenConcepts();
  if (broken.length){ const c=broken[0]; plan.unshift({it:{id:"cpt:"+c.id,kind:"micro",vi:c.title,en:c.rule,concept:c.id,ref:c},why:"micro",skill:"context"}); }
  const out=[], byC={};
  plan.forEach(x=>(byC[x.it.concept]=byC[x.it.concept]||[]).push(x));
  const keys=Object.keys(byC); let more=true;
  while(more){ more=false; keys.forEach(k=>{ if(byC[k].length){ out.push(byC[k].shift()); more=true; } }); }
  if (plan[0]&&plan[0].why==="micro"){ const i=out.findIndex(x=>x.why==="micro"); if(i>0) out.unshift(out.splice(i,1)[0]); }
  return out;
}
function planMinutes(plan){ return Math.max(1,Math.round(plan.reduce((s,x)=>s+expectedSeconds(x),0)/60)); }
function conceptReady(cid){
  const c = COURSE.conceptById[cid];
  if (!c || !c.requires || !c.requires.length) return 1;
  const met = c.requires.filter(function(r){
    const items = COURSE.itemsByConcept[r] || [];
    if (!items.length) return true;
    const avg = items.reduce((s,x)=>s+overall(x.id),0)/items.length;
    return avg >= 0.4;
  }).length;
  return met / c.requires.length;
}
function brokenConcepts(){
  return COURSE.concepts.filter(function(c){
    const r = S.concept[c.id];
    if (!r) return false;
    const recent = Date.now() - (r.lastFail||0) < 7*DAY;
    const untaught = Date.now() - (r.lastTaught||0) > 2*DAY;
    return r.fails >= 3 && r.run < 2 && recent && untaught;
  }).sort(function(a,b){ return S.concept[b.id].fails - S.concept[a.id].fails; });
}

/* ── weakness analysis — by category, not by raw error count ─────────── */
function weaknesses(){
  const out = [];
  /* 1 · concepts that keep breaking */
  COURSE.concepts.forEach(function(c){
    const r = S.concept[c.id];
    if (!r || r.fails < 2) return;
    const rate = r.fails / Math.max(1, r.fails + r.passes);
    if (rate < 0.3) return;
    out.push({kind:"concept", id:c.id, title:c.title,
      detail: r.fails + " misses across " + (r.fails+r.passes) + " tries",
      severity: rate * Math.min(3, r.fails) , concept:c.id,
      line:"You are not failing separate questions here — this is one structure."});
  });
  /* 2 · slow retrieval: only valid, reading-adjusted timing samples count */
  seen().forEach(function(it){
    const r=S.rev[it.id], xs=validTimingSamples(r);
    if (!r || overall(it.id)<0.5 || xs.length<3) return;
    const med=medianMs(xs);
    if (med<7000) return;
    out.push({kind:"slow",id:it.id,title:it.vi,detail:"adjusted median "+(med/1000).toFixed(1)+" sec",
      severity:0.7+med/20000,concept:it.concept,line:"Knowledge is there; retrieval still needs repeated access."});
  });
  /* 3 · production gap: recognised often, never produced */
  seen().forEach(function(it){
    const r = S.rev[it.id];
    if (!r) return;
    if (r.skills.recognition.m >= 0.7 && r.skills.production.n === 0 && r.skills.recognition.n >= 4){
      out.push({kind:"gap", id:it.id, title:it.vi,
        detail:"recognised " + r.skills.recognition.n + " times, produced 0",
        severity:0.9, concept:it.concept,
        line:"Recognition mastered, production unproven."});
    }
  });
  /* 4 · repeated confusions */
  COURSE.all.filter(x => x.kind === "pair" || x.kind === "contrast").forEach(function(it){
    const r = S.rev[it.id];
    if (!r || r.lapses < 2) return;
    out.push({kind:"confusion", id:it.id, title:it.vi, detail:r.lapses + " mistakes",
      severity: 0.7 + r.lapses*0.15, concept:it.concept,
      line:"These two keep swapping places in your head."});
  });
  /* 5 · southern pronunciation */
  const southItems = COURSE.all.filter(x => x.south);
  const southSeen = southItems.filter(x => S.rev[x.id] && S.rev[x.id].reps);
  if (southSeen.length >= 3){
    const avg = southSeen.reduce((s,x)=>s+overall(x.id),0)/southSeen.length;
    if (avg < 0.55) out.push({kind:"south", id:"south", title:"Southern realization",
      detail:Math.round(avg*100) + "% across " + southSeen.length + " items",
      severity:1.1, concept:"c.south.finals",
      line:"The written form and the southern sound are not lining up yet."});
  }
  /* 6 · active written-form repairs */
  S.repairs.filter(x=>x.status!=="repaired").forEach(function(x){
    const it=COURSE.byId[x.item]; if(!it)return;
    out.push({kind:"form",id:x.item,title:it.vi,detail:(x.kind==="tone"?"tone repair":"spelling repair")+" · "+x.n+" occurrence"+(x.n===1?"":"s")+" · "+x.status,
      severity:.55+Math.min(.8,x.n*.12),concept:it.concept,line:x.kind==="tone"?"The word is retrievable; its written tone still needs stable recall.":"The language content is partly there; standard Vietnamese spelling still needs repair."});
  });
  /* 7 · a whole skill lagging */
  const prof = profile();
  SKILLS.forEach(function(sk){
    if (prof[sk.id] === null) return;
    if (prof[sk.id] < 0.4 && prof.recognition > prof[sk.id] + 0.25){
      out.push({kind:"skill", id:sk.id, title:sk.label + " overall",
        detail:Math.round(prof[sk.id]*100) + "% against " + Math.round(prof.recognition*100) + "% recognition",
        severity:1.3, concept:null,
        line:"You are reading far better than you are " + sk.label.toLowerCase() + "."});
    }
  });
  return out.sort((a,b)=>b.severity-a.severity);
}

/* skill profile, 0..1 per skill, plus fluency */
function profile(){
  const p = {};
  SKILLS.forEach(function(sk){
    const xs = seen().filter(it => rec(it.id).skills[sk.id].n > 0);
    p[sk.id] = xs.length ? xs.reduce((s,it)=>s+rec(it.id).skills[sk.id].m,0)/xs.length : null;
    p[sk.id+"N"] = xs.length;
  });
  const fl = seen().map(it => fluencyOf(it.id)).filter(x => x !== null);
  p.fluency = fl.length ? fl.reduce((a,b)=>a+b,0)/fl.length : null;
  const kn = seen();
  p.knowledge = kn.length ? kn.reduce((s,it)=>s+overall(it.id),0)/kn.length : null;
  p.south = (function(){
    const xs = COURSE.all.filter(x => x.south && S.rev[x.id] && S.rev[x.id].reps);
    return xs.length ? xs.reduce((s,x)=>s+overall(x.id),0)/xs.length : null;
  })();

}
/* course map: demonstrated performance per unit */
function unitProgress(uid){
  const items = COURSE.all.filter(x => x.unit === uid);
  if (!items.length) return {pct:0, n:0, seen:0};
  const sn = items.filter(x => S.rev[x.id] && S.rev[x.id].reps);
  const pct = items.reduce((s,x)=>s+overall(x.id),0)/items.length;
  return {pct:pct, n:items.length, seen:sn.length};

/* ── tutor lines, generated from the data ────────────────────────────── */
function validTimingSamples(r){
  const out=[]; Object.values((r&&r.timing)||{}).forEach(st=>{ if(st&&Array.isArray(st.samples)) st.samples.forEach(x=>{if(Number.isFinite(x))out.push(x);}); }); return out;
}
function medianMs(xs){ if(!xs||!xs.length)return null; const a=xs.slice().sort((x,y)=>x-y),m=Math.floor(a.length/2); return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function tutorLines(){
  const out=[], p=profile();
  const slow=seen().filter(function(it){ const r=S.rev[it.id], xs=validTimingSamples(r), med=medianMs(xs); return xs.length>=3 && med>7000 && overall(it.id)>0.55; });
  if (slow.length){ const xs=validTimingSamples(S.rev[slow[0].id]), med=medianMs(xs);
    out.push("You know "+slow[0].vi+", but adjusted median retrieval is still around "+(med/1000).toFixed(1)+" seconds."); }
  const gap=seen().filter(it=>rec(it.id).skills.recognition.m>0.7&&rec(it.id).skills.production.n===0);
  if (gap.length>=3) out.push("Recognition is running ahead of production on "+gap.length+" items — "+gap.slice(0,2).map(x=>x.vi).join(" and ")+" among them.");
  const bc=brokenConcepts(); if (bc.length) out.push("The recurring issue is "+bc[0].title.toLowerCase()+". A short repair lesson is queued.");
  if (p.listening!==null&&p.recognition!==null&&p.recognition-p.listening>0.25) out.push("Strong on the page, weaker in the ear. Listening is the current bottleneck.");
  if (p.knowledge!==null&&p.fluency!==null&&p.knowledge-p.fluency>0.2) out.push("Knowledge is ahead of retrieval fluency. The scheduler will favour repeated active recall.");
  const ready=seen().filter(it=>rec(it.id).level>=7); if(ready.length>=5) out.push(ready.length+" items are ready for less scaffolding and more production.");
  if (!out.length&&seen().length<5) out.push("Nothing measured yet. A first session will establish the baseline.");
  return out;
}

/* ── weekly diagnostic ───────────────────────────────────────────────── *//* ── weekly diagnostic ───────────────────────────────────────────────── */
function diagnosticDue(){
  if (!S.diag.length) return seen().length >= 20;
  return Date.now() - S.diag[S.diag.length-1].at > 7*DAY;
}
function buildDiagnostic(){
  const pool = seen();
  const pickN = (arr,n) => shuffle(arr.slice()).slice(0,n);
  const plan = [];
  const bySkill = {};
  SKILLS.forEach(sk => bySkill[sk.id] = pool.filter(it => typesForSkill(it, sk.id).length));
  plan.push(...pickN(bySkill.recognition||[], 3).map(it => ({it:it, force:"mc_vi_en"})));
  plan.push(...pickN(bySkill.recall||[], 3).map(it => ({it:it, force:"mc_en_vi"})));
  plan.push(...pickN(bySkill.context||[], 3).map(it => ({it:it, force:null, skill:"context"})));
  if (TTS.ready) plan.push(...pickN(bySkill.listening||[], 2).map(it => ({it:it, force:null, skill:"listening"})));
  plan.push(...pickN(bySkill.production||[], 2).map(it => ({it:it, force:null, skill:"production"})));
  const south = pool.filter(x => x.south);
  plan.push(...pickN(south, 2).map(it => ({it:it, force:null})));
  return shuffle(plan.filter(x => x.it));
}
function closeDiagnostic(results){
  const p = profile();
  const w = weaknesses();
  const entry = {
    at: Date.now(), n: results.length,
    correct: results.filter(r=>r.ok).length,
    profile: {recognition:p.recognition, recall:p.recall, production:p.production,
              listening:p.listening, context:p.context, fluency:p.fluency,
              knowledge:p.knowledge, south:p.south},
    strong: seen().filter(it => overall(it.id) > 0.8).slice(0,5).map(x=>x.vi),
    needs:  w.filter(x => x.kind === "concept").slice(0,3).map(x=>x.title),
    forgot: seen().filter(it => status(it.id) === "fading").slice(0,5).map(x=>x.vi),
    slow:   w.filter(x => x.kind === "slow").slice(0,3).map(x=>x.title + " (" + x.detail + ")"),
    next:   w.slice(0,3).map(x=>x.title)
  };
  S.diag.push(entry); save();
  return entry;
}

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.random()*a.length|0]; }
function bare(s){
  return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d")
    .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function toks(s){ return String(s||"").trim().split(/\s+/).filter(Boolean); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
function sim(a,b){ const A=bare(a),B=bare(b); return 1 - lev(A,B)/Math.max(A.length,B.length,1); }
function normalizeAnswerText(s){
  return String(s==null?"":s).normalize("NFC").toLowerCase().replace(/[?!.,…;:]+$/g,"").replace(/\s+/g," ").trim();
}
const TONE_COMBINING=/[\u0300\u0301\u0303\u0309\u0323]/g;
function stripToneMarksPreserveLetters(s){
  return normalizeAnswerText(s).normalize("NFD").replace(TONE_COMBINING,"").normalize("NFC");
}
function countToneMarks(s){ const m=normalizeAnswerText(s).normalize("NFD").match(TONE_COMBINING); return m?m.length:0; }
function toneSignature(s){
  return normalizeAnswerText(s).normalize("NFD").split(/\s+/).map(function(w){
    const m=w.match(TONE_COMBINING); return m?m.join(""):"";
  }).join("|");
}
function onlyHoiNgaDifference(a,b){
  const A=syllables(normalizeAnswerText(a)),B=syllables(normalizeAnswerText(b));
  if(A.length!==B.length||stripToneMarksPreserveLetters(a)!==stripToneMarksPreserveLetters(b))return false;
  let changed=false;
  for(let i=0;i<A.length;i++){
    const x=toneOf(A[i]),y=toneOf(B[i]); if(x===y)continue;
    if(!((x==="hoi"&&y==="nga")||(x==="nga"&&y==="hoi")))return false;
    changed=true;
  }
  return changed;
}
function classifyTypedAnswer(user,target){
  const U=normalizeAnswerText(user), T=normalizeAnswerText(target);
  if (U===T) return {outcome:"exact",skillCorrect:true,knowledgeCredit:1,masteryCredit:1,orthographyCredit:1,toneCredit:1,repair:null,conceptError:false};
  const uToneLess=stripToneMarksPreserveLetters(U), tToneLess=stripToneMarksPreserveLetters(T);
  if (uToneLess===tToneLess){
    const us=syllables(U), ts=syllables(T); let missing=false, wrong=false;
    for(let i=0;i<Math.max(us.length,ts.length);i++){
      const ut=toneOf(us[i]||""), tt=toneOf(ts[i]||"");
      if(ut===tt) continue;
      if(ut==="ngang"&&tt!=="ngang") missing=true; else wrong=true;
    }
    if (missing && !wrong){
      const strict=S.writingMode==="strict";
      return {outcome:"tone_missing",skillCorrect:!strict,knowledgeCredit:1,masteryCredit:strict?0.45:0.82,
        orthographyCredit:0.75,toneCredit:0.45,repair:"tone",conceptError:false};
    }
    const southernMerge=onlyHoiNgaDifference(U,T);
    return {outcome:"wrong_tone",skillCorrect:S.writingMode!=="strict",knowledgeCredit:0.85,masteryCredit:S.writingMode==="strict"?0.35:0.65,
      orthographyCredit:0.55,toneCredit:0.2,repair:"tone",conceptError:false,southernMerge:southernMerge};
  }
  if (bare(U)===bare(T)){
    return {outcome:"orthographic_near",skillCorrect:false,knowledgeCredit:0.55,masteryCredit:0.35,
      orthographyCredit:0.25,toneCredit:null,repair:"spelling",conceptError:false};
  }
  const dist=lev(U,T), maxlen=Math.max(U.length,T.length,1);
  if (dist===1 && maxlen>=5){
    return {outcome:"minor_typo",skillCorrect:S.writingMode!=="strict",knowledgeCredit:0.8,masteryCredit:S.writingMode==="strict"?0.35:0.6,
      orthographyCredit:0.5,toneCredit:null,repair:"spelling",conceptError:false};
  }
  return {outcome:"wrong",skillCorrect:false,knowledgeCredit:0,masteryCredit:0,orthographyCredit:0,toneCredit:0,repair:"concept",conceptError:true};
}
function formLabel(g){
  if (!g) return "";
  if (g.outcome==="tone_missing") return "Accepted · tone missing";
  if (g.outcome==="wrong_tone") return "Partial · wrong tone";
  if (g.outcome==="orthographic_near") return "Close · spelling mark/letter";
  if (g.outcome==="minor_typo") return "Close · typing slip";
  return "";
}
function spanOf(it){
  if (!it.ex || !it.ex.vi) return null;
  const list = toks(it.ex.vi), len = toks(it.vi).length, p = bare(it.vi);
  for (let i=0;i+len<=list.length;i++) if (bare(list.slice(i,i+len).join(" ")) === p) return {at:i,len:len};
  return null;
}
const TONE_SETS = {huyen:"àằầèềìòồờùừỳ", sac:"áắấéếíóốớúứý", hoi:"ảẳẩẻểỉỏổởủửỷ",

const TONE_PATH = {ngang:"M2,8 L26,8", huyen:"M2,4 L26,13", sac:"M2,13 L26,3",
                   hoi:"M2,4 C9,15 18,15 26,6", nga:"M2,4 C9,15 18,15 26,6", nang:"M2,5 L17,13"};

function toneOf(sy){
  const s = String(sy).normalize("NFC").toLowerCase();

  return "ngang";
}
function syllables(w){ return String(w).normalize("NFC").replace(/[?!.,…—/]/g," ").trim().split(/\s+/).filter(Boolean); }
function toneSvg(k, stroke){
  const c = stroke || "var(--gold)";
  return '<svg width="28" height="16" viewBox="0 0 28 16" aria-hidden="true">'
    + '<path d="'+TONE_PATH[k]+'" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>'
    + (TONE_DOT[k] ? '<circle cx="'+TONE_DOT[k][0]+'" cy="'+TONE_DOT[k][1]+'" r="1.5" fill="'+c+'" opacity=".85"/>' : '')

/* ── speech ───────────────────────────────────────────────────────────── */
const TTS = {
  voices:[], ready:false, current:null, plays:0,
  refresh(){
    if (!("speechSynthesis" in window)) return;
    const all = speechSynthesis.getVoices() || [];
    this.voices = all.filter(v => /^vi/i.test(v.lang) || /vi[\s_-]?vu|rhvoice/i.test(v.name));
    if (S.voice) this.current = this.voices.find(v => v.name === S.voice) || null;
    if (!this.current) this.current =
      this.voices.find(v => /vi[\s_-]?vu/i.test(v.name)) ||
      this.voices.find(v => /rhvoice/i.test(v.name)) ||
      this.voices.find(v => /^vi/i.test(v.lang)) || null;
    this.ready = !!this.current;
  },
  utter(text, rate){
    const u = new SpeechSynthesisUtterance(String(text).replace(/[—•·]/g," "));
    if (this.current) u.voice = this.current;
    u.lang = (this.current && this.current.lang) || "vi-VN";
    u.rate = rate || S.rate;
    return u;
  },
  say(text, rate, btn){
    if (!("speechSynthesis" in window) || !text) return;
    this.plays++;
    try{
      speechSynthesis.cancel(); markAudioStart(rate||S.rate);
      const u=this.utter(text,rate);
      u.onend=function(){ if(btn) btn.classList.remove("playing"); markAudioEnd(); };
      u.onerror=function(){ if(btn) btn.classList.remove("playing"); markAudioEnd(); };
      if (btn) btn.classList.add("playing");
      speechSynthesis.speak(u);
    }catch(e){}
  },
  seq(list, rate){
    if (!("speechSynthesis" in window)) return;
    const xs=(list||[]).filter(Boolean); if(!xs.length) return;
    this.plays++;
    try{
      speechSynthesis.cancel(); markAudioStart(rate||S.rate);
      xs.forEach(function(t,i){ const u=TTS.utter(t,rate); if(i===xs.length-1){ u.onend=u.onerror=markAudioEnd; } speechSynthesis.speak(u); });
    }catch(e){}
  }
};

  speechSynthesis.onvoiceschanged = function(){ TTS.refresh(); if ($("#stats")) paintStats(); };

  const type=types.length?pick(types):"mc_vi_en";

function finishCard(item,type,ok,conf,timing,grade){
  const g=normalizeGrade(ok,grade), res=applyResult(item,type,g,timing,conf);
  SESS.results.push({id:item.id,type:type,ok:g.skillCorrect,grade:g,timing:timing,ms:timing?timing.totalMs:0,conf:conf});
  const formOnlyPartial=!g.skillCorrect&&g.conceptError===false&&(g.knowledgeCredit||0)>0;
  if(g.skillCorrect){ SESS.right++; SESS.run++; SESS.best=Math.max(SESS.best,SESS.run); }
  else if(formOnlyPartial){ SESS.partial=(SESS.partial||0)+1; SESS.run=0; }
  else {
    SESS.wrong++; SESS.run=0;
    const current=SESS.queue[SESS.i]||{}, skill=(TYPES[type]||{}).skill;
    if(!current.retryStage){
      const at=Math.min(SESS.queue.length,SESS.i+3+(Math.random()*3|0));
      SESS.queue.splice(at,0,{it:item,skill:skill,why:"retry",retry:true,retryStage:1});
      SESS.queue.push({it:item,skill:skill,why:"late retry",retry:true,retryStage:2});
    }

    SESS.queue.splice(at,0,{it:item,skill:(TYPES[type]||{}).skill,why:"repair",retry:true,retryStage:1});
  }

/* answer → optional confidence → verdict */
function settle(item,type,ok,extra){
  if(askAnswered) return;

    askConfidence(function(c){ const r=finishCard(item,type,grade.skillCorrect,c,timing,grade); verdict(item,type,grade.skillCorrect,e,timing,r); });

function timingFeedback(t){
  if(!t) return "";
  if(!t.speedEligible){
    if((t.mode==="typed"||t.mode==="free")&&t.firstKeyAt) return 'First response '+(Math.max(0,t.firstKeyAt-t.shownAt-t.readingAllowanceMs-t.hiddenTimeMs)/1000).toFixed(1)+' s · speed not scored';

  }

  if(t.mode==="listening"||t.mode==="listeningTyped") return sec+' s listening response · '+(t.plays||1)+' play'+((t.plays||1)!==1?'s':'')+(t.slowPlays?' · slow audio used':'');

    +(res&&res.credit!==undefined&&ok&&res.credit<0.8?' <span class="dim">— partial learning credit</span>':'')+'</div>';

  if(item.kind==="word"||item.kind==="phrase"){

function wireChoices(correctIdx, after, sayOnPick){
  const btns = $$(".opt");
  function choose(i){
    if (!btns.length || btns[0].disabled) return;
    markTimingInteraction("choice"); if (CURRENT_TIMING) CURRENT_TIMING.answerLockedAt = Date.now();
    btns.forEach(function(b,j){
      b.disabled = true;
      if (j === correctIdx) b.classList.add("right");
      else if (j === i) b.classList.add("wrong");
      else b.classList.add("fade");
    });

  }
  btns.forEach(function(b,i){ b.onclick = function(){ choose(i); }; });

    const n = parseInt(e.key,10);

/* distractors that tighten as the item climbs the ladder */
function distractors(item, key, n, hard){
  const pool = COURSE.words.filter(x => x.id !== item.id && x[key] && !(item.syn && x.syn === item.syn));
  const seenV = {}; seenV[item[key]] = 1;
  let ranked;
  if (hard && key === "vi"){
    ranked = pool.map(x => ({x:x, s: sim(item.vi,x.vi) + (x.concept===item.concept?.15:0) + Math.random()*.08}))
                 .sort((a,b)=>b.s-a.s).map(o=>o.x);
  } else if (hard){
    ranked = pool.filter(x => x.concept === item.concept).concat(shuffle(pool));
  } else {
    ranked = shuffle(pool.filter(x => x.unit === item.unit)).concat(shuffle(pool));
  }
  const out = [];
  ranked.forEach(function(x){ if (out.length < n && !seenV[x[key]]){ seenV[x[key]] = 1; out.push(x); } });
  return out;
}

function chunkSentence(text){
  const ws=toks(text), chunks=[]; if(!ws.length)return chunks;
  const breakers=new Set(["vì","nhưng","nên","nếu","thì","khi","mà","rồi"]);
  let cur=[];
  ws.forEach(function(w,idx){
    const key=bare(w);
    if(cur.length>=2&&(breakers.has(key)||cur.length>=3)){ chunks.push(cur.join(" "));cur=[]; }
    cur.push(w);
    if(cur.length>=3||idx===ws.length-1){chunks.push(cur.join(" "));cur=[];}
  });
  if(cur.length)chunks.push(cur.join(" "));
  if(chunks.length===1&&ws.length>=4){const mid=Math.ceil(ws.length/2);return [ws.slice(0,mid).join(" "),ws.slice(mid).join(" ")];}
  return chunks;
}

    const slots = $$(".slot");
    slots.forEach(function(b,i){
      b.onclick = function(){
        if (b.disabled) return;
        slots.forEach(function(x,j){ x.disabled = true;
          if (j === sp.at) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); });
        if (i === sp.at) slots[i].textContent = it.vi;
        autoSay([it.ex.vi]);
        setTimeout(()=>settle(it, type, i === sp.at, {answer:it.ex.vi, say:it.ex.vi}), i===sp.at?480:840);
      };
    });
    keyHandler = null;
    return;
  }
  if (type === "build"){
    const list = toks(it.ex.vi);
    let bank = shuffle(list.slice());
    if (bank.join(" ") === list.join(" ")) bank = shuffle(bank);
    stage(card(head("Put the sentence back together", "word order")
      + '<div class="prompt-en" style="font-size:19px">'+esc(it.ex.en)+'</div>'
      + '<div class="answer-line" id="ans"></div>'
      + '<div class="bank">'+bank.map((t,i)=>'<button class="tile" data-i="'+i+'">'+esc(t)+'</button>').join("")+'</div>'
      + '<div class="next-row"><button class="btn ghost" id="undo">Undo</button>'
      + '<span class="hint">Tap the words in order</span></div>'));
    wireWhy();
    const chosen = [], ans = $("#ans"), tiles = $$(".tile");
    function paint(){
      ans.innerHTML = chosen.map(c=>'<span class="tok">'+esc(bank[c])+'</span>').join("");
      tiles.forEach((t,i)=>t.classList.toggle("used", chosen.indexOf(i)>-1));
    }
    tiles.forEach(function(t,i){
      t.onclick = function(){
        if (t.disabled || chosen.indexOf(i)>-1) return;
        chosen.push(i); paint();
        if (chosen.length === bank.length){
          const said = chosen.map(c=>bank[c]).join(" ");
          const ok = bare(said) === bare(it.ex.vi);
          tiles.forEach(t2 => t2.disabled = true);
          ans.innerHTML = chosen.map(c=>'<span class="tok" style="border-color:'+(ok?"var(--jade)":"var(--cinnabar)")+'">'+esc(bank[c])+'</span>').join("");
          autoSay([it.ex.vi]);
          setTimeout(()=>settle(it, type, ok, {answer:it.ex.vi, yours: ok?null:said, say:it.ex.vi}), ok?520:900);
        }
      };
    });
    $("#undo").onclick = function(){ chosen.pop(); paint(); };
    keyHandler = null;
    return;
  }

  /* ── grammar judgement ────────────────────────────────────────────── */
  if (type === "judge" && it.judge){
    const j = it.judge;
    const wrongs = shuffle(j.bad.slice()).slice(0, j.bad.length > 1 && Math.random() < .6 ? 2 : 1);
    const opts = shuffle([j.good].concat(wrongs));
    const idx = opts.indexOf(j.good);
    stage(card(head(j.south ? "Which one sounds southern?" : "Which sentence is right?", "grammar")
      + choicesHTML(opts.map(o => '<span class="sentopt">'+esc(o)+'</span>'), false, true)));
    wireWhy();
    wireChoices(idx, function(ok,i){ settle(it, type, ok, {answer:j.good, answerWhy:j.why,
      yours: ok?null:opts[i], say:j.good}); }, [j.good]);
    return;
  }
  if (type === "judge_concept" && it.ref){
    const c = it.ref, chk = c.micro.check;
    stage(card(head(c.title, "concept check")
      + '<div class="prompt-en">'+esc(chk.q)+'</div>'
      + choicesHTML(chk.options.map(o => esc(o)), true)));
    wireWhy();
    wireChoices(chk.answer, function(ok,i){ settle(it, type, ok, {answer:chk.options[chk.answer],
      answerWhy:c.micro.rule, yours: ok?null:chk.options[i]}); }, null);
    return;
  }

  /* ── production ───────────────────────────────────────────────────── */
  if (type === "translate_h" || type === "translate"){
    const withHint = type === "translate_h";
    const target = it.ex && it.ex.vi && Math.random() < 0.55 ? {vi:it.ex.vi, en:it.ex.en} : {vi:it.vi, en:it.en};
    stage(card(head(withHint ? "Translate — one hint" : "Translate", "production")
      + '<div class="prompt-en">'+esc(target.en)+'</div>'
      + (withHint ? '<div class="hint" style="margin-top:8px">Starts with <b>'+esc(toks(target.vi)[0])+'</b> · '
          + toks(target.vi).length+' words</div>' : '')
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="type in Vietnamese"><button class="btn" id="tgo">Check</button></div>'
      + '<div class="hint" style="margin-top:9px">Plain spelling without tones earns a partial pass.</div>'));
    wireWhy();
    typeCheck(it, type, target.vi);
    return;
  }
  if (type === "error_fix"){
    const broken = breakSentence(it.ex.vi, it);
    if (!broken) return renderExercise(it, "translate_h", skill);
    stage(card(head("Find the mistake", "error correction")
      + '<div class="sent wrong-sent">'+esc(broken.bad)+'</div>'
      + '<div class="sent-en">'+esc(it.ex.en)+'</div>'
      + '<div class="hint" style="margin:12px 0 0">Type the sentence as it should be.</div>'
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="the corrected sentence"><button class="btn" id="tgo">Check</button></div>'));
    wireWhy();
    typeCheck(it, type, it.ex.vi, broken.why);
    return;
  }
  if (type === "free"){
    stage(card(head("Say it yourself", "free production")
      + '<div class="prompt-en">'+esc(freePrompt(it))+'</div>'
      + '<div class="typebox"><input class="type" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" '
      + 'spellcheck="false" placeholder="write your own sentence"><button class="btn" id="tgo">Review</button></div>'
      + '<div class="hint" style="margin-top:9px">Open production is not auto-approved by a string matcher. You will compare it with the target and self-grade.</div>'));
    wireWhy(); const input=$("#tin"); input.focus(); input.addEventListener("input",()=>markTimingInteraction("key"),{once:true});
    function review(){
      const v=input.value.trim(); if(!v) return; if(askAnswered) return; markTimingInteraction("key");
      const exactTarget=normalizeAnswerText(v).indexOf(normalizeAnswerText(it.vi))>-1;
      const toneTarget=stripToneMarksPreserveLetters(v).indexOf(stripToneMarksPreserveLetters(it.vi))>-1;
      const model=(it.ex&&it.ex.vi)||((COURSE.conceptById[it.concept]||{}).micro||{}).produce?.vi||it.vi;
      const box=document.createElement("div"); box.className="verdict";
      box.innerHTML='<div class="eyebrow">Compare before grading</div>'
        +'<div class="wrongline"><b>Your sentence</b> '+esc(v)+'</div>'
        +'<div class="rightline"><b>Model</b> '+esc(model)+'</div>'
        +(!toneTarget?'<div class="note course-note">The target expression <b>'+esc(it.vi)+'</b> is not clearly present.</div>':'')
        +(toneTarget&&!exactTarget?'<div class="note south-note">The target looks present without its full tone spelling. Treat form separately from meaning.</div>':'')
        +'<div class="conf-row"><button class="conf" data-self="correct"'+(!toneTarget?' disabled':'')+'>Correct</button>'
        +'<button class="conf" data-self="partial">Mostly correct</button><button class="conf" data-self="wrong">Needs correction</button></div>';
      $("#card").appendChild(box); $("#tgo").disabled=true; input.disabled=true;
      $$('[data-self]').forEach(function(b){ b.onclick=function(){
        const k=b.dataset.self, g=k==="correct"?{outcome:"self_correct",skillCorrect:true,knowledgeCredit:1,masteryCredit:1,conceptError:false}
          : k==="partial"?{outcome:"self_partial",skillCorrect:true,knowledgeCredit:.7,masteryCredit:.68,repair:"production",conceptError:false}
          : {outcome:"wrong",skillCorrect:false,knowledgeCredit:0,masteryCredit:0,repair:"production",conceptError:true};
        if(g.skillCorrect) markProduced(it.id,v);
        settle(it,type,g.skillCorrect,{answer:model,yours:v,grade:g});
      }; });
    }
    $("#tgo").onclick=review; input.onkeydown=e=>{ if(e.key==="Enter") review(); }; keyHandler=null; return;
  }

  /* ── dialogue completion ──────────────────────────────────────────── */
  if (type === "dialogue_gap" && it.dialogue){
    const d = it.dialogue;
    const i = 1 + (Math.random() * (d.lines.length-1) | 0);
    const target = d.lines[i];
    const others = shuffle(COURSE.dialogues.flatMap(x=>x.lines).filter(l => l.vi !== target.vi)).slice(0,3);
    const opts = shuffle([target].concat(others));
    const idx = opts.indexOf(target);
    stage(card(head(d.title, "conversation")
      + '<div class="dlg">'+d.lines.slice(0,i).map(l =>
          '<div class="dlg-line"><span class="who">'+esc(l.who)+'</span><span class="vi">'+esc(l.vi)+'</span>'
          +'<span class="en">'+esc(l.en)+'</span></div>').join("")
      + '<div class="dlg-line open"><span class="who">'+esc(target.who)+'</span><span class="vi">…</span></div></div>'
      + '<div class="prompt-en" style="font-size:17px;margin-top:14px">'+esc(target.en)+'</div>'
      + choicesHTML(opts.map(o => '<span class="sentopt">'+esc(o.vi)+'</span>'), false, true)));
    wireWhy();
    wireChoices(idx, function(ok,k){ settle(it, type, ok, {answer:target.vi+" — "+target.en,
      yours: ok?null:opts[k].vi, say:target.vi}); }, [target.vi]);
    return;
  }

  /* fallback */
  return renderExercise(it, "mc_vi_en", "recognition");
}

/* typed answers: lexical retrieval and written form are graded separately */
function typeCheck(it,type,targetVi,extraWhy){
  const target=targetVi||it.vi, input=$("#tin"); input.focus();
  function go(){
    const v=input.value.trim(); if(!v) return;
    markTimingInteraction("key");

      /* Southern speech does not acoustically distinguish hỏi from ngã. Keep listening success; repair standard spelling separately. */
      g.skillCorrect=true; g.masteryCredit=Math.max(g.masteryCredit||0,.78); g.knowledgeCredit=Math.max(g.knowledgeCredit||0,.9); g.conceptError=false;
    }
    if(g.skillCorrect && TYPES[type] && TYPES[type].skill==="production") markProduced(it.id,v);

/* conversation memory: what has actually been produced unaided *//* conversation memory: what has actually been produced unaided */
function markProduced(id, text){
  const r = rec(id);
  r.produced = r.produced || [];

/* deliberately break a sentence, using the error the course warns about */
function breakSentence(vi, it){
  const t = toks(vi);
  const c = it.concept;
  const swapAfter = function(word, why){
    const i = t.findIndex(x => bare(x) === bare(word));
    if (i < 0 || i+1 >= t.length) return null;
    const u = t.slice(); const tmp = u[i]; u[i] = u[i+1]; u[i+1] = tmp;
    return {bad:u.join(" "), why:why};
  };
  if (c === "c.mod.core"){
    for (const m of ["muốn","cần","phải","nên"]){ const r = swapAfter(m, "The modal goes in front of the verb."); if (r) return r; }
  }
  if (c === "c.cmp.more"){ const r = swapAfter("hơn", "hơn follows the adjective."); if (r) return r; }
  if (c === "c.cmp.most"){ const r = swapAfter("nhất", "nhất follows the adjective."); if (r) return r; }
  if (c === "c.freq.adv"){
    for (const f of ["luôn","thường","hay","hiếm","ít"]){ const r = swapAfter(f, "Frequency words stand before the verb."); if (r) return r; }
  }
  if (c === "c.asp.chua" && t[t.length-1] && bare(t[t.length-1]).indexOf("chua") > -1){
    return {bad:"Chưa " + t.slice(0,-1).join(" ") + "?", why:"As a question chưa goes at the very end."};
  }
  /* generic: swap two adjacent words in the middle */
  if (t.length >= 4){
    const i = 1 + (Math.random()*(t.length-2)|0);
    const u = t.slice(); const tmp = u[i]; u[i] = u[i+1]; u[i+1] = tmp;
    if (u.join(" ") !== vi) return {bad:u.join(" "), why:"Two words have swapped places."};
  }
  return null;
}
function freePrompt(it){
  const c = COURSE.conceptById[it.concept];
  const prompts = {
    "c.mod.core":"Someone asks what you want to do tonight. Answer with " + it.vi + ".",
    "c.freq.adv":"Describe your week using " + it.vi + ".",
    "c.asp.chua":"Answer someone who asked whether you have done it, using " + it.vi + ".",
    "c.cmp.more":"Compare two people you know, using " + it.vi + ".",
    "c.south.lexicon":"Say something a southerner would say, using " + it.vi + ".",
    "c.sent.o":"Say where something is, using " + it.vi + "."
  };
  return prompts[it.concept] || ("Write your own sentence using " + it.vi + (c ? " — " + c.title.toLowerCase() : "") + ".");
}

function microProduce(c, checkOk){

    +'<div class="report" style="margin-top:20px">'
    +'<div class="rrow"><span class="rt">Listening</span><span class="rv">'+(listening.length?listening.filter(x=>x.ok).length+' / '+listening.length+' successful · '+extraReplays+' extra replay'+(extraReplays===1?'':'s')+(slowAudio?' · slow audio used '+slowAudio+'×':''):'No listening evidence this session')+'</span></div>'
    +'<div class="rrow"><span class="rt">Production</span><span class="rv">'+(production.length?production.filter(x=>x.ok).length+' / '+production.length+' successful':'No production evidence this session')+'</span></div>'
    +'<div class="rrow"><span class="rt">Writing</span><span class="rv">'+toneMissing+' tone omission'+(toneMissing===1?'':'s')+' · '+formErr+' other form repair'+(formErr===1?'':'s')+'</span></div></div>'

  $("#stage").innerHTML=html; wireSpeak(); $("#again").onclick=()=>startSession(buildPlan()); $("#done").onclick=()=>{SESS=null;go("today");};

/* pronunciation: consonant + vowel + tone */
function syllableTrainer(){
  let i = 0;
  const sets = shuffle(COURSE.pron.builders.slice());
  function step(){
    if (i >= sets.length) return go("listen");
    const b = sets[i];
    const real = b.forms.filter(f => f[1] !== "—");
    const target = pick(real);
    $("#stage").innerHTML = card(label("Build the syllable", "consonant → vowel → tone")
      + '<div class="build-seq"><span>'+esc(b.onset)+'</span><span class="plus">+</span>'
      + '<span>'+esc(b.rime)+'</span><span class="plus">+</span><span class="dim">?</span></div>'
      + '<div class="prompt-en" style="margin-top:16px">Which one means <b>'+esc(target[1])+'</b>?</div>'
      + choicesHTML(b.forms.filter(f=>f[1]!=="—").map(f => esc(f[0])+' '+toneSvg(toneOf(f[0]))), true)
      + '<div class="hint" style="margin-top:12px">The tone is the last decision, not part of the letter.</div>')
      + '<div class="foot"><div class="bar"><i style="width:'+(i/sets.length*100)+'%"></i></div>'
      + '<span class="count">'+i+' / '+sets.length+'</span></div>';
    const opts = real;
    wireChoices(opts.indexOf(target), function(ok){
      TTS.say(target[0]);
      const el = document.createElement("div");
      el.className = "verdict";
      el.innerHTML = (ok?'<div class="vtag ok">Đúng rồi</div>':'<div class="vtag no">Chưa đúng</div>')
        + '<div class="tonegrid">'+real.map(f =>
            '<div class="tonecell'+(f===target?' hit':'')+'">'+toneSvg(toneOf(f[0]))
            + '<b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span>'
            + '<button class="mini" data-say="'+esc(f[0])+'">▶</button></div>').join("")+'</div>'
        + '<div class="next-row"><button class="btn" id="n">Tiếp</button></div>';
      $("#card").appendChild(el);
      wireSpeak();
      $("#n").onclick = function(){ i++; step(); };
      keyHandler = e => { if (e.key==="Enter"){ i++; step(); } };
    }, [target[0]]);
  }
  step();
}
function tonePairTrainer(){
  let i = 0;
  const rounds = shuffle(COURSE.pron.builders.slice()).slice(0,4);
  function step(){
    if (i >= rounds.length) return go("listen");
    const b = rounds[i];
    const real = b.forms.filter(f=>f[1]!=="—");
    const said = pick(real);
    $("#stage").innerHTML = card(label("Six spellings, one vowel", "tone discrimination")
      + replayBlock(said[0])
      + choicesHTML(real.map(f => esc(f[0])+' '+toneSvg(toneOf(f[0]))+' <span class="en" style="margin-left:6px">'+esc(f[1])+'</span>'), true)
      + (TTS.ready?'':'<div class="warn">No Vietnamese voice — this one needs audio.</div>'))
      + '<div class="foot"><div class="bar"><i style="width:'+(i/rounds.length*100)+'%"></i></div>'
      + '<span class="count">'+i+' / '+rounds.length+'</span></div>';
    wireReplay(said[0]);
    setTimeout(()=>TTS.say(said[0]), 200);
    wireChoices(real.indexOf(said), function(ok){
      const el = document.createElement("div"); el.className="verdict";
      el.innerHTML = (ok?'<div class="vtag ok">Đúng rồi</div>':'<div class="vtag no">It was '+esc(said[0])+'</div>')
        + '<div class="vrow"><span class="w">'+esc(said[0])+'</span><span class="g">'+esc(said[1])+'</span></div>'
        + toneRail(said[0], true)
        + '<div class="next-row"><button class="btn" id="n">Tiếp</button></div>';
      $("#card").appendChild(el);
      $("#n").onclick = function(){ i++; step(); };
      keyHandler = e => { if (e.key==="Enter"){ i++; step(); } };
    }, [said[0]]);
  }
  step();
}
function southShiftTrainer(){
  let i = 0;
  const rules = shuffle(COURSE.pron.southRules.slice());
  function step(){
    if (i >= rules.length) return go("listen");
    const r = rules[i];
    const p = pick(r.pairs);
    const wrong = shuffle(COURSE.pron.southRules.filter(x=>x.id!==r.id)).slice(0,2).map(x=>pick(x.pairs)[0]);
    const opts = shuffle([p[0]].concat(wrong));
    $("#stage").innerHTML = card(label("Southern shift · " + r.title, "written form vs spoken")
      + '<div class="south-pair"><div><span class="lbl">you hear</span><b>'+esc(p[1])+'</b></div></div>'
      + '<div class="prompt-en" style="margin-top:14px">Which is the written form?</div>'
      + choicesHTML(opts.map(o=>esc(o)), true)
      + '<div class="hint" style="margin-top:12px">'+esc(r.southern)+'</div>')
      + '<div class="foot"><div class="bar"><i style="width:'+(i/rules.length*100)+'%"></i></div>'

function runScenario(id){
  const sc = COURSE.scenarios.find(x=>x.id===id);
  let i=0, points=0, rated=0;
  const t0=Date.now();
  function step(){
    if(i>=sc.steps.length) return finish();
    const st=sc.steps[i];
    $("#stage").innerHTML=card(label(sc.title,"scenario · "+(i+1)+" of "+sc.steps.length,whyBtn(sc.concept))
      +(i===0?'<div class="note">'+esc(sc.setting)+'</div>':'')
      +'<div class="goal">'+esc(st.goal)+'</div>'
      +(st.note?'<div class="note south-note">'+esc(st.note)+'</div>':'')
      +'<div class="typebox"><input class="type" id="sin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="say it in Vietnamese"><button class="btn" id="sgo">Compare</button></div>'
      +'<div class="hint" style="margin-top:9px">Open production is self-checked after you compare it with course-supported models. The app does not pretend string similarity proves grammar.</div>'
      +'<div class="next-row"><button class="btn ghost" id="hint">Hint</button>'
      +(SR.ok?'<button class="btn ghost" id="mic">🎙 Speak</button>':'')
      +'<button class="btn ghost" id="skip">Show models</button></div>');
    wireWhy();
    const input=$("#sin"); input.focus();
    $("#hint").onclick=function(){ $("#hint").outerHTML='<span class="hint">'+esc(st.hint||"")+'</span>'; };
    if($("#mic")) $("#mic").onclick=function(){ SR.listen(function(txt){ input.value=txt; compare(txt); }); };
    $("#skip").onclick=function(){ compare(""); };
    $("#sgo").onclick=function(){ const v=input.value.trim(); if(v) compare(v); };
    input.onkeydown=e=>{ if(e.key==="Enter"&&input.value.trim()) compare(input.value.trim()); };

    function compare(said){
      if($("#scenarioEval")) return;
      const b=bare(said), modelMatch=said&&st.expect.some(e=>b===bare(e)||b.indexOf(bare(e))>-1||bare(e).indexOf(b)>-1||sim(said,e)>.82);
      let toneNote="";
      if(said){
        const grades=st.expect.map(e=>classifyTypedAnswer(said,e));
        const tg=grades.find(g=>g.outcome==="tone_missing"||g.outcome==="wrong_tone");
        if(tg) toneNote='<div class="note south-note"><b>Written form.</b> Your wording matches a model apart from tone marks. Count the language separately from the spelling repair.</div>';
      }
      const el=document.createElement("div"); el.className="verdict"; el.id="scenarioEval";
      el.innerHTML='<div class="eyebrow">Compare, then rate the language</div>'
        +(said?'<div class="wrongline"><b>You said</b> '+esc(said)+'</div>':'<div class="hint">You revealed the models without answering.</div>')
        +(modelMatch?'<div class="note south-note"><b>Pattern signal.</b> Your answer is close to a stored model. Treat this as a clue, not an automatic grammar verdict.</div>':'')
        +toneNote
        +'<div class="rightline"><b>Course model</b> '+esc(st.expect[0])+'</div>'
        +(st.expect.length>1?'<div class="hint">Other accepted models: '+st.expect.slice(1).map(esc).join(" · ")+'</div>':'')
        +(st.hint?'<div class="note"><b>Target.</b> '+esc(st.hint)+'</div>':'')
        +'<div class="eyebrow" style="margin-top:16px">How well did your answer express the target?</div>'
        +'<div class="conf-row"><button class="conf" data-self="1">Correct</button><button class="conf" data-self="0.65">Mostly correct</button><button class="conf" data-self="0">Needs correction</button></div>';
      $("#card").appendChild(el); wireSpeak(); autoSay([st.expect[0]]);
      $$('[data-self]').forEach(function(btn){ btn.onclick=function(){ rate(Number(btn.dataset.self),said); }; });
      keyHandler=function(e){ if(e.key==="1")rate(1,said); if(e.key==="2")rate(.65,said); if(e.key==="3")rate(0,said); };
    }
    function rate(score,said){
      if(!$("#scenarioEval")) return;
      points+=score; rated++;
      if(said&&score>0){
        /* Link successful free production back to course vocabulary actually used. */
        COURSE.words.forEach(function(w){ if(w.vi&&bare(said).indexOf(bare(w.vi))>-1) markProduced(w.id,said); });
      }
      i++; step();
    }
  }
  function finish(){
    const id2="sc:"+sc.id, r=rec(id2), sk=r.skills.production, ratio=sc.steps.length?points/sc.steps.length:0;
    r.reps++; r.last=Date.now(); sk.n++; sk.lastSeen=Date.now();
    if(ratio>=.6){ sk.ok++; sk.lastSuccess=Date.now(); }
    sk.m=Math.min(1,Math.max(0,sk.m*.65+ratio*.35));
    const grade={skillCorrect:ratio>=.6,masteryCredit:ratio,knowledgeCredit:ratio,conceptError:ratio<.4};
    skillIntervalUpdate(sk,grade,ratio>=.85?"knew":ratio>=.6?"unsure":"none",{speedEligible:false});
    r.due=reviewDue(r); r.ivl=reviewInterval(r);
    S.xp+=Math.round(8+points*5); save();
    $("#stage").innerHTML=card(label("Xong rồi","scenario complete")
      +'<div class="score">'+Math.round(ratio*100)+'<small>% self-rated production</small></div>'
      +'<div class="hint" style="margin-top:12px">'+rated+' responses assessed. '+Math.round((Date.now()-t0)/1000)+' seconds recorded for analytics only; free-production speed does not reduce mastery.</div>'
      +'<div class="next-row" style="margin-top:20px"><button class="btn" id="again">Run it again</button><button class="btn ghost" id="back">Back</button></div>');
    $("#again").onclick=function(){ runScenario(id); }; $("#back").onclick=function(){ go("speak"); };
  }
  step();
}

      const k = b.dataset.k, id = b.dataset.id, c = b.dataset.c;
      if (k === "concept" && COURSE.conceptById[id]) return explainSheet(id);
      if (k === "skill"){
        const pool = seen().filter(x => typesForSkill(x, id).length)
                           .sort((a,b2)=>rec(a.id).skills[id].m - rec(b2.id).skills[id].m);
        return drill(pool.slice(0,12), {skill:id, why:"skill"});
      }

      const pool = c ? (COURSE.itemsByConcept[c]||[]) : [];

function csvRows(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<String(text).length;i++){ const c=text[i],n=text[i+1];
    if(c==='"'){ if(q&&n==='"'){cell+='"';i++;} else q=!q; }
    else if(c===','&&!q){row.push(cell);cell="";}
    else if((c==='\n'||c==='\r')&&!q){ if(c==='\r'&&n==='\n')i++; row.push(cell); if(row.some(x=>x.trim()))rows.push(row); row=[];cell=""; }
    else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim()))rows.push(row); return rows;
}
function parseCSVLesson(text,date,title){
  const rows=csvRows(text); if(!rows.length) throw new Error("CSV is empty.");
  const h=rows[0].map(x=>x.trim().toLowerCase()), get=(r,names)=>{ for(const n of names){const i=h.indexOf(n);if(i>=0)return (r[i]||"").trim();} return ""; };
  const raw={lesson:{date:date,title:title},vocabulary:[],concepts:[],examples:[],dialogues:[]};
  rows.slice(1).forEach(function(r){ const type=(get(r,["type"])||"vocab").toLowerCase();
    if(type==="vocab"||type==="word"||type==="vocabulary") raw.vocabulary.push({id:get(r,["id"]),vi:get(r,["vi","vietnamese"]),en:get(r,["en","english"]),concept:get(r,["concept"]),exampleVi:get(r,["examplevi","example vi"]),exampleEn:get(r,["exampleen","example en"]),note:get(r,["note"]),south:/^(1|true|yes)$/i.test(get(r,["south"])),studyMode:get(r,["studymode","study mode"])||"active"});
    else if(type==="grammar"||type==="concept") raw.concepts.push({id:get(r,["id"]),title:get(r,["title","vi"]),rule:get(r,["rule","en","note"]),unit:get(r,["unit"])});
    else if(type==="example") raw.examples.push({id:get(r,["id"]),vi:get(r,["vi","vietnamese"]),en:get(r,["en","english"]),concept:get(r,["concept"])});

function splitLessonPair(z){
  const tab=z.indexOf("\t"); if(tab>=0) return [z.slice(0,tab).trim(),z.slice(tab+1).trim()];
  const arrow=z.indexOf("->"); if(arrow>=0) return [z.slice(0,arrow).trim(),z.slice(arrow+2).trim()];
  const eq=z.indexOf("="); if(eq>=0) return [z.slice(0,eq).trim(),z.slice(eq+1).trim()];
  return [z.trim()];
}
function parseBulkLesson(text,date,title){
  const raw={lesson:{date:date,title:title},vocabulary:[],concepts:[],examples:[],dialogues:[],pronunciation:[],exercises:[],notes:[]};
  let section="", currentDialogue=[];
  function flushDialogue(){ if(currentDialogue.length){ raw.dialogues.push({title:"Class dialogue",lines:currentDialogue}); currentDialogue=[]; } }
  String(text||"").split(/\r?\n/).forEach(function(line){ const z=line.trim(); if(!z)return;
    const sec=z.match(/^\[([^\]]+)\]$/); if(sec){ flushDialogue(); section=sec[1].toLowerCase(); return; }
    if(section.indexOf("vocab")===0){ const m=splitLessonPair(z); if(m.length>=2&&m[1]) raw.vocabulary.push({vi:m[0],en:m[1]}); else raw.notes.push(z); }
    else if(section.indexOf("grammar")===0){ const m=splitLessonPair(z); if(m.length>=2&&m[1]) raw.concepts.push({title:m[0],rule:m[1]}); else raw.notes.push(z); }
    else if(section.indexOf("example")===0){ const m=splitLessonPair(z); if(m.length>=2&&m[1]) raw.examples.push({vi:m[0],en:m[1]}); else raw.notes.push(z); }
    else if(section.indexOf("pron")===0){ const m=splitLessonPair(z); raw.pronunciation=raw.pronunciation||[]; raw.pronunciation.push({id:"pron-"+shortHash(z),written:m[0],note:m.slice(1).join(" ")}); }
    else if(section.indexOf("exercise")===0){ const m=splitLessonPair(z); raw.exercises=raw.exercises||[]; raw.exercises.push({id:"exercise-"+shortHash(z),prompt:m[0],answer:m.slice(1).join(" ")}); }
    else if(section.indexOf("dialog")===0){ const m=z.match(/^([^:]+):\s*(.*?)(?:\s*\|\s*(.*))?$/); if(m) currentDialogue.push({who:m[1].trim(),vi:m[2].trim(),en:(m[3]||"").trim()}); else raw.notes.push(z); }
    else raw.notes.push(z);
  }); flushDialogue(); raw.lesson.notes=raw.notes.join("\n"); return normalizeLessonPack(raw);
}

    + '<div class="spark">'+days.map(function(d){

        return '<span title="'+esc(d.d)+': '+d.n+'" style="height:'+h+'px;opacity:'+(0.35+0.65*(d.ok/Math.max(1,d.n)))+'"></span>';
      }).join("")+'</div>'
    + '<div class="group-h" style="margin-top:24px"><span class="eyebrow">Weekly report</span></div>'
    + (last ? reportHTML(last) : '<div class="empty">No diagnostic run yet.</div>')
    + '<div class="next-row" style="margin-top:18px"><button class="btn" id="runDiag">'
    + (diagnosticDue()?'Run this week\'s diagnostic':'Run a diagnostic anyway')+'</button>'
    + '<button class="btn ghost" id="openSet">Settings</button></div>';
  $("#runDiag").onclick = runDiagnostic;
  $("#openSet").onclick = settingsSheet;
}
function reportHTML(d){
  const when = new Date(d.at).toISOString().slice(0,10);
  const row = (t, v) => '<div class="rrow"><span class="rt">'+esc(t)+'</span><span class="rv">'
    + (v && v.length ? esc(Array.isArray(v)?v.join(" · "):v) : "—")+'</span></div>';
  return '<div class="report"><div class="eyebrow">Alexandre · '+esc(when)+'</div>'
    + '<div class="hint" style="margin-bottom:10px">'+d.correct+' of '+d.n+' correct across every skill.</div>'
    + row("Strong", d.strong) + row("Needs work", d.needs) + row("Forgotten", d.forgot)
    + row("Slow recall", d.slow) + row("Next week", d.next) + '</div>';
}
function runDiagnostic(){
  const plan = buildDiagnostic();
  if (!plan.length) return alert("Not enough material has been met yet for a diagnostic.");
  startSession(plan.map(x => ({it:x.it, force:x.force, skill:x.skill, why:"diagnostic"})), {mode:"diagnostic"});
}
function renderDiagnosticReport(results){
  const entry = closeDiagnostic(results);
  $("#stage").innerHTML = card(label("Weekly report", "diagnostic complete")
    + '<div class="score">'+entry.correct+'<small> / '+entry.n+'</small></div>'
    + reportHTML(entry)
    + tutorBlock()
    + '<div class="next-row" style="margin-top:20px"><button class="btn" id="back">Back to today</button></div>');
  $("#back").onclick = function(){ go("today"); };
}

/* ══ sheets, settings, wiring ════════════════════════════════════════ */
function openSheet(html){ $("#sheet").innerHTML = html; $("#scrim").classList.add("open"); }
function closeSheet(){ $("#scrim").classList.remove("open"); }

function voiceSheet(){
  TTS.refresh();
  let html = '<div class="eyebrow">Audio</div><h2 class="sheet-h">Giọng đọc · voice</h2>';
  if (!("speechSynthesis" in window)){
    html += '<div class="warn">This browser has no speech engine. Everything else still works.</div>';
  } else if (!TTS.voices.length){
    html += '<div class="warn"><b>No Vietnamese voice on this device.</b><br>Install <b>Vi Vu</b>, the southern '
      + 'RHVoice voice, and the browser picks it up here.<br><br><b>Android:</b> install RHVoice, choose Tiếng Việt, '
      + 'install Vi Vu, then set RHVoice as the system engine under Settings → Accessibility → Text-to-speech output.'
      + '<br><br><a href="https://louderpages.org/vi-vu" target="_blank" rel="noopener">louderpages.org/vi-vu →</a></div>';
  } else {
    html += '<div class="field"><label>Voice</label><select id="vsel">'
      + TTS.voices.map(v => '<option value="'+esc(v.name)+'"'+(TTS.current&&v.name===TTS.current.name?" selected":"")+'>'
          + esc(v.name)+' — '+esc(v.lang)+'</option>').join("")+'</select></div>'
      + '<div class="field"><label>Speed · '+S.rate.toFixed(2)+'×</label>'
      + '<input type="range" id="vrate" min="0.5" max="1.2" step="0.05" value="'+S.rate+'"></div>'
      + seg("Play automatically", "ap", S.autoplay)
      + seg("Read the whole sentence", "rs", S.readSentence)
      + '<div class="hint" style="margin-top:8px">On: whenever a card carries an example sentence you hear the word and then the sentence.</div>'
      + '<div class="next-row"><button class="btn ghost" id="vtest">▶ Trời mưa, nhớ mang dù nha.</button></div>';
    const nm = (TTS.current&&TTS.current.name)||"";
    html += /vi[\s_-]?vu/i.test(nm)
      ? '<div class="ok-note">Vi Vu is doing the talking — the southern accent you are learning.</div>'
      : /rhvoice/i.test(nm)
      ? '<div class="ok-note">RHVoice is talking. If Vi Vu is what you chose in the RHVoice app, this is it.</div>'
      : '<div class="warn">This voice does not name its engine. On Android that is normal. If you installed RHVoice and '
        + 'picked Vi Vu, set RHVoice as the system engine in Accessibility → Text-to-speech output.</div>';
  }
  html += '<div class="field" style="margin-top:22px"><label>Tone marks</label><div class="legend">'
    + ["ngang","huyen","sac","hoi","nga","nang"].map(k=>'<div>'+toneSvg(k)+'<b>'+TONE_NAME[k]+'</b></div>').join("")
    + '</div><div class="hint" style="margin-top:10px">In the south hỏi and ngã are one tone. The dot marks the one spelled with ngã.</div></div>'
    + '<div class="next-row" style="margin-top:20px"><button class="btn" id="closeV">Close</button></div>';
  openSheet(html);
  if ($("#vsel")) $("#vsel").onchange = function(){ S.voice = this.value; TTS.refresh(); save(); voiceSheet(); };
  if ($("#vrate")) $("#vrate").oninput = function(){ S.rate = parseFloat(this.value); save();
    this.previousElementSibling.textContent = "Speed · "+S.rate.toFixed(2)+"×"; };
  wireSeg("ap", v => { S.autoplay = v; save(); voiceSheet(); });
  wireSeg("rs", v => { S.readSentence = v; save(); voiceSheet(); });
  if ($("#vtest")) $("#vtest").onclick = function(){ TTS.say("Trời mưa, nhớ mang dù nha."); };
  $("#closeV").onclick = closeSheet;
}
function seg(lbl, k, on){
  return '<div class="field"><label>'+esc(lbl)+'</label><div class="seg">'
    + '<button data-seg="'+k+'" data-v="1" aria-pressed="'+(on?"true":"false")+'">On</button>'
    + '<button data-seg="'+k+'" data-v="0" aria-pressed="'+(!on?"true":"false")+'">Off</button></div></div>';
}
function wireSeg(k, cb){ $$('[data-seg="'+k+'"]').forEach(b => b.onclick = function(){ cb(b.dataset.v === "1"); }); }

function runEngineSelfTests(){
  const results=[]; function test(name,fn){try{fn();results.push({name:name,ok:true});}catch(e){results.push({name:name,ok:false,error:e.message});}}
  const oldMode=S.writingMode; S.writingMode="learning";
  test("Exact tone spelling",()=>{if(classifyTypedAnswer("má","má").outcome!=="exact")throw new Error("má should be exact");});
  test("Missing tone is accepted partial",()=>{const g=classifyTypedAnswer("ma","má");if(g.outcome!=="tone_missing"||!g.skillCorrect)throw new Error("ma → má should be accepted tone-missing");});
  test("Wrong tone remains distinct",()=>{if(classifyTypedAnswer("má","mà").outcome!=="wrong_tone")throw new Error("wrong tone misclassified");});
  test("Vietnamese vowel identity is preserved",()=>{if(classifyTypedAnswer("toi","tôi").outcome==="tone_missing")throw new Error("ô cannot be treated as a missing tone");});
  test("đ is a real letter",()=>{if(classifyTypedAnswer("di","đi").outcome==="tone_missing")throw new Error("đ/d cannot be treated as tone-only");});
  test("Southern hỏi/ngã merger is identified",()=>{const g=classifyTypedAnswer("nghỉ","nghĩ");if(!g.southernMerge)throw new Error("hỏi/ngã merger not detected");});
  test("Seven-second retrieval boundary",()=>{if(bandFromMs(6999)==="slow retrieval"||bandFromMs(7001)!=="slow retrieval")throw new Error("7s boundary wrong");});
  test("Per-skill schedules stay independent",()=>{const r=ensureReviewRecord({});r.skills.recognition.due=Date.now()+10*DAY;r.skills.listening.due=Date.now()-1;if(!(r.skills.listening.due<r.skills.recognition.due))throw new Error("skill schedules coupled");});
  test("Generated custom word IDs survive row reordering",()=>{const d="2099-01-01",a=normalizeLessonPack({lesson:{date:d,title:"ID test"},vocabulary:[{vi:"từ alpha",en:"a"},{vi:"từ beta",en:"b"}]}),b=normalizeLessonPack({lesson:{date:d,title:"ID test"},vocabulary:[{vi:"từ beta",en:"b"},{vi:"từ alpha",en:"a"}]});const ma=Object.fromEntries(a.vocabulary.map(x=>[x.vi,x.id])),mb=Object.fromEntries(b.vocabulary.map(x=>[x.vi,x.id]));if(ma["từ alpha"]!==mb["từ alpha"]||ma["từ beta"]!==mb["từ beta"])throw new Error("IDs depend on row order");});
  S.writingMode=oldMode;
  return {ok:results.every(x=>x.ok),results:results};
}
function engineTestSheet(){
  const r=runEngineSelfTests();
  openSheet('<div class="eyebrow">Learning engine</div><h2 class="sheet-h">Self-tests</h2>'
    +'<div class="'+(r.ok?'ok-note':'warn')+'">'+(r.ok?'All '+r.results.length+' checks passed.':'One or more checks failed.')+'</div>'
    +r.results.map(x=>'<div class="rrow"><span class="rt">'+(x.ok?'PASS':'FAIL')+'</span><span class="rv">'+esc(x.name)+(x.error?'<br><span class="bad">'+esc(x.error)+'</span>':'')+'</span></div>').join('')
    +'<div class="next-row" style="margin-top:18px"><button class="btn" id="closeTests">Close</button></div>');
  $("#closeTests").onclick=closeSheet;
}

function navMoreSheet(){
  const secondary = NAV.filter(n=>!n.primary);
  openSheet('<div class="eyebrow">More</div><h2 class="sheet-h">Practice & library</h2>'
    + '<div class="more-nav-grid">' + secondary.map(n => '<button class="more-nav-item" data-more-view="'+n.id+'"><span class="more-nav-glyph">'+esc(n.glyph)+'</span><span><b>'+esc(n.label)+'</b><small>'
      + (n.id==="speak"?"Shadowing and conversation":n.id==="weaknesses"?"Repair active weak spots":n.id==="words"?"Search the vocabulary":n.id==="content"?"Add weekly class material":"Learning evidence and reports")
      + '</small></span></button>').join('') + '</div>'
    + '<div class="next-row" style="margin-top:18px"><button class="btn ghost" id="closeMore">Close</button></div>');
  $$("[data-more-view]").forEach(b=>b.onclick=function(){const v=b.dataset.moreView;closeSheet();go(v);});
  $("#closeMore").onclick=closeSheet;
}

function settingsSheet(){
  const n=storeNote();
  openSheet('<div class="eyebrow">Settings</div><h2 class="sheet-h">Learning engine</h2>'
    +'<div class="field"><label>Daily target · '+S.dailyMinutes+' minutes</label><input type="range" id="dm" min="5" max="40" step="1" value="'+S.dailyMinutes+'"></div>'
    +seg("Southern mode","sm",S.southernMode)
    +'<div class="hint" style="margin-top:8px">Southern listening and vocabulary receive priority; standard written forms stay visible.</div>'
    +'<div class="field"><label>Writing feedback</label><select id="wm"><option value="learning"'+(S.writingMode==="learning"?' selected':'')+'>Learning mode — missing tones are accepted, then repaired</option><option value="strict"'+(S.writingMode==="strict"?' selected':'')+'>Strict writing — full standard spelling required</option></select></div>'
    +'<div class="field"><label>New items per day · '+S.newPerDay+'</label><input type="range" id="nipd" min="0" max="15" step="1" value="'+S.newPerDay+'"></div>'
    +'<div class="field"><label>Scheduling model</label><div class="hint" style="line-height:1.75">Recognition, recall, context, listening and production have independent intervals and due dates. Reading allowance is removed before retrieval speed is judged. Listening timing begins after audio ends. Translation and free writing record response time for analytics but are not penalized for slow typing. A correct slow answer strengthens knowledge and separately records lower fluency.</div></div>'
    +'<div class="field"><label>Reading calibration</label><div class="hint">Current reading allowance factor: '+((S.readingCalibration&&S.readingCalibration.factor)||1).toFixed(2)+'× · '+((S.readingCalibration&&S.readingCalibration.samples||[]).length)+' calibration samples. After 10 clean reading-heavy responses the allowance adapts conservatively to your own pace.</div></div>'
    +'<div class="field"><label>Where progress lives</label><div class="'+n.cls+'">'+n.txt+'</div></div>'
    +'<div class="field"><label>Progress-only backup</label><textarea class="box" id="dump" spellcheck="false">'+esc(JSON.stringify(S))+'</textarea><div class="next-row"><button class="btn ghost" id="copyD">Copy</button><button class="btn ghost" id="loadD">Restore progress</button><button class="btn ghost" id="openContent">Course content</button><button class="btn ghost" id="engineTests">Run engine self-tests</button></div></div>'
    +'<div class="next-row" style="margin-top:18px"><button class="btn ghost" id="reset">Reset progress</button><button class="btn" id="closeS">Close</button></div>');
  $("#dm").oninput=function(){ S.dailyMinutes=parseInt(this.value,10); save(); this.previousElementSibling.textContent="Daily target · "+S.dailyMinutes+" minutes"; };
  wireSeg("sm",v=>{S.southernMode=v;save();settingsSheet();});
  $("#wm").onchange=function(){S.writingMode=this.value;save();};
  $("#nipd").oninput=function(){S.newPerDay=parseInt(this.value,10);save();this.previousElementSibling.textContent="New items per day · "+S.newPerDay;};
  $("#copyD").onclick=function(){const t=$("#dump");t.select();try{navigator.clipboard.writeText(t.value);}catch(e){try{document.execCommand("copy");}catch(e2){}}this.textContent="Copied";};
  $("#loadD").onclick=function(){try{const o=JSON.parse($("#dump").value);if(!o||!o.rev)throw new Error("shape");S=Object.assign(S,o);migrateStateInPlace();save();closeSheet();go("today");}catch(e){this.textContent="Not a valid progress backup";}};
  $("#openContent").onclick=function(){closeSheet();go("content");};
  $("#engineTests").onclick=engineTestSheet;
  $("#reset").onclick=function(){if(!confirm("Clear every review record, note and mistake? Course content is kept."))return;S.rev={};S.concept={};S.mistakes=[];S.repairs=[];S.notes={};S.log=[];S.diag=[];S.xp=0;S.streak=0;S.streakDay=null;save();closeSheet();go("today");};
  $("#closeS").onclick=closeSheet;
}

/* timing guards */
document.addEventListener("visibilitychange",function(){
  if(!CURRENT_TIMING) return;
  if(document.visibilityState==="hidden"){ if(!CURRENT_TIMING.hiddenStartedAt) CURRENT_TIMING.hiddenStartedAt=Date.now(); }
  else if(CURRENT_TIMING.hiddenStartedAt){ CURRENT_TIMING.hiddenTimeMs+=Date.now()-CURRENT_TIMING.hiddenStartedAt; CURRENT_TIMING.hiddenStartedAt=0; }
});
document.addEventListener("input",function(e){ if(e.target&&e.target.classList&&e.target.classList.contains("type")) markTimingInteraction("key"); });
document.addEventListener("pointerdown",function(e){
  if(!CURRENT_TIMING||askAnswered) return; const t=e.target.closest&&e.target.closest(".opt,.tile,.slot,#tgo");
  if(t) markTimingInteraction(t.id==="tgo"?"submit":"choice");
});

/* ── boot ─────────────────────────────────────────────────────────────── */
document.addEventListener("keydown", function(e){
  const t = e.target;
  if (t && (t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA")) return;
  if ($("#scrim").classList.contains("open")){ if (e.key==="Escape") closeSheet(); return; }
  if (keyHandler) keyHandler(e);
});
$("#scrim").onclick = function(e){ if (e.target === $("#scrim")) closeSheet(); };
$("#voiceBtn").onclick = voiceSheet;
$("#setBtn").onclick = settingsSheet;
$("#nav").innerHTML = NAV.map(function(n){
  return '<button class="'+(n.primary?'primary-mobile':'secondary-mobile')+'" data-v="'+n.id+'" aria-selected="'+(n.id==="today")+'"><span class="nav-glyph">'+esc(n.glyph)+'</span><span class="nav-label">'+esc(n.label)+'</span></button>';
}).join("") + '<button id="moreNav" aria-selected="false"><span class="nav-glyph">•••</span><span class="nav-label">More</span></button>';
$$("#nav button[data-v]").forEach(b => b.onclick = function(){ go(b.dataset.v); });
$("#moreNav").onclick = navMoreSheet;

(async function init(){
  await load();
  await loadCustomContent();
  TTS.refresh();
  go("today");
  setTimeout(function(){ TTS.refresh(); paintStats(); }, 700);
  setTimeout(function(){ TTS.refresh(); paintStats(); }, 2500);
})();
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
