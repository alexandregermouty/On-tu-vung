<script>
/* ═══════════════════════════════════════════════════════════════════════
   COURSE CONTENT — PART 1 · units and concepts
   Source of truth: ALEXANDRE.docx (Alexandre's personal Vietnamese course).
   Rules, examples and terminology are taken from the course. Where the
   course is ambiguous or internally inconsistent, the original is kept and
   flagged with `courseNote` rather than silently corrected.
   No application logic lives in this file.
   ═══════════════════════════════════════════════════════════════════════ */

const UNITS = [
  {id:"u1",  title:"Xưng hô · Pronouns and address",  blurb:"Who you are and who they are, decided by age and relationship."},
  {id:"u2",  title:"Chữ và dấu · Letters, syllables, tones", blurb:"Consonant → vowel → tone, the reading sequence the course teaches."},
  {id:"u3",  title:"Giọng miền Nam · Southern realization", blurb:"What the page says against what a southern mouth does with it."},
  {id:"u4",  title:"Câu · Building a sentence",        blurb:"Word order, thì / là / ở, classifiers, plural markers, negation."},
  {id:"u5",  title:"Trợ từ · Particles and pragmatics", blurb:"nhé, nha, ạ, rồi, đi, mà, đấy — the words that carry the tone of voice."},
  {id:"u6",  title:"Thì · Time and aspect",            blurb:"đã, vừa / mới, đang, sẽ, sắp, chưa, rồi."},
  {id:"u7",  title:"Số và thời gian · Numbers, dates, time", blurb:"Counting, telling the time, days, months, years."},
  {id:"u8",  title:"Động từ · Modals and everyday verbs", blurb:"muốn, có thể, cần, phải, nên and the verbs around them."},
  {id:"u9",  title:"So sánh · Comparison",             blurb:"bằng, như, hơn, nhất, không … bằng."},
  {id:"u10", title:"Từ vựng hằng ngày · Everyday vocabulary", blurb:"The lesson vocabulary, by theme."}
];

/* Each concept carries: the rule as the course states it, examples from the
   course, what it is commonly confused with, and a micro-lesson used when
   the learner fails the concept repeatedly. */
const CONCEPTS = [

/* ── u1 · pronouns ──────────────────────────────────────────────────── */
{id:"c.pron.basic", unit:"u1", title:"Tôi / bạn — the neutral pair", kind:"pragmatics",
 rule:"Tôi is a neutral, polite “I”, used in formal situations or with strangers. Bạn is the matching “you”, for someone of similar age or status, or a stranger.",
 examples:[{vi:"Tôi học tiếng Việt.", en:"I learn Vietnamese."},
           {vi:"Bạn là khách ở đây phải không?", en:"Are you a customer here?"}],
 micro:{rule:"Vietnamese has no single word for I. Tôi is the safe neutral one — it commits you to nothing and offends nobody.",
        examples:[{vi:"Tôi thích đi siêu thị.",en:"I like going to the supermarket."},
                  {vi:"Bạn có bận không?",en:"Are you busy?"}],
        contrast:"Tôi is neutral, not warm. With someone you actually know, the family terms below are what people reach for.",
        check:{q:"You are speaking to a stranger roughly your own age. Which pair?", options:["tôi / bạn","con / ba","em / anh"], answer:0},
        produce:{en:"I am learning Vietnamese.", vi:"Tôi học tiếng Việt."}},
 requires:[]},

{id:"c.pron.family", unit:"u1", title:"Family terms used as pronouns", kind:"pragmatics",
 rule:"Family terms are used as pronouns to show respect, especially with elders. The same word covers I, you and me — position in the sentence decides which.",
 examples:[{vi:"Con đi học về rồi ạ.", en:"I have come back from school.", note:"con = I"},
           {vi:"Mẹ muốn hỏi con gì đó.", en:"Mom wants to ask you something.", note:"con = you"},
           {vi:"Ba mẹ của con yêu con rất nhiều.", en:"My parents love me very much.", note:"con = me"}],
 micro:{rule:"One term, three jobs. Con is I when you speak, you when a parent speaks to you, and me as an object. The word does not change — the slot in the sentence does the work.",
        examples:[{vi:"Con chào bà ạ.",en:"Hello, Grandma."},
                  {vi:"Em đang học tiếng Việt.",en:"I am learning Vietnamese."}],
        contrast:"Con is southern usage with parents and senior relatives. Cháu is the northern habit, and the course notes cháu is not used with your own parents.",
        check:{q:"In “Mẹ muốn hỏi con gì đó”, con means:", options:["I","you","we"], answer:1},
        produce:{en:"I have come back from school. (to your mother)", vi:"Con đi học về rồi ạ."}},
 requires:["c.pron.basic"]},

{id:"c.pron.age", unit:"u1", title:"anh / chị / em — choosing by relative age", kind:"pragmatics",
 rule:"Anh is used by or for an older male, chị by or for an older female, em by or for the younger person. You pick the pair by comparing ages, and the same pair works in both directions.",
 examples:[{vi:"Anh làm việc ở công ty này.", en:"I work at this company.", note:"anh = I, older man speaking"},
           {vi:"Em hỏi anh một chút nhé.", en:"Let me ask you something.", note:"anh = you"},
           {vi:"Chị sống ở Sài Gòn.", en:"I live in Saigon.", note:"chị = I, older woman speaking"}],
 micro:{rule:"Before you can say I, you have to decide who is older. Older male anh, older female chị, younger either em. Both speakers use the same pair, from their own side.",
        examples:[{vi:"Em cảm ơn chị nhiều.",en:"Thank you very much. (younger to older woman)"},
                  {vi:"Anh nhắc em làm bài tập.",en:"I remind you to do your homework."}],
        contrast:"Get this wrong and you are not ungrammatical, you are rude. Asking someone's age early is normal here, not nosy.",
        check:{q:"A woman ten years older than you. You call her:", options:["em","chị","cô"], answer:1},
        produce:{en:"Thank you very much. (to an older woman)", vi:"Em cảm ơn chị nhiều."}},
 requires:["c.pron.basic"]},

{id:"c.pron.plural", unit:"u1", title:"Plural pronouns, formal and casual", kind:"pragmatics",
 rule:"Formal: chúng tôi excludes the listener, chúng ta includes them; họ is a neutral “they”; các bạn / mấy bạn is “you all”. Casual: tụi mình, chúng mình, tụi em for we; người ta and mọi người for they.",
 examples:[{vi:"Tối nay tụi mình ăn cơm cùng nhau.", en:"Tonight we eat together."},
           {vi:"Nếu trời mưa, chúng ta sẽ ở nhà.", en:"If it rains, we will stay home."}],
 courseNote:"The course glosses both chúng tôi and chúng ta as “exclusive”, then explains that chúng ta includes the listener. The explanation, not the label, is what to go by.",
 micro:{rule:"The split that matters: chúng ta takes the person you are talking to with you. Chúng tôi leaves them behind.",
        examples:[{vi:"Chúng ta đi nha.",en:"Let's go. (you are coming)"},
                  {vi:"Chúng tôi đi trước.",en:"We'll go ahead. (you are not)"}],
        contrast:"In the south tụi mình does the everyday work that chúng mình does elsewhere.",
        check:{q:"“Shall we go?” — said to the person you want to bring:", options:["Chúng tôi đi nha?","Chúng ta đi nha?"], answer:1},
        produce:{en:"Tonight we eat together.", vi:"Tối nay tụi mình ăn cơm cùng nhau."}},
 requires:["c.pron.basic"]},

/* ── u2 · sound system ──────────────────────────────────────────────── */
{id:"c.read.sequence", unit:"u2", title:"Reading a syllable: consonant → vowel → tone", kind:"pronunciation",
 rule:"The course reads every Vietnamese syllable in three moves: the initial consonant, then the vowel, then the tone laid over it.",
 examples:[{vi:"m + a → ma", en:"ghost (level tone)"},
           {vi:"m + a + sắc → má", en:"mum"},
           {vi:"m + a + huyền → mà", en:"but, however"}],
 micro:{rule:"Do not read a Vietnamese word as a block. Take the onset, take the vowel, then put the tone on top. The tone is the last decision, not part of the letter.",
        examples:[{vi:"b + an + huyền → bàn",en:"table"},
                  {vi:"c + ao → cao",en:"tall"}],
        contrast:"Six spellings of ma differ only in the third step: ma, má, mà, mả, mã, mạ.",
        check:{q:"Which step carries the tone?", options:["the initial consonant","the vowel","the mark over or under the vowel"], answer:2},
        produce:{en:"Build it: m + a with dấu sắc", vi:"má"}},
 requires:[]},

{id:"c.tones.six", unit:"u2", title:"The six tones", kind:"pronunciation",
 rule:"Ngang (no mark, level), huyền (falling), sắc (rising), hỏi (dipping), ngã (broken rising), nặng (heavy, cut short).",
 examples:[{vi:"ma / mà / má / mả / mã / mạ", en:"ghost / but / mum / tomb / horse / rice seedling"}],
 micro:{rule:"Tone is not decoration. Change the mark and you change the word, not the mood.",
        examples:[{vi:"Xa — far.",en:""},{vi:"Xã — a commune.",en:""}],
        contrast:"In the south hỏi and ngã collapse into one tone, so the six become five in speech but stay six on the page.",
        check:{q:"How many tones does a southern speaker actually produce?", options:["six","five","four"], answer:1},
        produce:{en:"Which tone is on “cẩn”?", vi:"hỏi"}},
 requires:["c.read.sequence"]},

/* ── u3 · southern ──────────────────────────────────────────────────── */
{id:"c.south.consonants", unit:"u3", title:"Southern initial consonants", kind:"pronunciation",
 rule:"The course lists the southern realizations: ch and tr both come out as ch; s and x both as x; v, gi and d all tend to d; qu comes out as w.",
 examples:[{vi:"trời → chời", en:"sky, weather"},
           {vi:"sữa → xữa", en:"milk"},
           {vi:"về → dề", en:"to return"},
           {vi:"quên → wên", en:"to forget"}],
 micro:{rule:"These are not mistakes. The written form stays as it is; the southern mouth simply lands elsewhere. You must read the standard spelling and expect the southern sound.",
        examples:[{vi:"Trứng → chứng",en:"egg"},{vi:"Sách → xách",en:"book"}],
        contrast:"Written tr, s, v, qu · southern spoken ch, x, d, w.",
        check:{q:"You hear “chời”. What is written?", options:["chời","trời","chơi"], answer:1},
        produce:{en:"Write the standard form of what a southerner says as “dề”.", vi:"về"}},
 requires:["c.read.sequence"]},

{id:"c.south.finals", unit:"u3", title:"Southern final consonants", kind:"pronunciation",
 rule:"Final n drifts to ng, and final t drifts to c. The course also notes in becoming inh, and ô before ng opening towards o.",
 examples:[{vi:"ăn → ăng", en:"to eat"},
           {vi:"chân → châng", en:"leg"},
           {vi:"mát → mác", en:"cool"},
           {vi:"hết → hếc", en:"finished"},
           {vi:"bận → bậng", en:"busy"},
           {vi:"chín → chính", en:"nine"}],
 micro:{rule:"The end of the syllable softens. -n slides back to -ng, -t hardens to -c. That is why giặt and giặc, or mắt and mắc, stop being distinguishable by ear.",
        examples:[{vi:"không → khong",en:"no, not"},{vi:"bàn → bàng",en:"table"}],
        contrast:"Two words that differ only in a final -n/-ng or -t/-c are, in southern speech, the same sound. Meaning has to separate them.",
        check:{q:"A southerner says “mác”. The written word could be:", options:["only mác","mát or mác","only mát"], answer:1},
        produce:{en:"Standard spelling of southern “châng”.", vi:"chân"}},
 requires:["c.read.sequence"]},

{id:"c.south.hoinga", unit:"u3", title:"hỏi and ngã merge", kind:"pronunciation",
 rule:"The course records that southern speakers use dấu hỏi only: ngã → ngả, bãi → bải, cũ.",
 examples:[{vi:"nghỉ / nghĩ", en:"to rest / to think — one sound in the south"},
           {vi:"sữa / sửa", en:"milk / to repair"},
           {vi:"rẻ / rẽ", en:"cheap / to turn"}],
 micro:{rule:"Six tones on paper, five in a southern mouth. Anything spelled with ngã is spoken as hỏi.",
        examples:[{vi:"Anh nghỉ một chút.",en:"Rest a little."},{vi:"Anh nghĩ một chút.",en:"Think a little."}],
        contrast:"Your ear cannot separate nghỉ from nghĩ here. The sentence around it has to.",
        check:{q:"“Tôi cần mua sữa” and “Tôi cần sửa xe” — in southern speech the two middle words are:", options:["clearly different","the same sound"], answer:1},
        produce:{en:"milk (not the verb)", vi:"sữa"}},
 requires:["c.tones.six"]},

{id:"c.south.lexicon", unit:"u3", title:"Southern word choices", kind:"lexicon",
 rule:"Southern speech prefers its own everyday words: ba and má for parents, chén for a rice bowl, ly for a glass, dù for an umbrella, coi for to watch, mắc for expensive, xe hơi for a car, trái for a fruit classifier, vô for to enter.",
 examples:[{vi:"Má đang rửa chén ở dưới bếp.", en:"Mom is washing the dishes in the kitchen."},
           {vi:"Cái áo này mắc quá.", en:"This shirt is so expensive."}],
 micro:{rule:"Not accent — different words. A northerner and a southerner naming the same bowl reach for bát and chén.",
        examples:[{vi:"Đem cái ly đó đây cho má.",en:"Bring that glass here for Mom."}],
        contrast:"Careful with ốm: skinny in the south, ill in the north.",
        check:{q:"Southern for “expensive”:", options:["đắt","mắc","rẻ"], answer:1},
        produce:{en:"Mom is washing the dishes.", vi:"Má đang rửa chén."}},
 requires:[]},

{id:"c.south.pronouns", unit:"u3", title:"Contracted southern pronouns", kind:"pragmatics",
 rule:"Southern speech squeezes pronoun + ấy into one syllable with a hỏi tone: anh ấy → ảnh, chị ấy → chỉ, ông ấy → ổng, bà ấy → bả, cô ấy → cổ.",
 examples:[{vi:"Ảnh về nhà sau giờ làm.", en:"He goes home after work."}],
 courseNote:"The course also lists ảnh, ổng, cái thằng and chỉ, bả, ẻm as not respectful in some settings — usable with friends, risky about people you owe deference to.",
 micro:{rule:"Two syllables become one and take a hỏi tone. It is spoken register, not something you would write in an email.",
        examples:[{vi:"Chỉ đi làm rồi.",en:"She has gone to work."}],
        contrast:"chỉ the pronoun is the same spelling as chỉ meaning only; cổ is also the word for neck.",
        check:{q:"ông ấy contracts to:", options:["ổng","ông","ổn"], answer:0},
        produce:{en:"He goes home after work.", vi:"Ảnh về nhà sau giờ làm."}},
 requires:["c.pron.age"]},

/* ── u4 · sentence ──────────────────────────────────────────────────── */
{id:"c.sent.svo", unit:"u4", title:"Subject + verb + object", kind:"grammar",
 rule:"The basic declarative sentence is S + V + O. An adverb such as rất goes between the subject and the verb: S + adverb + V + O.",
 examples:[{vi:"Tôi học tiếng Việt.", en:"I learn Vietnamese."},
           {vi:"Tôi rất thích đi du lịch.", en:"I really like travelling."},
           {vi:"Cô ấy chơi đàn piano.", en:"She plays piano."}],
 micro:{rule:"Same spine as English: who, does, what. The modifiers are where it diverges.",
        examples:[{vi:"Tôi thích xem phim.",en:"I like watching films."}],
        contrast:"English puts very before an adjective; the course notes rất is only ever an adverb in Vietnamese.",
        check:{q:"Where does rất go?", options:["after the verb","between subject and verb","at the end"], answer:1},
        produce:{en:"I really like travelling.", vi:"Tôi rất thích đi du lịch."}},
 requires:[]},

{id:"c.sent.adjafter", unit:"u4", title:"Adjectives follow the noun", kind:"grammar",
 rule:"Adjectives describe nouns and generally follow them — the adjective stands behind the noun.",
 examples:[{vi:"Áo thun này to quá.", en:"This T-shirt is too big."},
           {vi:"Chị ấy mua một cái quần màu đen.", en:"She buys a pair of black pants."}],
 micro:{rule:"Noun first, description after. A black shirt is a shirt black.",
        examples:[{vi:"Con chó này ngoan quá.",en:"This dog is so well-behaved."}],
        contrast:"English: black pants. Vietnamese: quần màu đen.",
        check:{q:"“a new house”:", options:["mới nhà","nhà mới"], answer:1},
        produce:{en:"a black pair of pants", vi:"cái quần màu đen"}},
 requires:["c.sent.svo"]},

{id:"c.sent.la", unit:"u4", title:"LÀ — identity", kind:"grammar",
 rule:"Là is used when the predicate defines or identifies the subject. It goes before nouns and noun phrases and is the closest thing to English is/are/am.",
 examples:[{vi:"Tôi là giáo viên.", en:"I am a teacher."},
           {vi:"Hà Nội là thủ đô của Việt Nam.", en:"Hanoi is the capital of Vietnam."},
           {vi:"Phở là món ăn Việt Nam truyền thống.", en:"Pho is a traditional Vietnamese dish."}],
 micro:{rule:"Là links a subject to a noun. Never to an adjective.",
        examples:[{vi:"Đây là nhà hàng yêu thích của em.",en:"This is my favourite restaurant."}],
        contrast:"Tôi là giáo viên — noun, so là. Tôi cao — adjective, so no là at all.",
        check:{q:"Which is right?", options:["Tôi là cao.","Tôi cao."], answer:1},
        produce:{en:"I am a teacher.", vi:"Tôi là giáo viên."}},
 requires:["c.sent.svo"]},

{id:"c.sent.thi", unit:"u4", title:"THÌ — linking subject and predicate", kind:"grammar",
 rule:"Thì links a subject with what is said about it, and can also mark time. With a plain adjective it is usually optional in speech.",
 examples:[{vi:"Phim thì vui.", en:"The film is fun."},
           {vi:"Phim vui.", en:"The film is fun. (same, without thì)"},
           {vi:"Đồ ăn đường phố rẻ.", en:"Street food is cheap."}],
 courseNote:"The course gives Phim thì vui and Phim vui side by side without ruling one out. Treat thì here as available, not required.",
 micro:{rule:"With adjectives you can simply drop the linking word. Phim hay is a complete sentence.",
        examples:[{vi:"Ngân hàng rất xa.",en:"The bank is very far."},{vi:"Em cao.",en:"I am tall."}],
        contrast:"Adjective → no là. Noun → là.",
        check:{q:"“The bank is very far.”", options:["Ngân hàng là rất xa.","Ngân hàng rất xa."], answer:1},
        produce:{en:"Street food is cheap.", vi:"Đồ ăn đường phố rẻ."}},
 requires:["c.sent.la"]},

{id:"c.sent.o", unit:"u4", title:"Ở — location", kind:"grammar",
 rule:"Ở marks where someone or something is, covering English in, on and at. It can combine with a preposition — ở trên, ở trong, ở gần — for a more specific position. Where English uses a noun phrase, Vietnamese uses this verb structure.",
 examples:[{vi:"Tôi ở nhà.", en:"I am home."},
           {vi:"Con mèo ở trên bàn.", en:"The cat is on the table."},
           {vi:"Chúng ta ở gần công viên.", en:"We are near the park."},
           {vi:"Bạn của em ở rạp phim.", en:"My friends are at the movie theatre."}],
 micro:{rule:"Ở is doing the job of a verb, so there is no separate “to be”.",
        examples:[{vi:"Anh ấy ở trong phòng.",en:"He is in the room."},{vi:"Chị ấy ở trong nhà bếp.",en:"She is in the kitchen."}],
        contrast:"ở trên on top of · ở trong inside · ở gần near.",
        check:{q:"“She is in Hanoi.”", options:["Cô ấy là ở Hà Nội.","Cô ấy ở Hà Nội."], answer:1},
        produce:{en:"The cat is on the table.", vi:"Con mèo ở trên bàn."}},
 requires:["c.sent.svo"]},

{id:"c.sent.neg", unit:"u4", title:"Negation — không and không phải là", kind:"grammar",
 rule:"Put không before the verb or adjective. Before a noun predicate the negative of là is không phải là. Chưa before the verb gives “not yet”.",
 examples:[{vi:"Tôi không thấy con chó ở công viên.", en:"I don't see a dog in the park."},
           {vi:"Phim không hay.", en:"The film is not good."},
           {vi:"Tôi chưa ăn.", en:"I haven't eaten yet."}],
 micro:{rule:"One word in front of what you are denying. The only irregular case is a noun predicate, which needs không phải là.",
        examples:[{vi:"Tôi không thích cà phê.",en:"I don't like coffee."}],
        contrast:"không = not. chưa = not yet, and it implies the thing is still expected.",
        check:{q:"“This is not my favourite restaurant.”", options:["Đây không là…","Đây không phải là…"], answer:1},
        produce:{en:"The film is not good.", vi:"Phim không hay."}},
 requires:["c.sent.la"]},

{id:"c.sent.classifier", unit:"u4", title:"Classifiers", kind:"grammar",
 rule:"When a noun is counted or pointed at, it is paired with a classifier. Cái for general objects, con for animals, chiếc for vehicles and clothing, quyển or cuốn for books, tờ for sheets of paper and banknotes, bức for flat things like pictures and letters, quả or trái for round things, người for people, ngôi or căn for houses, toà for tall buildings, bộ for sets, toa for carriages. In spoken Vietnamese the classifier can be skipped.",
 examples:[{vi:"một cái bàn", en:"a table"},
           {vi:"ba con mèo", en:"three cats"},
           {vi:"một quyển sách", en:"one book"},
           {vi:"hai trái cam", en:"two oranges"},
           {vi:"một tờ tiền", en:"a banknote"}],
 courseNote:"The course warns not to use bức for money — a banknote takes tờ.",
 micro:{rule:"Number, then classifier, then noun. The classifier is chosen by what kind of thing it is, not by the number.",
        examples:[{vi:"hai cái ghế",en:"two chairs"},{vi:"một chiếc xe máy",en:"one motorbike"}],
        contrast:"con for anything alive, cái for anything not.",
        check:{q:"three cats:", options:["ba cái mèo","ba con mèo","ba quyển mèo"], answer:1},
        produce:{en:"one book", vi:"một quyển sách"}},
 requires:["c.sent.svo"]},

{id:"c.sent.plural", unit:"u4", title:"Plural markers — những, các, mọi", kind:"grammar",
 rule:"Những marks some particular ones of a group; các marks all of them; mọi means every. A bare noun can already be plural from context.",
 examples:[{vi:"những con mèo", en:"the cats (certain ones)"},
           {vi:"các học sinh", en:"all the students"},
           {vi:"mọi người", en:"everyone"},
           {vi:"Tôi có bạn.", en:"I have friends. (plural understood)"}],
 micro:{rule:"Vietnamese nouns do not change shape for plural. A marker is added only when the group needs pointing at.",
        examples:[{vi:"những người bạn",en:"the friends"},{vi:"mọi học sinh",en:"every student"}],
        contrast:"các sweeps up the whole set; những picks out a subset.",
        check:{q:"“all the students”:", options:["những học sinh","các học sinh"], answer:1},
        produce:{en:"everyone", vi:"mọi người"}},
 requires:["c.sent.classifier"]},

{id:"c.sent.yesno", unit:"u4", title:"Yes/no questions and how to answer", kind:"grammar",
 rule:"A closed question is built with có … không or ends in hả or phải không. To say yes: dạ is the polite southern yes, vâng the northern one, đúng rồi means that's right, có confirms that something exists, ừ or ờ is a casual yeah. To say no: dạ không politely, không casually, không phải for that's not so.",
 examples:[{vi:"Bạn có bận không?", en:"Are you busy?"},
           {vi:"Bạn là giáo viên hả? → Đúng rồi.", en:"Are you a teacher? → That's right."},
           {vi:"Ở đây có nhà hàng không? → Có.", en:"Is there a restaurant here? → Yes, there is."},
           {vi:"Em cần giúp không? → Dạ không.", en:"Do you need help? → No, thank you."}],
 micro:{rule:"There is no single word for yes. You pick the one that matches what is being asked — existence, identity, or agreement.",
        examples:[{vi:"Em muốn đi ăn không? → Ừ, đi.",en:"Want to go eat? → Yeah, let's go."}],
        contrast:"Dạ is the southern politeness marker and the course calls it very common in the south.",
        check:{q:"“Is there a restaurant here?” — the natural yes is:", options:["Đúng rồi.","Có.","Dạ."], answer:1},
        produce:{en:"Are you busy?", vi:"Bạn có bận không?"}},
 requires:["c.sent.neg"]},

{id:"c.sent.conj", unit:"u4", title:"Paired conjunctions", kind:"grammar",
 rule:"Some conjunctions come in fixed pairs: vừa … vừa … for two things at once, không những … mà còn … for not only but also, nếu … thì … for if then, tuy … nhưng … for although, càng … càng … for the more the more, vì … nên … for because so.",
 examples:[{vi:"Anh ấy vừa học vừa làm.", en:"He both studies and works."},
           {vi:"Nếu trời mưa, thì chúng ta sẽ ở nhà.", en:"If it rains, then we'll stay home."},
           {vi:"Vì trời mưa, nên chúng tôi ở nhà.", en:"Because it rained, we stayed home."}],
 micro:{rule:"Both halves have to appear. Dropping the second one leaves the sentence hanging.",
        examples:[{vi:"Tuy trời lạnh, nhưng cô ấy vẫn đi dạo.",en:"Although it's cold, she still goes for a walk."}],
        contrast:"English drops the second half — “Because it rained, we stayed home” — Vietnamese keeps nên.",
        check:{q:"Complete: Vì trời mưa, ___ chúng tôi ở nhà.", options:["thì","nên","mà"], answer:1},
        produce:{en:"If it rains, then we'll stay home.", vi:"Nếu trời mưa, thì chúng ta sẽ ở nhà."}},
 requires:["c.sent.svo"]},

/* ── u5 · particles ─────────────────────────────────────────────────── */
{id:"c.part.nhe", unit:"u5", title:"Nhé and nha", kind:"pragmatics",
 rule:"Nhé softens a sentence into a gentle suggestion, request or encouragement — roughly okay? or alright? The course marks it as more formal than nha and usable at work. Nha does the same job in a warmer, more casual register, among close friends and family.",
 examples:[{vi:"Đi cẩn thận nhé!", en:"Be careful, okay?"},
           {vi:"Làm bài tập nhé!", en:"Do your homework, alright?"},
           {vi:"Giúp mình một chút nha!", en:"Help me a bit, okay?"},
           {vi:"Đi uống bia với mình nha!", en:"Let's go for a drink!"}],
 micro:{rule:"Both turn an order into an invitation. Nhé is the one you can send to a colleague; nha is for people you are fond of.",
        examples:[{vi:"Lặp lại nhé.",en:"Repeat, please."},{vi:"Đợi một chút nha.",en:"Wait a little."}],
        contrast:"nhé — polite, neutral, workplace-safe · nha — warm, southern, familiar.",
        check:{q:"Messaging a colleague you barely know:", options:["nhé","nha"], answer:0},
        produce:{en:"Be careful, okay?", vi:"Đi cẩn thận nhé!"}},
 requires:[]},

{id:"c.part.a", unit:"u5", title:"Ạ and dạ", kind:"pragmatics",
 rule:"Ạ shows respect or politeness towards someone older or higher in status, and the course notes it needs to sit inside a sentence or attached to a word. Dạ is the deferential yes.",
 examples:[{vi:"Con chào bà ạ!", en:"Hello, Grandma!"},
           {vi:"Dạ, vâng ạ!", en:"Yes, ma'am/sir!"},
           {vi:"Con đi học về rồi ạ.", en:"I have come back from school."}],
 micro:{rule:"One syllable at the end and the whole sentence becomes respectful. Leaving it off with an elder sounds blunt.",
        examples:[{vi:"Dạ không.",en:"No, thank you."}],
        contrast:"ạ ends a sentence · dạ opens an answer.",
        check:{q:"Greeting your partner's grandmother:", options:["Con chào bà.","Con chào bà ạ."], answer:1},
        produce:{en:"Hello, Grandma!", vi:"Con chào bà ạ!"}},
 requires:["c.pron.family"]},

{id:"c.part.roi", unit:"u5", title:"Rồi — already", kind:"pragmatics",
 rule:"Rồi adds finality or reassurance: the thing is done. It can stand alone only in a casual situation, and can be used to calm someone or confirm something is under control.",
 examples:[{vi:"Xong rồi!", en:"It's done!"},
           {vi:"Em biết rồi!", en:"I know already!"},
           {vi:"Con làm xong bài tập rồi.", en:"I've finished my homework."}],
 micro:{rule:"Rồi closes the action off. It sits at the end and often makes đã unnecessary.",
        examples:[{vi:"Anh đi siêu thị rồi.",en:"I already went to the supermarket."}],
        contrast:"Bạn ăn cơm chưa? → Rồi means yes, I have. → Chưa means not yet.",
        check:{q:"“Have you eaten?” — you have. You answer:", options:["Chưa.","Rồi."], answer:1},
        produce:{en:"It's done!", vi:"Xong rồi!"}},
 requires:[]},

{id:"c.part.di", unit:"u5", title:"Đi — go on, do it", kind:"pragmatics",
 rule:"Đi urges someone to do something, a gentle push or a note of insistence. The course adds that a bare verb before đi makes it an order.",
 examples:[{vi:"Ăn đi!", en:"Eat it!"},
           {vi:"Nói đi!", en:"Say it! / Go ahead."},
           {vi:"Làm đi!", en:"Do it!"},
           {vi:"Em thử món này đi.", en:"Try this dish."}],
 micro:{rule:"Đi at the end of a verb pushes the listener into action. Softened with nha it becomes friendly rather than bossy.",
        examples:[{vi:"Đi ăn đi!",en:"Let's go eat!"}],
        contrast:"đi as a main verb means to go; đi at the end of a clause is the push.",
        check:{q:"In “Ăn đi!”, đi means:", options:["to go","go on, do it"], answer:1},
        produce:{en:"Try this dish.", vi:"Em thử món này đi."}},
 requires:[]},

{id:"c.part.ma", unit:"u5", title:"Mà, đấy, cơ, chứ", kind:"pragmatics",
 rule:"Mà insists on something already said. Đấy points at something and can mean that. Cơ, which the course marks as not common, adds emphatic preference. Chứ confirms with conviction — of course.",
 examples:[{vi:"Mình nói rồi mà!", en:"I already told you!"},
           {vi:"Đấy, tôi đã nói mà!", en:"See, I told you!"},
           {vi:"Đắt cơ!", en:"It's really expensive!"},
           {vi:"Mình phải đi chứ!", en:"I have to go, of course!"}],
 micro:{rule:"These carry attitude, not information. They are how you sound like a person rather than a textbook.",
        examples:[{vi:"Không phải vậy mà!",en:"It's not like that!"},{vi:"Đương nhiên là đúng chứ!",en:"Of course it's correct!"}],
        contrast:"mà pushes back · chứ affirms · đấy points.",
        check:{q:"Which one insists on something you already said?", options:["chứ","mà","đi"], answer:1},
        produce:{en:"I already told you!", vi:"Mình nói rồi mà!"}},
 requires:["c.part.roi"]},

{id:"c.part.south", unit:"u5", title:"Southern particles — nghen, nè, hả", kind:"pragmatics",
 rule:"Nghen softens a sentence and signals closeness and intimacy — the course calls this the most common use. Nè calls attention, like hey. Hả turns a statement into a question, often with a note of checking.",
 examples:[{vi:"Bạn đang tìm gì đó hả?", en:"Are you looking for something?"},
           {vi:"Bạn là nhân viên ở đây hả?", en:"Are you staff here?"}],
 micro:{rule:"These are the southern conversation textures. Hả in particular is everywhere in Saigon speech.",
        examples:[{vi:"Bây giờ là mùa hè hả?",en:"It's summer now, isn't it?"}],
        contrast:"phải không is the neutral tag; hả is its casual southern cousin.",
        check:{q:"Casual southern way to turn a statement into a question:", options:["phải không","hả"], answer:1},
        produce:{en:"Are you staff here?", vi:"Bạn là nhân viên ở đây hả?"}},
 requires:["c.sent.yesno"]},

/* ── u6 · aspect ────────────────────────────────────────────────────── */
{id:"c.asp.da", unit:"u6", title:"ĐÃ — past", kind:"grammar",
 rule:"Đã goes before the verb for an action that took place in the past. When completion is emphasised it pairs with rồi at the end of the sentence. In spoken Vietnamese đã is usually skipped.",
 examples:[{vi:"Tôi đã ăn sáng.", en:"I ate breakfast."},
           {vi:"Tôi ăn sáng rồi.", en:"I have eaten breakfast already."},
           {vi:"Anh đã đi siêu thị rồi.", en:"I went to the supermarket already."},
           {vi:"Em đi siêu thị hôm qua.", en:"I went to the supermarket yesterday."}],
 micro:{rule:"The past is usually carried by a time word or by rồi, not by đã. Saying đã in every past sentence marks you as a textbook speaker.",
        examples:[{vi:"Em thức dậy sớm sáng nay.",en:"I woke up early this morning."}],
        contrast:"đã before the verb · rồi at the end · and in speech, often neither.",
        check:{q:"Most natural spoken Vietnamese for “I already went”:", options:["Tôi đã đi.","Tôi đi rồi."], answer:1},
        produce:{en:"I went to the supermarket yesterday.", vi:"Em đi siêu thị hôm qua."}},
 requires:["c.sent.svo"]},

{id:"c.asp.moi", unit:"u6", title:"VỪA / MỚI / VỪA MỚI — have just", kind:"grammar",
 rule:"Vừa, mới or vừa mới before the verb means the action has only just been completed.",
 examples:[{vi:"Ông ấy mới đến.", en:"He has just arrived."},
           {vi:"Tôi mới ăn bữa sáng.", en:"I just had breakfast."},
           {vi:"Tôi vừa mới thức dậy.", en:"I just woke up."}],
 micro:{rule:"Same slot as đã, tighter window. Minutes ago, not yesterday.",
        examples:[{vi:"Em vừa gọi cho bạn của em.",en:"I've just called my friend."}],
        contrast:"đã — at some point in the past · mới — a moment ago.",
        check:{q:"“He has just arrived.”", options:["Ông ấy đã đến.","Ông ấy mới đến."], answer:1},
        produce:{en:"I just woke up.", vi:"Tôi vừa mới thức dậy."}},
 requires:["c.asp.da"]},

{id:"c.asp.dang", unit:"u6", title:"ĐANG — in progress", kind:"grammar",
 rule:"Đang before the verb is the English -ing: the action is happening now.",
 examples:[{vi:"Ba đang nghỉ ngơi.", en:"Dad is resting."},
           {vi:"Má đang rửa chén ở dưới bếp.", en:"Mom is washing the dishes in the kitchen."},
           {vi:"Em đang học tiếng Việt.", en:"I am learning Vietnamese."}],
 micro:{rule:"One word in front of the verb and it becomes live, right now.",
        examples:[{vi:"Bạn đang tìm gì đó hả?",en:"Are you looking for something?"}],
        contrast:"đang now · đã before · sẽ later.",
        check:{q:"“Dad is resting.”", options:["Ba nghỉ ngơi rồi.","Ba đang nghỉ ngơi."], answer:1},
        produce:{en:"I am learning Vietnamese.", vi:"Em đang học tiếng Việt."}},
 requires:["c.asp.da"]},

{id:"c.asp.se", unit:"u6", title:"SẼ and SẮP — future and about to", kind:"grammar",
 rule:"Sẽ before the verb is will or going to, and the course notes it can be skipped in speech. Sắp means about to, on the point of.",
 examples:[{vi:"Nếu trời mưa, chúng ta sẽ ở nhà.", en:"If it rains, we will stay home."},
           {vi:"Trời sắp mưa.", en:"It's about to rain."},
           {vi:"Mẹ sẽ làm danh sách mua đồ trước.", en:"Mom will make a shopping list first."}],
 micro:{rule:"Sẽ is optional once a time word is present. Sắp is not about time, it is about imminence.",
        examples:[{vi:"Trời sắp mưa đó.",en:"It's going to rain."}],
        contrast:"sẽ — will, at some point · sắp — any second now.",
        check:{q:"“It's about to rain.”", options:["Trời sẽ mưa.","Trời sắp mưa."], answer:1},
        produce:{en:"It's about to rain.", vi:"Trời sắp mưa."}},
 requires:["c.asp.da"]},

{id:"c.asp.chua", unit:"u6", title:"CHƯA — not yet, and the yet? question", kind:"grammar",
 rule:"Before a verb or adjective, chưa means not yet: S + chưa + verb. At the end of a sentence it makes a question: S + V + O + chưa? The answers are chưa for not yet and rồi for yes, I have. Chưa bao giờ before a verb means never.",
 examples:[{vi:"Tôi chưa ăn.", en:"I haven't eaten yet."},
           {vi:"Em chưa hiểu.", en:"I don't understand yet."},
           {vi:"Bạn ăn cơm chưa?", en:"Have you eaten yet?"},
           {vi:"Anh về nhà chưa?", en:"Have you gone home yet?"},
           {vi:"Tôi chưa bao giờ uống cà phê.", en:"I have never drunk coffee."}],
 micro:{rule:"Position changes the job entirely. Em chưa hiểu is a statement. Em hiểu chưa? is a question.",
        examples:[{vi:"Con ngủ chưa?",en:"Have you gone to bed yet?"},{vi:"Con chưa mệt.",en:"I'm not tired yet."}],
        contrast:"chưa before the verb — not yet · chưa at the end — yet? · không — a flat no.",
        check:{q:"“Have you cleaned the house?”", options:["Con chưa dọn nhà?","Con dọn nhà chưa?"], answer:1},
        produce:{en:"Have you eaten yet?", vi:"Bạn ăn cơm chưa?"}},
 requires:["c.sent.neg","c.part.roi"]},

/* ── u7 · numbers and time ──────────────────────────────────────────── */
{id:"c.num.basic", unit:"u7", title:"Counting, and what changes above twenty", kind:"grammar",
 rule:"One to ten: một, hai, ba, bốn, năm, sáu, bảy, tám, chín, mười. Above twenty, mười becomes mươi and can be dropped in speech — hai mươi hai shortens to hai hai. A one in the units place above twenty becomes mốt: hai mươi mốt.",
 examples:[{vi:"hai mươi mốt", en:"21"},
           {vi:"ba mươi ba → ba ba", en:"33, spoken short"},
           {vi:"mười người", en:"ten people"}],
 micro:{rule:"The awkward part is the unit digit: 1 becomes mốt, and the tens word contracts in speech.",
        examples:[{vi:"hai mươi hai → hai hai",en:"22"}],
        contrast:"mười ten · mươi the tens multiplier above twenty.",
        check:{q:"21 is:", options:["hai mươi một","hai mươi mốt"], answer:1},
        produce:{en:"ten people", vi:"mười người"}},
 requires:["c.sent.classifier"]},

{id:"c.num.age", unit:"u7", title:"Asking age", kind:"pragmatics",
 rule:"Pronoun + bao nhiêu tuổi? for anyone; pronoun + mấy tuổi? for children.",
 examples:[{vi:"Bạn bao nhiêu tuổi?", en:"How old are you?"},
           {vi:"Con mấy tuổi?", en:"How old are you? (to a child)"}],
 micro:{rule:"Asking age is not rude here — it is how you work out which pronouns to use.",
        examples:[{vi:"Bạn có bao nhiêu anh chị em?",en:"How many siblings do you have?"}],
        contrast:"mấy expects a small number; bao nhiêu is open.",
        check:{q:"Asking an adult their age:", options:["Anh mấy tuổi?","Anh bao nhiêu tuổi?"], answer:1},
        produce:{en:"How old are you?", vi:"Bạn bao nhiêu tuổi?"}},
 requires:["c.num.basic","c.pron.age"]},

{id:"c.time.clock", unit:"u7", title:"Telling the time", kind:"grammar",
 rule:"Number + giờ gives the hour. Bây giờ là mấy giờ? or Mấy giờ rồi? asks what time it is. Rưỡi is half past, kém is to.",
 examples:[{vi:"Bây giờ là mấy giờ?", en:"What time is it now?"},
           {vi:"Mấy giờ rồi?", en:"What time is it?"},
           {vi:"Em về nhà lúc 5 giờ.", en:"I go home at 5 o'clock."},
           {vi:"7 giờ rưỡi hay 8 giờ kém.", en:"Half past seven or just before eight."}],
 micro:{rule:"Lúc marks the time something happens. Rồi at the end of the question is what makes it sound natural.",
        examples:[{vi:"Ngày mai tôi có buổi họp lúc 9 giờ sáng.",en:"I have a meeting at 9 a.m. tomorrow."}],
        contrast:"rưỡi half past · kém to.",
        check:{q:"“What time is it?” most naturally:", options:["Mấy giờ?","Mấy giờ rồi?"], answer:1},
        produce:{en:"I go home at 5 o'clock.", vi:"Em về nhà lúc 5 giờ."}},
 requires:["c.num.basic"]},

{id:"c.time.buoi", unit:"u7", title:"Parts of the day", kind:"lexicon",
 rule:"Buổi sáng morning, buổi trưa midday, buổi chiều afternoon, buổi tối evening. Ăn trưa is to have lunch, ăn tối to have dinner, ăn cơm covers either.",
 examples:[{vi:"Em ăn cơm chưa?", en:"Have you eaten yet?"},
           {vi:"Em ăn trưa rồi, em không ăn tối hôm nay.", en:"I've had lunch, I'm not having dinner today."},
           {vi:"Tối nay tụi mình ăn cơm cùng nhau.", en:"Tonight we eat together."}],
 micro:{rule:"Buổi + the part of the day. The meal words are built the same way, from ăn plus the time.",
        examples:[{vi:"Ba hiếm khi uống cà phê buổi tối.",en:"Dad rarely drinks coffee in the evening."}],
        contrast:"ăn cơm literally to eat rice, used for any main meal.",
        check:{q:"buổi chiều is:", options:["morning","afternoon","evening"], answer:1},
        produce:{en:"Have you eaten yet?", vi:"Em ăn cơm chưa?"}},
 requires:[]},

/* ── u8 · modals ────────────────────────────────────────────────────── */
{id:"c.mod.core", unit:"u8", title:"Modal verbs sit in front of the verb", kind:"grammar",
 rule:"Muốn to want, có thể can, cần to need, phải must, nên should — all are placed before another verb. The negatives are không muốn, không thể, không cần, không phải, không nên.",
 examples:[{vi:"Tôi muốn xem phim đó.", en:"I want to watch that movie."},
           {vi:"Bạn tôi có thể nói tiếng Pháp.", en:"My friend can speak French."},
           {vi:"Tôi cần nói chuyện với anh.", en:"I need to talk to you."},
           {vi:"Anh phải làm lại bài này.", en:"You must do this drill again."},
           {vi:"Quyển sách này hay lắm. Anh nên đọc.", en:"This book is very good. You should read it."}],
 micro:{rule:"The modal never moves. Subject, modal, verb, object — in that order, every time.",
        examples:[{vi:"Em muốn uống cà phê.",en:"I want to drink coffee."},{vi:"Chị ấy cần nghỉ ngơi.",en:"She needs to rest."}],
        contrast:"Tôi muốn đi is right. Tôi đi muốn is not a sentence.",
        check:{q:"Which is right?", options:["Tôi uống muốn cà phê.","Tôi muốn uống cà phê."], answer:1},
        produce:{en:"I want to drink coffee.", vi:"Tôi muốn uống cà phê."}},
 requires:["c.sent.svo"]},

{id:"c.mod.canphai", unit:"u8", title:"cần phải — stacking for necessity", kind:"grammar",
 rule:"Cần may combine with phải to emphasise the necessity: cần + phải + verb.",
 examples:[{vi:"Tôi cần phải nói chuyện với anh ngay bây giờ.", en:"I really need to talk to you right now."},
           {vi:"Tôi cần phải đi làm bây giờ.", en:"I need to go to work right now."}],
 micro:{rule:"Cần comes first. The order is fixed.",
        examples:[{vi:"Em cần phải học mỗi ngày.",en:"I really need to study every day."}],
        contrast:"cần phải, never phải cần.",
        check:{q:"Correct order:", options:["phải cần đi","cần phải đi"], answer:1},
        produce:{en:"I need to go to work right now.", vi:"Tôi cần phải đi làm bây giờ."}},
 requires:["c.mod.core"]},

{id:"c.mod.bi", unit:"u8", title:"bị and được", kind:"grammar",
 rule:"Bị introduces something unwanted happening to the subject; được introduces something welcome. Bị commonly pairs with đau and bệnh.",
 examples:[{vi:"Tôi bị đau chân sau khi chạy.", en:"My legs hurt after running."},
           {vi:"Tôi không khỏe, tôi đang bị bệnh.", en:"I don't feel well, I'm sick."},
           {vi:"Tay tôi bị đau vì tôi nấu ăn cả buổi.", en:"My hands hurt because I cooked all morning."}],
 micro:{rule:"The choice encodes how you feel about what happened, not the grammar of the verb.",
        examples:[{vi:"Em bị đau tay.",en:"My hand hurts."}],
        contrast:"bị — bad for you · được — good for you.",
        check:{q:"“My legs hurt.”", options:["Tôi được đau chân.","Tôi bị đau chân."], answer:1},
        produce:{en:"I'm sick.", vi:"Em bị bệnh."}},
 requires:["c.sent.svo"]},

{id:"c.mod.wear", unit:"u8", title:"mặc and đeo", kind:"lexicon",
 rule:"Mặc is used for clothes; đeo for shoes, glasses and jewellery.",
 examples:[{vi:"Tôi mặc cái áo này vì nó rất đẹp.", en:"I wear this shirt because it's very nice."},
           {vi:"Tôi đeo đôi giày mới hôm nay.", en:"I wear new shoes today."},
           {vi:"Trời lạnh rồi, bạn nên mặc áo khoác.", en:"It's cold now, you should wear a jacket."}],
 micro:{rule:"English has one verb for all of it. Vietnamese splits by what goes on the body and how.",
        examples:[{vi:"Em mặc áo khoác.",en:"I'm wearing a jacket."},{vi:"Em đeo giày.",en:"I'm putting shoes on."}],
        contrast:"mặc — clothes · đeo — shoes, glasses, jewellery.",
        check:{q:"Shoes take:", options:["mặc","đeo"], answer:1},
        produce:{en:"You should wear a jacket.", vi:"Bạn nên mặc áo khoác."}},
 requires:[]},

{id:"c.mod.beforeafter", unit:"u8", title:"trước khi and sau khi", kind:"grammar",
 rule:"Trước khi means before, sau khi means after, and both open their clause rather than trailing it.",
 examples:[{vi:"Trước khi đi ngủ, tôi đánh răng.", en:"Before going to bed, I brush my teeth."},
           {vi:"Sau khi ăn cơm, tôi đi làm.", en:"After eating, I go to work."},
           {vi:"Em đã uống trước khi làm việc.", en:"I had coffee before work."}],
 micro:{rule:"The phrase leads its clause and is followed directly by the verb — no subject needed in between.",
        examples:[{vi:"Nhớ rửa tay trước khi ăn nha.",en:"Remember to wash your hands before eating."}],
        contrast:"trước khi before · sau khi after · and neither ever ends the clause.",
        check:{q:"Which is right?", options:["Ăn cơm sau khi, tôi đi làm.","Sau khi ăn cơm, tôi đi làm."], answer:1},
        produce:{en:"Before going to bed, I brush my teeth.", vi:"Trước khi đi ngủ, tôi đánh răng."}},
 requires:["c.sent.conj"]},

{id:"c.freq.adv", unit:"u8", title:"Frequency words go before the verb", kind:"grammar",
 rule:"Luôn luôn always, thường usually, hay often, thường xuyên regularly, bình thường normally, lâu lâu and thỉnh thoảng sometimes, đôi khi occasionally, hiếm khi seldom, ít khi rarely, không bao giờ never, chưa bao giờ have never. They stand in front of the verb.",
 examples:[{vi:"Mình thường đi ngủ lúc 12 giờ hay 1 giờ.", en:"I usually go to bed at 12 or 1."},
           {vi:"Con luôn luôn mang theo áo khoác khi trời lạnh.", en:"I always bring a jacket when it's cold."},
           {vi:"Ít khi mình ăn sáng.", en:"I rarely eat breakfast."}],
 micro:{rule:"Subject, frequency word, verb. The frequency word never lands after the object.",
        examples:[{vi:"Ba hiếm khi uống cà phê buổi tối.",en:"Dad rarely drinks coffee at night."}],
        contrast:"chưa bao giờ — have never done it · không bao giờ — won't ever do it.",
        check:{q:"Which is right?", options:["Con mang theo luôn luôn áo khoác.","Con luôn luôn mang theo áo khoác."], answer:1},
        produce:{en:"I rarely eat breakfast.", vi:"Ít khi mình ăn sáng."}},
 requires:["c.sent.svo"]},

/* ── u9 · comparison ────────────────────────────────────────────────── */
{id:"c.cmp.equal", unit:"u9", title:"bằng and như — as … as", kind:"grammar",
 rule:"Adjective, adverb or verb + bằng, or + như, expresses as … as. For age the fixed form is bằng tuổi, not tuổi bằng.",
 examples:[{vi:"Hoa cao bằng Mai.", en:"Hoa is as tall as Mai."},
           {vi:"Cái cây này cao như ngôi nhà kia.", en:"This tree is as high as that house."},
           {vi:"Aris bằng tuổi với bạn của bạn.", en:"Aris is the same age as your friend."},
           {vi:"Em gái tôi nặng bằng tôi.", en:"My younger sister is as heavy as me."}],
 micro:{rule:"The adjective comes first, then bằng or như, then what you are comparing to.",
        examples:[{vi:"Cái bút chì này dài bằng cái bút chì kia.",en:"This pencil is as long as that one."}],
        contrast:"For age the word order flips to bằng tuổi — the course is explicit that tuổi bằng is wrong.",
        check:{q:"“Aris is the same age as your friend.”", options:["Aris tuổi bằng…","Aris bằng tuổi…"], answer:1},
        produce:{en:"Hoa is as tall as Mai.", vi:"Hoa cao bằng Mai."}},
 requires:["c.sent.adjafter"]},

{id:"c.cmp.more", unit:"u9", title:"hơn — more than", kind:"grammar",
 rule:"Adjective, adverb or verb + hơn.",
 examples:[{vi:"Ali cao hơn tôi.", en:"Ali is taller than me."},
           {vi:"Ali thông minh hơn tôi.", en:"Ali is more intelligent than me."},
           {vi:"Ali chạy nhanh hơn tôi.", en:"Ali runs faster than me."},
           {vi:"Ali nói tiếng Anh trôi chảy hơn tôi.", en:"Ali speaks English more fluently than me."}],
 micro:{rule:"Hơn follows what it intensifies. It never leads.",
        examples:[{vi:"Hôm nay nóng hơn hôm qua.",en:"Today is hotter than yesterday."}],
        contrast:"Ali cao hơn tôi is right. Ali hơn cao tôi is not.",
        check:{q:"“Ali is taller than me.”", options:["Ali hơn cao tôi.","Ali cao hơn tôi."], answer:1},
        produce:{en:"Ali is taller than me.", vi:"Ali cao hơn tôi."}},
 requires:["c.cmp.equal"]},

{id:"c.cmp.most", unit:"u9", title:"nhất — the most", kind:"grammar",
 rule:"Adjective, adverb or verb + nhất.",
 examples:[{vi:"Linh thì cao nhất lớp tôi.", en:"Linh is the tallest in my class."},
           {vi:"Aris thì lớn tuổi nhất trong phòng này.", en:"Aris is the oldest in this room."},
           {vi:"Đà Nẵng là thành phố nổi tiếng nhất ở Việt Nam.", en:"Da Nang is the most famous city in Vietnam."}],
 micro:{rule:"Same slot as hơn, one step further.",
        examples:[{vi:"Đây là nhà hàng yêu thích nhất của em.",en:"This is my favourite restaurant."}],
        contrast:"hơn compares two · nhất tops the whole group.",
        check:{q:"“the tallest in my class”:", options:["nhất cao lớp tôi","cao nhất lớp tôi"], answer:1},
        produce:{en:"Linh is the tallest in my class.", vi:"Linh cao nhất lớp tôi."}},
 requires:["c.cmp.more"]},

{id:"c.cmp.notas", unit:"u9", title:"không … bằng — not as … as", kind:"grammar",
 rule:"The negative comparison is không + adjective + bằng.",
 examples:[{vi:"Tôi không giỏi bằng bạn.", en:"I am not as good as you."},
           {vi:"Cái này không cao bằng cái kia.", en:"This is not as tall as that."}],
 micro:{rule:"Không wraps around the front, bằng stays behind the adjective.",
        examples:[{vi:"Phim này không hay bằng phim kia.",en:"This film is not as good as that one."}],
        contrast:"không giỏi bằng, not giỏi không bằng.",
        check:{q:"Which is right?", options:["Tôi giỏi không bằng bạn.","Tôi không giỏi bằng bạn."], answer:1},
        produce:{en:"I am not as good as you.", vi:"Tôi không giỏi bằng bạn."}},
 requires:["c.cmp.equal"]}
];


/* V7 COURSE EXPANSION · additional structures explicitly taught in ALEXANDRE.docx.
   Existing IDs stay untouched so all previous learner progress survives. */
CONCEPTS.push(
{id:"c.pron.possessive",unit:"u1",title:"Possession with của",kind:"grammar",
 rule:"Possession is expressed with của + the possessor: của tôi, của anh ấy, của cô ấy, của chúng tôi, của bạn.",
 examples:[{vi:"Chìa khoá của em ở đâu?",en:"Where are my keys?"},{vi:"Ba mẹ của con yêu con rất nhiều.",en:"My parents love me very much."}],
 micro:{rule:"Put của before the possessor.",examples:[{vi:"Công việc của bạn là gì?",en:"What is your job?"}],contrast:"của marks possession; cửa means door.",check:{q:"“my keys”:",options:["chìa khoá của em","chìa khoá em của"],answer:0},produce:{en:"Where are my keys?",vi:"Chìa khoá của em ở đâu?"}},requires:["c.pron.basic"]},

{id:"c.intro.greeting",unit:"u1",title:"Greetings by relationship",kind:"pragmatics",
 rule:"The course distinguishes xin chào for a first meeting/formal situation, dạ + chào + pronoun for older people or high respect, chào + pronoun generally, and chào + name for a peer or younger person.",
 examples:[{vi:"Dạ, chào chị.",en:"Hello. (respectfully)"},{vi:"Con chào bà ạ.",en:"Hello, Grandma."}],
 micro:{rule:"Greeting choice follows the relationship.",examples:[{vi:"Chào bạn.",en:"Hello. (peer)"}],contrast:"xin chào is formal; chào + pronoun is relational everyday speech.",check:{q:"Greeting an older woman politely:",options:["Chào tên thôi.","Dạ, chào chị."],answer:1},produce:{en:"Hello, Grandma.",vi:"Con chào bà ạ."}},requires:["c.pron.age"]},

{id:"c.intro.name",unit:"u1",title:"Asking and giving a name",kind:"grammar",
 rule:"The course gives both Tên + pronoun + là gì? and Pronoun + tên là gì? Answers use Pronoun + tên là … or Tên + pronoun + là …",
 examples:[{vi:"Tên chị là gì?",en:"What is your name?"},{vi:"Em tên là Alexandre.",en:"My name is Alexandre."}],
 micro:{rule:"Tên can lead the question or follow the pronoun.",examples:[{vi:"Bác tên là gì?",en:"What is your name? (to an elder)"}],contrast:"Keep the relationship pronoun inside the name question.",check:{q:"Natural name question:",options:["Tên chị là gì?","Chị gì tên là?"],answer:0},produce:{en:"My name is Alexandre.",vi:"Em tên là Alexandre."}},requires:["c.pron.age"]},

{id:"c.intro.origin",unit:"u1",title:"Origin, nationality and residence",kind:"grammar",
 rule:"The course uses đến từ đâu? for origin, là người nước nào? for nationality, and sống ở đâu? for residence.",
 examples:[{vi:"Bạn đến từ đâu?",en:"Where are you from?"},{vi:"Em là người nước nào?",en:"What nationality are you?"},{vi:"Anh sống ở đâu?",en:"Where do you live?"}],
 micro:{rule:"đến từ = come from; là người + country = nationality; sống ở = live in.",examples:[{vi:"Em đến từ Pháp.",en:"I am from France."},{vi:"Em sống ở Paris.",en:"I live in Paris."}],contrast:"Origin and residence are separate questions.",check:{q:"Ask where someone lives:",options:["Anh đến từ đâu?","Anh sống ở đâu?"],answer:1},produce:{en:"I live in Paris.",vi:"Em sống ở Paris."}},requires:["c.pron.basic","c.sent.o"]},

{id:"c.intro.health",unit:"u1",title:"Asking how someone is",kind:"pragmatics",
 rule:"Pronoun + (có) khoẻ không? asks how someone is. Answer with Pronoun + khoẻ, optionally followed by còn + pronoun? to return the question.",
 examples:[{vi:"Dạ chị có khoẻ không?",en:"How are you?"},{vi:"Anh khoẻ, còn em?",en:"I'm fine, and you?"}],
 micro:{rule:"The pronoun pair remains visible even in a short exchange.",examples:[{vi:"Dạ ba mẹ có khoẻ không?",en:"Are Mom and Dad well?"}],contrast:"có … không frames the adjective question.",check:{q:"Ask an older woman how she is:",options:["Chị khoẻ?","Dạ chị có khoẻ không?"],answer:1},produce:{en:"I'm fine, and you?",vi:"Em khoẻ, còn anh?"}},requires:["c.pron.age","c.sent.yesno"]},

{id:"c.sent.demonstratives",unit:"u4",title:"Demonstratives — này, đây, đó, kia",kind:"grammar",
 rule:"The course uses đây/ở đây for here, đó/đấy for there or that, kia for something farther away, and này for this.",
 examples:[{vi:"Cái này là gì?",en:"What is this?"},{vi:"Cuốn sách đó là của tôi.",en:"That book is mine."},{vi:"Ngôi nhà kia đẹp quá.",en:"That house over there is beautiful."}],
 micro:{rule:"Distance from the speaker matters.",examples:[{vi:"Đó là ba mẹ của tôi.",en:"Those are my parents."}],contrast:"này/đây near · đó moderate · kia farther.",check:{q:"“this one”:",options:["cái này","cái kia"],answer:0},produce:{en:"What is this?",vi:"Cái này là gì?"}},requires:["c.sent.la"]},

{id:"c.sent.quantifiers",unit:"u4",title:"Quantifiers before nouns",kind:"grammar",
 rule:"The course places quantity before the noun: nhiều, vài, một số, một vài, mấy, tất cả, mỗi and others express amount without changing the noun.",
 examples:[{vi:"nhiều con mèo",en:"many cats"},{vi:"vài người bạn",en:"a few friends"},{vi:"một số học sinh",en:"some students"},{vi:"tất cả học sinh",en:"all students"}],
 micro:{rule:"Amount comes first; the noun does not take a plural ending.",examples:[{vi:"mỗi ngày",en:"every day"}],contrast:"Quantifiers express amount; classifiers classify a counted noun.",check:{q:"“a few friends”:",options:["bạn vài người","vài người bạn"],answer:1},produce:{en:"many cats",vi:"nhiều con mèo"}},requires:["c.sent.classifier"]},

{id:"c.sent.have",unit:"u4",title:"Có — have and there is",kind:"grammar",
 rule:"The course uses có for possession and existence. Không có negates it, and có … không? asks whether something exists or is available.",
 examples:[{vi:"Tôi có một quyển sách.",en:"I have a book."},{vi:"Ở đây có nhà hàng không?",en:"Is there a restaurant here?"},{vi:"Họ không có xe hơi.",en:"They do not have a car."}],
 micro:{rule:"Có can mean have or there is depending on the sentence.",examples:[{vi:"Anh ấy có một công việc tốt.",en:"He has a good job."}],contrast:"Identity uses là; possession/existence uses có.",check:{q:"“I have a book.”",options:["Tôi là một quyển sách.","Tôi có một quyển sách."],answer:1},produce:{en:"I have a book.",vi:"Tôi có một quyển sách."}},requires:["c.sent.svo"]},

{id:"c.question.wh",unit:"u4",title:"Open questions — the WH system",kind:"grammar",
 rule:"The 15/09 class groups open questions around gì, ở đâu, khi nào, tại sao/sao, nào, thế nào/làm sao and bao nhiêu/mấy. The question word can remain in the information slot.",
 examples:[{vi:"Em đi đâu?",en:"Where are you going?"},{vi:"Bạn làm gì?",en:"What are you doing?"},{vi:"Thời tiết ở ngoài sao?",en:"How is the weather outside?"}],
 micro:{rule:"Vietnamese often leaves the question word where the missing information belongs.",examples:[{vi:"Chị sống ở đâu?",en:"Where do you live?"}],contrast:"Do not force English WH word order onto every Vietnamese question.",check:{q:"Natural “Where do you live?”",options:["Ở đâu chị sống?","Chị sống ở đâu?"],answer:1},produce:{en:"Where do you live?",vi:"Chị sống ở đâu?"}},requires:["c.sent.svo"]},

{id:"c.question.what",unit:"u4",title:"Gì, cái gì and là gì",kind:"grammar",
 rule:"The course distinguishes gì for actions or missing content, cái gì for a thing, and là gì for definition or identity.",
 examples:[{vi:"Bạn làm gì?",en:"What are you doing?"},{vi:"Đây là cái gì?",en:"What is this?"},{vi:"Công việc của bạn là gì?",en:"What is your job?"}],
 micro:{rule:"Use là gì when the answer is an identity or definition.",examples:[{vi:"Từ này nghĩa là gì?",en:"What does this word mean?"}],contrast:"gì asks for missing content; là gì asks what something is.",check:{q:"“What is your job?”",options:["Công việc của bạn gì?","Công việc của bạn là gì?"],answer:1},produce:{en:"What do you want to eat?",vi:"Em muốn ăn gì?"}},requires:["c.question.wh"]},

{id:"c.question.where",unit:"u4",title:"Ở đâu and đâu — where",kind:"grammar",
 rule:"The course puts ở đâu/đâu most often at the end: Bạn đang ở đâu? Em đi đâu? It can also begin a question such as Ở đâu bán phở?",
 examples:[{vi:"Chị sống ở đâu?",en:"Where do you live?"},{vi:"Siêu thị gần nhất ở đâu?",en:"Where is the nearest supermarket?"},{vi:"Ở đâu bán phở?",en:"Where do they sell phở?"}],
 micro:{rule:"Keep ở đâu in the location slot unless the course pattern deliberately fronts it.",examples:[{vi:"Chúng ta nên gặp nhau ở đâu?",en:"Where should we meet?"}],contrast:"đâu alone works naturally after a movement verb: Em đi đâu?",check:{q:"“Where should we meet?”",options:["Chúng ta nên gặp nhau ở đâu?","Ở đâu chúng ta nên gặp nhau?"],answer:0},produce:{en:"Where is the nearest supermarket?",vi:"Siêu thị gần nhất ở đâu?"}},requires:["c.question.wh","c.sent.o"]},

{id:"c.question.when",unit:"u4",title:"Khi nào, bao giờ, chừng nào — when",kind:"grammar",
 rule:"The 15/09 lesson lists khi nào, bao giờ and chừng nào as ways to ask when.",
 examples:[{vi:"Khi nào em đi?",en:"When are you going?"}],
 micro:{rule:"These ask for a time/date rather than a clock reading.",examples:[{vi:"Bao giờ chị về?",en:"When are you coming back?"}],contrast:"mấy giờ asks what clock time; khi nào/bao giờ ask when.",check:{q:"Ask “when”, not “what time”:",options:["khi nào","mấy giờ"],answer:0},produce:{en:"When are you going?",vi:"Khi nào em đi?"}},requires:["c.question.wh","c.time.clock"]},

{id:"c.question.why",unit:"u4",title:"Tại sao and sao — why",kind:"grammar",
 rule:"The course lists tại sao and sao for why. Sao also appears in conversation such as Sao thức khuya vậy?",
 examples:[{vi:"Sao thức khuya vậy?",en:"Why do you stay up so late?"},{vi:"Tại sao em học tiếng Việt?",en:"Why are you learning Vietnamese?"}],
 micro:{rule:"Tại sao is explicit; sao is shorter and conversational.",examples:[{vi:"Sao vậy?",en:"Why? / What happened?"}],contrast:"sao can also mean how in other structures.",check:{q:"A short conversational “why?”:",options:["sao","ở đâu"],answer:0},produce:{en:"Why are you learning Vietnamese?",vi:"Tại sao em học tiếng Việt?"}},requires:["c.question.wh"]},

{id:"c.question.how",unit:"u4",title:"Sao, thế nào, làm sao, như thế nào — how",kind:"grammar",
 rule:"The 15/09 lesson groups sao, thế nào, làm sao and như thế nào for how and practises weather, feelings, weekends, knowing and doing.",
 examples:[{vi:"Em thấy sao?",en:"How do you feel?"},{vi:"Thời tiết ở ngoài sao?",en:"How is the weather outside?"},{vi:"Làm sao anh biết?",en:"How do you know?"}],
 micro:{rule:"The course accepts several conversational forms depending on the construction.",examples:[{vi:"Cuối tuần của em sao?",en:"How was your weekend?"}],contrast:"sao can ask why or how; context decides.",check:{q:"“How do you know?”",options:["Làm sao anh biết?","Ở đâu anh biết?"],answer:0},produce:{en:"How do you feel?",vi:"Em thấy sao?"}},requires:["c.question.wh"]},

{id:"c.question.which",unit:"u4",title:"Nào — which",kind:"grammar",
 rule:"The course uses nào to ask which item or choice.",
 examples:[{vi:"Bạn thích cái nào?",en:"Which one do you like?"},{vi:"Món ăn nào là ngon nhất?",en:"Which dish is the best?"}],
 micro:{rule:"Nào normally follows the noun being selected.",examples:[{vi:"Tháng nào vui nhất?",en:"Which month is the most fun?"}],contrast:"gì asks what; nào asks which from a set.",check:{q:"“Which one do you like?”",options:["Bạn thích cái gì?","Bạn thích cái nào?"],answer:1},produce:{en:"Which dish is the best?",vi:"Món ăn nào là ngon nhất?"}},requires:["c.question.wh"]},

{id:"c.question.quantity",unit:"u7",title:"Bao nhiêu and mấy — how much / how many",kind:"grammar",
 rule:"The 15/09 class uses bao nhiêu for how much/how many, bao nhiêu tiền for price, and mấy for a smaller count.",
 examples:[{vi:"Chị cần bao nhiêu tiền?",en:"How much money do you need?"},{vi:"Có mấy trái táo trên bàn?",en:"How many apples are on the table?"},{vi:"Có mấy cái xe hơi ở bãi đậu xe?",en:"How many cars are in the parking lot?"}],
 micro:{rule:"Bao nhiêu is open quantity; mấy usually expects a small count.",examples:[{vi:"Bao nhiêu nước chị uống mỗi ngày?",en:"How much water do you drink every day?"}],contrast:"mấy giờ = what time; bao nhiêu tiền = how much money.",check:{q:"“How much money do you need?”",options:["Chị cần mấy tiền?","Chị cần bao nhiêu tiền?"],answer:1},produce:{en:"How many apples are on the table?",vi:"Có mấy trái táo trên bàn?"}},requires:["c.num.basic","c.question.wh"]},

{id:"c.lex.good",unit:"u10",title:"Choosing the right “good”",kind:"lexicon",
 rule:"The 28/08 and 11/09 classes distinguish tốt for a good person/job, ngon for food, hay for films/music/content, and ngoan for children/animals.",
 examples:[{vi:"Cô ấy là một người tốt.",en:"The lady is a good person."},{vi:"Món ăn này rất ngon.",en:"This dish is delicious."},{vi:"Phim này rất hay.",en:"This movie is very good."},{vi:"Con chó của tôi rất ngoan.",en:"My dog is very good."}],
 micro:{rule:"English good splits according to what is being judged.",examples:[{vi:"Đây là một bài hát hay.",en:"This is a good song."}],contrast:"tốt person/job · ngon food · hay content · ngoan child/animal.",check:{q:"A good movie is:",options:["phim ngon","phim hay","phim ngoan"],answer:1},produce:{en:"This dish is delicious.",vi:"Món ăn này rất ngon."}},requires:["c.sent.adjafter"]},

{id:"c.lex.bad",unit:"u10",title:"Choosing the right “bad”",kind:"lexicon",
 rule:"The classes distinguish xấu for ugly/bad people or appearance, tệ for bad conditions such as weather, dở for bad food/content, and hư for badly behaved children.",
 examples:[{vi:"Cái áo này rất xấu.",en:"This T-shirt is very ugly."},{vi:"Thời tiết hôm nay tệ.",en:"Today's weather is bad."},{vi:"Bộ phim này rất dở.",en:"This movie is bad."},{vi:"Cậu bé này rất hư.",en:"This boy is really bad."}],
 micro:{rule:"Bad is contextual too.",examples:[{vi:"Món ăn này dở.",en:"This dish is bad."}],contrast:"xấu appearance/person · tệ situation/weather · dở content/food · hư child behaviour.",check:{q:"A bad movie is:",options:["phim dở","phim hư","phim tệ người"],answer:0},produce:{en:"Today's weather is bad.",vi:"Thời tiết hôm nay tệ."}},requires:["c.sent.adjafter"]},

{id:"c.south.tui",unit:"u3",title:"Tui — everyday southern I",kind:"pragmatics",
 rule:"The late-course speaking examples repeatedly use tui as an informal southern first-person pronoun.",
 examples:[{vi:"Bữa nay tui thấy buồn quá.",en:"I feel very sad today."},{vi:"Tui thích căn bếp này vì nó rất sạch.",en:"I like this kitchen because it is very clean."}],
 micro:{rule:"Tui is informal southern speech; keep tôi or a relationship pronoun where more distance or respect is needed.",examples:[{vi:"Anh tui cao, còn tui thì lùn.",en:"My brother is tall, but I am short."}],contrast:"tôi neutral/formal · tui casual southern.",check:{q:"Casual southern “I”:",options:["tui","họ"],answer:0},produce:{en:"I feel sad today.",vi:"Bữa nay tui thấy buồn."}},requires:["c.pron.basic"]},

const ContentStore = {

  },
  async addHistory(entry){

function ensureSkill(sk, legacyDue, legacyIvl){

  Object.keys(d).forEach(k => { if (sk[k] === undefined || sk[k] === null) sk[k] = d[k]; });
  if (sk.n > 0 && !sk.due && legacyDue) sk.due = legacyDue;

let CURRENT_TIMING = null;
let ACTIVE_EXERCISE = null;
function basePromptReadingAllowance(type,item){
  const p=TIMING_POLICY[type]||{};
  if(p.mode!=="readingChoice"&&p.mode!=="readingInteraction"&&p.mode!=="typed"&&p.mode!=="free") return 0;
  let en="",vi="";
  if(item){
    en+=" "+(item.en||""); vi+=" "+(item.vi||"");
    if(item.ex){en+=" "+(item.ex.en||"");vi+=" "+(item.ex.vi||"");}
    if(item.dialogue){item.dialogue.lines.slice(0,3).forEach(l=>{en+=" "+(l.en||"");vi+=" "+(l.vi||"");});}
    const c=item.concept&&COURSE.conceptById[item.concept];
    if(type==="judge_concept"&&c&&c.micro&&c.micro.check) en+=" "+c.micro.check.q;
  }
  return Math.min(8000,800+toks(en).length*250+toks(vi).length*350);

function promptReadingAllowance(type,item){
  const base=basePromptReadingAllowance(type,item);

  const f=Math.max(.8,Math.min(1.4,(S.readingCalibration&&S.readingCalibration.factor)||1));

}
function learnReadingCalibration(timing,valid){

  if(["readingChoice","readingInteraction"].indexOf(timing.mode)<0) return;
  /* Learn only from correct, reasonably fluent trials so hesitation is not mistaken for reading speed. */
  if(timing.retrievalMs>4500) return;
  const inferred=Math.max(400,timing.preResponseMs-2500);
  const factor=Math.max(.65,Math.min(1.7,inferred/timing.baseReadingAllowanceMs));
  const rc=S.readingCalibration||(S.readingCalibration={factor:1,samples:[]});
  rc.samples.push(factor); if(rc.samples.length>30)rc.samples.shift();
  if(rc.samples.length>=10){
    const a=rc.samples.slice().sort((x,y)=>x-y), med=a[Math.floor(a.length/2)];

  }
}
function beginTiming(type, item){

  const baseRead=basePromptReadingAllowance(type,item);
  CURRENT_TIMING = {type:type, family:policy.family, mode:policy.mode, speedEligible:!!policy.speed,
    shownAt:now, promptReadyAt:now, firstInteractionAt:0, firstKeyAt:0, firstChoiceAt:0,
    audioStartedAt:0, audioEndedAt:0, answerLockedAt:0, submitAt:0,

  const now = Date.now();
  if (!t.firstInteractionAt) t.firstInteractionAt = now;
  if (kind === "key" && !t.firstKeyAt) t.firstKeyAt = now;
  if (kind === "choice" && !t.firstChoiceAt) t.firstChoiceAt = now;
}
function markAudioStart(rate){

  const now = Date.now();

function markAudioEnd(){
  const t = CURRENT_TIMING;
  if (!t || (t.mode!=="listening" && t.mode!=="listeningTyped") || t.answerLockedAt) return;
  t.audioEndedAt = Date.now();

function bandFromMs(ms){
  if (ms == null || !isFinite(ms)) return "not scored";
  if (ms < 2000) return "automatic";
  if (ms < 4500) return "fluent";
  if (ms < 7000) return "normal";
  if (ms < 12000) return "slow retrieval";
  return "very slow retrieval";
}
function fluencyScoreMs(ms){

  if (ms <= 7000) return 0.85 - (ms-4500)/2500*0.15;

function finalizeTiming(type, item){
  const t = CURRENT_TIMING || {shownAt:Date.now(), readingAllowanceMs:0, speedEligible:false, family:"other", mode:"choice", hiddenTimeMs:0};
  const now = Date.now(); t.submitAt = now;
  if (t.hiddenStartedAt){ t.hiddenTimeMs += now - t.hiddenStartedAt; t.hiddenStartedAt = 0; }
  let rawPoint = t.firstChoiceAt || t.firstInteractionAt || now;

  if (t.mode === "listening" || t.mode === "listeningTyped"){
    const base = t.audioEndedAt || t.audioStartedAt || t.shownAt;
    const point = t.mode === "listeningTyped" ? (t.firstKeyAt || rawPoint) : rawPoint;
    retrieval = Math.max(0, point - base - t.hiddenTimeMs);
    if (t.firstKeyAt) production = Math.max(0, now - t.firstKeyAt);
  } else if (t.mode === "typed" || t.mode === "free"){
    const point = t.firstKeyAt || rawPoint;
    retrieval = Math.max(0, point - t.shownAt - t.hiddenTimeMs - t.readingAllowanceMs);
    if (t.firstKeyAt) production = Math.max(0, now - t.firstKeyAt);

function timingStat(r, family){

function recordTiming(r, timing, valid){

  const st = timingStat(r, timing.family||"other");
  st.n++; st.samples.push(Math.round(timing.retrievalMs));
  if (st.samples.length > 15) st.samples.shift();
  const a = st.samples.slice().sort((x,y)=>x-y);
