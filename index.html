    + speakRow(it.vi, it.ex&&it.ex.vi)
    + (r ? '<div class="skillgrid">'+SKILLS.map(sk =>
        '<div class="sk"><span class="skn">'+esc(sk.label)+'</span>'
        + '<div class="skbar"><i style="width:'+(r.skills[sk.id].m*100)+'%"></i></div>'
        + '<span class="skv">'+Math.round(r.skills[sk.id].m*100)+'%</span></div>').join("")+'</div>'
        + '<div class="hint" style="margin-top:10px">Ladder level '+r.level+' of 10 · '+r.reps+' reviews · '
        + (r.rtN?(r.rtAvg/1000).toFixed(1)+'s average':'no timing yet')
        + (r.produced&&r.produced.length?' · produced unaided '+r.produced.length+'×':'')+'</div>'
      : '<div class="hint" style="margin-top:14px">Not met yet.</div>')
    + (n.text?'<div class="note"><b>Your note.</b> '+esc(n.text)+'</div>':'')
    + noteBar(id)
    + '<div class="next-row" style="margin-top:18px">'
    + (c?'<button class="btn ghost" id="whyC">Why?</button>':'')
    + '<button class="btn" id="drillOne">Drill it</button>'
    + '<button class="btn ghost" id="closeI">Close</button></div>');
  wireSpeak(); wireNotes();
  if ($("#whyC")) $("#whyC").onclick = function(){ closeSheet(); explainSheet(it.concept); };
  $("#drillOne").onclick = function(){ closeSheet();
    drill([it].concat(shuffle(COURSE.itemsByConcept[it.concept]||[]).slice(0,5)), {why:"single"}); };
  $("#closeI").onclick = closeSheet;
}

/* ══ PROGRESS ════════════════════════════════════════════════════════ */
function viewProgress(){
  const p = profile();
  const last = S.diag[S.diag.length-1];
  const days = S.log.slice(-14);
  $("#stage").innerHTML = '<div class="eyebrow">Progress</div><h2 class="screen-h">Honest numbers</h2>'
    + '<div class="card"><div class="twocol">'
    + '<div><div class="bignum">'+(p.knowledge!==null?Math.round(p.knowledge*100):"—")+'<small>%</small></div>'
    + '<div class="eyebrow">Knowledge</div><div class="hint">how accurately you answer</div></div>'
    + '<div><div class="bignum">'+(p.fluency!==null?Math.round(p.fluency*100):"—")+'<small>%</small></div>'
    + '<div class="eyebrow">Fluency</div><div class="hint">how fast you get there</div></div>'
    + '</div></div>'
    + '<div class="group-h" style="margin-top:24px"><span class="eyebrow">By skill</span></div>'
    + SKILLS.map(function(sk){
        const v = p[sk.id];
        return '<div class="skrow"><span class="skn">'+esc(sk.label)+'</span>'
          + '<div class="skbar"><i style="width:'+(v===null?0:v*100)+'%"></i></div>'
          + '<span class="skv">'+(v===null?"—":Math.round(v*100)+"%")+'</span>'
          + '<span class="skc">'+(p[sk.id+"N"]||0)+' items</span></div>';
      }).join("")
    + '<div class="group-h" style="margin-top:24px"><span class="eyebrow">Course map</span></div>'
    + COURSE.units.map(function(u){
        const up = unitProgress(u.id);
        return '<div class="skrow"><span class="skn">'+esc(u.title.split(" · ")[1]||u.title)+'</span>'
          + '<div class="skbar"><i style="width:'+(up.pct*100)+'%"></i></div>'
          + '<span class="skv">'+Math.round(up.pct*100)+'%</span></div>';
      }).join("")
    + (p.south!==null ? '<div class="note south-note" style="margin-top:16px">Southern track: <b>'
        + Math.round(p.south*100)+'%</b> across the southern material.</div>' : '')
    + '<div class="group-h" style="margin-top:24px"><span class="eyebrow">Last 14 days</span></div>'
    + '<div class="spark">'+days.map(function(d){
        const h = Math.max(3, Math.min(40, d.n*1.6));
        return '<span title="'+esc(d.d)+': '+d.n+'" style="height:'+h+'px;opacity:'+(0.35+0.65*(d.ok/Math.max(1,d.n)))+'"></span>';
      }).join("")+'</div>'
    + '<div class="group-h" style="margin-top:24px"><span class="eyebrow">Weekly report</span></div>'
    + (last ? reportHTML(last) : '<div class="empty">No diagnostic run yet.</div>')
    + '<div class="next-row" style="margin-top:18px"><button class="btn" id="runDiag">'
    + (diagnosticDue()?'Run this week\'s diagnostic':'Run a diagnostic anyway')+'</button>'
    + '<button class="btn ghost" id="openSet">Settings</button></div>';
  $("#runDiag").onclick = runDiagnostic;
  $("#openSet").onclick = settingsSheet;
}
function reportHTML(d){
  const when = new Date(d.at).toISOString().slice(0,10);
  const row = (t, v) => '<div class="rrow"><span class="rt">'+esc(t)+'</span><span class="rv">'
    + (v && v.length ? esc(Array.isArray(v)?v.join(" · "):v) : "—")+'</span></div>';
  return '<div class="report"><div class="eyebrow">Alexandre · '+esc(when)+'</div>'
    + '<div class="hint" style="margin-bottom:10px">'+d.correct+' of '+d.n+' correct across every skill.</div>'
    + row("Strong", d.strong) + row("Needs work", d.needs) + row("Forgotten", d.forgot)
    + row("Slow recall", d.slow) + row("Next week", d.next) + '</div>';
}
function runDiagnostic(){
  const plan = buildDiagnostic();
  if (!plan.length) return alert("Not enough material has been met yet for a diagnostic.");
  startSession(plan.map(x => ({it:x.it, force:x.force, skill:x.skill, why:"diagnostic"})), {mode:"diagnostic"});
}
function renderDiagnosticReport(results){
  const entry = closeDiagnostic(results);
  $("#stage").innerHTML = card(label("Weekly report", "diagnostic complete")
    + '<div class="score">'+entry.correct+'<small> / '+entry.n+'</small></div>'
    + reportHTML(entry)
    + tutorBlock()
    + '<div class="next-row" style="margin-top:20px"><button class="btn" id="back">Back to today</button></div>');
  $("#back").onclick = function(){ go("today"); };
}

/* ══ sheets, settings, wiring ════════════════════════════════════════ */
function openSheet(html){ $("#sheet").innerHTML = html; $("#scrim").classList.add("open"); }
function closeSheet(){ $("#scrim").classList.remove("open"); }

function voiceSheet(){
  TTS.refresh();
  let html = '<div class="eyebrow">Audio</div><h2 class="sheet-h">Giọng đọc · voice</h2>';
  if (!("speechSynthesis" in window)){
    html += '<div class="warn">This browser has no speech engine. Everything else still works.</div>';
  } else if (!TTS.voices.length){
    html += '<div class="warn"><b>No Vietnamese voice on this device.</b><br>Install <b>Vi Vu</b>, the southern '
      + 'RHVoice voice, and the browser picks it up here.<br><br><b>Android:</b> install RHVoice, choose Tiếng Việt, '
      + 'install Vi Vu, then set RHVoice as the system engine under Settings → Accessibility → Text-to-speech output.'
      + '<br><br><a href="https://louderpages.org/vi-vu" target="_blank" rel="noopener">louderpages.org/vi-vu →</a></div>';
  } else {
    html += '<div class="field"><label>Voice</label><select id="vsel">'
      + TTS.voices.map(v => '<option value="'+esc(v.name)+'"'+(TTS.current&&v.name===TTS.current.name?" selected":"")+'>'
          + esc(v.name)+' — '+esc(v.lang)+'</option>').join("")+'</select></div>'
      + '<div class="field"><label>Speed · '+S.rate.toFixed(2)+'×</label>'
      + '<input type="range" id="vrate" min="0.5" max="1.2" step="0.05" value="'+S.rate+'"></div>'
      + seg("Play automatically", "ap", S.autoplay)
      + seg("Read the whole sentence", "rs", S.readSentence)
      + '<div class="hint" style="margin-top:8px">On: whenever a card carries an example sentence you hear the word and then the sentence.</div>'
      + '<div class="next-row"><button class="btn ghost" id="vtest">▶ Trời mưa, nhớ mang dù nha.</button></div>';
    const nm = (TTS.current&&TTS.current.name)||"";
    html += /vi[\s_-]?vu/i.test(nm)
      ? '<div class="ok-note">Vi Vu is doing the talking — the southern accent you are learning.</div>'
      : /rhvoice/i.test(nm)
      ? '<div class="ok-note">RHVoice is talking. If Vi Vu is what you chose in the RHVoice app, this is it.</div>'
      : '<div class="warn">This voice does not name its engine. On Android that is normal. If you installed RHVoice and '
        + 'picked Vi Vu, set RHVoice as the system engine in Accessibility → Text-to-speech output.</div>';
  }
  html += '<div class="field" style="margin-top:22px"><label>Tone marks</label><div class="legend">'
    + ["ngang","huyen","sac","hoi","nga","nang"].map(k=>'<div>'+toneSvg(k)+'<b>'+TONE_NAME[k]+'</b></div>').join("")
    + '</div><div class="hint" style="margin-top:10px">In the south hỏi and ngã are one tone. The dot marks the one spelled with ngã.</div></div>'
    + '<div class="next-row" style="margin-top:20px"><button class="btn" id="closeV">Close</button></div>';
  openSheet(html);
  if ($("#vsel")) $("#vsel").onchange = function(){ S.voice = this.value; TTS.refresh(); save(); voiceSheet(); };
  if ($("#vrate")) $("#vrate").oninput = function(){ S.rate = parseFloat(this.value); save();
    this.previousElementSibling.textContent = "Speed · "+S.rate.toFixed(2)+"×"; };
  wireSeg("ap", v => { S.autoplay = v; save(); voiceSheet(); });
  wireSeg("rs", v => { S.readSentence = v; save(); voiceSheet(); });
  if ($("#vtest")) $("#vtest").onclick = function(){ TTS.say("Trời mưa, nhớ mang dù nha."); };
  $("#closeV").onclick = closeSheet;
}
function seg(lbl, k, on){
  return '<div class="field"><label>'+esc(lbl)+'</label><div class="seg">'
    + '<button data-seg="'+k+'" data-v="1" aria-pressed="'+(on?"true":"false")+'">On</button>'
    + '<button data-seg="'+k+'" data-v="0" aria-pressed="'+(!on?"true":"false")+'">Off</button></div></div>';
}
function wireSeg(k, cb){ $$('[data-seg="'+k+'"]').forEach(b => b.onclick = function(){ cb(b.dataset.v === "1"); }); }

function settingsSheet(){
  const n = storeNote();
  openSheet('<div class="eyebrow">Settings</div><h2 class="sheet-h">How the engine behaves</h2>'
    + '<div class="field"><label>Daily target · '+S.dailyMinutes+' minutes</label>'
    + '<input type="range" id="dm" min="5" max="40" step="1" value="'+S.dailyMinutes+'"></div>'
    + seg("Southern mode", "sm", S.southernMode)
    + '<div class="hint" style="margin-top:8px">On: southern words, sounds and particles get priority in the daily mix. '
    + 'The written form is always shown alongside.</div>'
    + '<div class="field"><label>How a card is scheduled</label><div class="hint" style="line-height:1.75">'
    + 'Every item carries five separate skills — recognition, recall, production, listening, contextual use — and the '
    + 'engine always asks about the weakest one that is ready. A correct answer only strengthens the skill it tested. '
    + 'Speed and confidence both change the interval: a right answer you guessed comes back in a day, a right answer '
    + 'you knew instantly goes out several. Fail and it returns within the hour, then tomorrow, then later.</div></div>'
    + '<div class="field"><label>Where your progress lives</label><div class="'+n.cls+'">'+n.txt+'</div></div>'
    + '<div class="field"><label>Backup</label>'
    + '<textarea class="box" id="dump" spellcheck="false">'+esc(JSON.stringify(S))+'</textarea>'
    + '<div class="next-row"><button class="btn ghost" id="copyD">Copy</button>'
    + '<button class="btn ghost" id="loadD">Restore</button></div></div>'
    + '<div class="next-row" style="margin-top:18px"><button class="btn ghost" id="reset">Reset progress</button>'
    + '<button class="btn" id="closeS">Close</button></div>');
  $("#dm").oninput = function(){ S.dailyMinutes = parseInt(this.value,10); save();
    this.previousElementSibling.textContent = "Daily target · "+S.dailyMinutes+" minutes"; };
  wireSeg("sm", v => { S.southernMode = v; save(); settingsSheet(); });
  $("#copyD").onclick = function(){ const t=$("#dump"); t.select();
    try{ navigator.clipboard.writeText(t.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
    $("#copyD").textContent = "Copied"; };
  $("#loadD").onclick = function(){
    try{ const o = JSON.parse($("#dump").value);
      if (!o || !o.rev) throw new Error("shape");
      Object.assign(S, o); save(); closeSheet(); go("today");
    }catch(e){ $("#loadD").textContent = "Not a valid backup"; }
  };
  $("#reset").onclick = function(){
    if (!confirm("Clear every review record, note and mistake? The course itself stays.")) return;
    S.rev = {}; S.concept = {}; S.mistakes = []; S.notes = {}; S.log = []; S.diag = [];
    S.xp = 0; S.streak = 0; S.streakDay = null; save(); closeSheet(); go("today");
  };
  $("#closeS").onclick = closeSheet;
}

/* ── boot ─────────────────────────────────────────────────────────────── */
document.addEventListener("keydown", function(e){
  const t = e.target;
  if (t && (t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA")) return;
  if ($("#scrim").classList.contains("open")){ if (e.key==="Escape") closeSheet(); return; }
  if (keyHandler) keyHandler(e);
});
$("#scrim").onclick = function(e){ if (e.target === $("#scrim")) closeSheet(); };
$("#voiceBtn").onclick = voiceSheet;
$("#setBtn").onclick = settingsSheet;
$("#nav").innerHTML = NAV.map(n => '<button data-v="'+n.id+'" aria-selected="'+(n.id==="today")+'">'+esc(n.label)+'</button>').join("");
$$("#nav button").forEach(b => b.onclick = function(){ go(b.dataset.v); });

(async function init(){
  await load();
  TTS.refresh();
  go("today");
  setTimeout(function(){ TTS.refresh(); paintStats(); }, 700);
  setTimeout(function(){ TTS.refresh(); paintStats(); }, 2500);
})();
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

</script>
